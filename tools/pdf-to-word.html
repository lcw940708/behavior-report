    <style>
        :root {
            --bg: #0b0f19;

        * {

        body {

        .container {
            max-width: 720px;

        .lang-switch {

        .lang-switch a {

        .status-box .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }

        .btn-group {
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover {
            background: #67e8f9;
            transform: translateY(-1px);

        .btn-primary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.25);

        }
        .btn-outline:hover {
            border-color: var(--cyan);

        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;

        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #cbd5e1;

        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;

            font-size: 11px;

        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
            .btn {
                flex: none;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <a onclick="switchLang('hk')">🇭🇰 港版</a> |
            <a onclick="switchLang('tw')">🇹🇼 台版</a> |

        <h1 class="tool-title" id="toolTitle">📄 PDF 轉 Word 工具</h1>

        <div class="badge-row">

        <div class="btn-group" id="btnGroup">

        <div class="story-suggest">

                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.min.js">
    </script>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '📄 PDF 轉 Word 工具',
                sub: '上傳 PDF，自動轉換成 Word (DOCX) 檔案',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 本地處理',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                upload: '拖曳 PDF 檔案到這裡，或點擊揀選',
                hint: '只支援 PDF 檔案',
                download: '⬇️ 下載 Word (DOCX)',
                reset: '🔄 重新揀選',
                converting: '<span class="spinner">⟳</span> 正在轉換中，請稍候...',
                success: '✅ 轉換完成！',
                error: '❌ 轉換失敗，請再試一次',
                libraryError: '❌ 缺少必要 Library，請檢查網絡連線後重新整理',
                notPDF: '請上傳 PDF 檔案',
                noText: '無法從 PDF 提取文字，可能係掃描檔案'
            },
            tw: {
                title: '📄 PDF 轉 Word 工具',
                sub: '上傳 PDF，自動轉換成 Word (DOCX) 檔案',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 本地處理',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                upload: '拖曳 PDF 檔案到這裡，或點擊選擇',
                hint: '只支援 PDF 檔案',
                download: '⬇️ 下載 Word (DOCX)',
                reset: '🔄 重新選擇',
                converting: '<span class="spinner">⟳</span> 正在轉換中，請稍候...',
                success: '✅ 轉換完成！',
                error: '❌ 轉換失敗，請再試一次',
                libraryError: '❌ 缺少必要 Library，請檢查網路連線後重新整理',
                notPDF: '請上傳 PDF 檔案',
                noText: '無法從 PDF 提取文字，可能為掃描檔案'
            },
            en: {
                title: '📄 PDF to Word Converter',
                sub: 'Upload PDF, automatically convert to Word (DOCX)',
                badge1: '🔒 Privacy Safe',
                badge2: '⚡ Local Processing',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                upload: 'Drag & drop your PDF here, or click to select',
                hint: 'PDF files only',
                download: '⬇️ Download Word (DOCX)',
                reset: '🔄 Reset',
                converting: '<span class="spinner">⟳</span> Converting, please wait...',
                success: '✅ Conversion complete!',
                error: '❌ Conversion failed, please try again',
                libraryError: '❌ Missing required library, please refresh and check your internet connection',
                notPDF: 'Please upload a PDF file',
                noText: 'Cannot extract text from PDF, it may be a scanned document'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('downloadBtn').innerHTML = t.download;
            document.getElementById('resetBtn').innerHTML = t.reset;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });

            // Update status if visible
            const statusBox = document.getElementById('statusBox');
            if (statusBox.classList.contains('show')) {
                const currentText = statusBox.innerHTML;
                // Keep the same type but update text if it's a known state
                if (currentText.includes('⟳')) {
                    statusBox.innerHTML = t.converting;
                } else if (currentText.includes('✅')) {
                    statusBox.innerHTML = t.success;
                } else if (currentText.includes('❌') || currentText.includes('缺少')) {
                    // Keep error but update text based on content
                }
            }
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 設置 PDF.js Worker
        // =============================================================
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function checkLibraries() {
            const errors = [];
            if (typeof pdfjsLib === 'undefined') errors.push('pdf.js');
            if (typeof docx === 'undefined') errors.push('docx');
            if (typeof saveAs === 'undefined') errors.push('FileSaver');
            if (errors.length > 0) {
                console.error('缺少 library:', errors);
                return false;
            }
            return true;
        }

        // =============================================================
        // DOM 元素
        // =============================================================
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const statusBox = document.getElementById('statusBox');
        const btnGroup = document.getElementById('btnGroup');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        let currentFile = null;
        let resultBlob = null;
        let isProcessing = false;

        function showStatus(message, type) {
            statusBox.className = 'status-box show ' + type;
            statusBox.innerHTML = message;
        }

        function hideStatus() {
            statusBox.classList.remove('show');
        }

        // =============================================================
        // 核心轉換函數
        // =============================================================
        async function convertPDFToWord(file) {
            const t = texts[lang];
            if (typeof docx === 'undefined') {
                throw new Error(t.libraryError);
            }

            const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n\n';
            }

            if (fullText.trim().length === 0) {
                throw new Error(t.noText);
            }

            const children = [];
            const lines = fullText.split('\n');

            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.length === 0) {
                    children.push(new Paragraph({ text: '' }));
                    continue;
                }

                const isHeading = trimmed.length < 30 &&
                    (trimmed === trimmed.toUpperCase() ||
                        trimmed.startsWith('第') ||
                        trimmed.match(/^[0-9]\./));

                if (isHeading) {
                    children.push(new Paragraph({
                        text: trimmed,
                        heading: HeadingLevel.HEADING_2,
                        spacing: { before: 200, after: 100 }
                    }));
                } else {
                    children.push(new Paragraph({
                        children: [new TextRun({ text: trimmed, size: 24 })],
                        spacing: { after: 120 }
                    }));
                }
            }

            const doc = new Document({
                sections: [{
                    properties: {},
                    children: children
                }]
            });

            return await Packer.toBlob(doc);
        }

        // =============================================================
        // 處理上傳
        // =============================================================
        async function handleFile(file) {
            const t = texts[lang];

            if (!file || file.type !== 'application/pdf') {
                alert(t.notPDF);
                return;
            }

            if (isProcessing) return;
            isProcessing = true;

            if (!checkLibraries()) {
                showStatus(t.libraryError, 'error');
                isProcessing = false;
                return;
            }

            currentFile = file;
            btnGroup.classList.remove('show');
            hideStatus();

            showStatus(t.converting, 'loading');

            try {
                resultBlob = await convertPDFToWord(file);
                showStatus(t.success, 'success');
                btnGroup.classList.add('show');
            } catch (err) {
                console.error('轉換錯誤:', err);
                showStatus('❌ ' + (err.message || t.error), 'error');
            } finally {
                isProcessing = false;
            }
        }

        // =============================================================
        // 事件綁定
        // =============================================================
        downloadBtn.addEventListener('click', () => {
            if (!resultBlob) return;
            const baseName = currentFile ? currentFile.name.replace(/\.pdf$/i, '') : 'document';
            saveAs(resultBlob, baseName + '.docx');
        });

        resetBtn.addEventListener('click', () => {
            currentFile = null;
            resultBlob = null;
            btnGroup.classList.remove('show');
            hideStatus();
            fileInput.value = '';
        });

        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('dragover');
        });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        console.log('📄 PDF 轉 Word 工具已就緒');
    </script>
</body>

            --red: #ef4444;
            --success: #10b981;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            flex-direction: column;
            align-items: center;
            min-height: 100vh;

        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }

        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
        }
        .tool-title .emoji {
            font-size: 1.8rem;
        }

        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        /* ===== Upload ===== */
        .upload-area {
            border: 2px dashed rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.02);
        }
        .upload-area:hover {
            border-color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }
        .upload-area.dragover {
            border-color: var(--cyan);
            background: rgba(34, 211, 238, 0.08);
        }
        .upload-area .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }
        .upload-area p {
            font-size: 1rem;
            color: var(--text-light);
        }
        .upload-area .hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
        }
        #fileInput {
            display: none;
        }

        /* ===== 控制區 ===== */
        .controls {
            margin-top: 25px;
            display: none;
            flex-direction: column;
            gap: 18px;
        }
        .controls.show {
            display: flex;
        }

            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #64748b;
            padding: 10px 14px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .info-bar .label {
            color: var(--text-light);
        }
        .info-bar .value {
            color: var(--cyan);
            font-weight: bold;
        }

        .size-inputs {

            gap: 16px;
            flex-wrap: wrap;

        }
        .size-inputs .field {

        .size-inputs .field label {

            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
        }
        .size-inputs .field input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-light);
            font-size: 1rem;
            outline: none;

        }
        .size-inputs .field input:focus {

        .size-inputs .field input:disabled {

            font-size: 0.85rem;
            color: var(--text-light);

            height: 18px;

            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {

            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--cyan-hover);

        }

        .btn-success {
            background: var(--success);
            color: #0b0f19;
        }
        .btn-success:hover:not(:disabled) {

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        /* ===== 預覽 ===== */
        .preview-row {
            display: none;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 5px;
            padding: 16px;
            background: var(--bg);

            border: 1px solid var(--border);
        }
        .preview-row.show {

</head>

        // =============================================================

                upload: '拖曳圖片到這裡，或點擊選擇檔案',

        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('origDimLabel').innerText = t.origDim;
            document.getElementById('origSizeLabel').innerText = t.origSize;
            document.getElementById('widthLabel').innerText = t.width;
            document.getElementById('heightLabel').innerText = t.height;
            document.getElementById('keepRatioLabel').innerHTML = t.keepRatio;
            document.getElementById('resizeText').innerText = t.resize;
            document.getElementById('resetText').innerText = t.reset;
            document.getElementById('removeText').innerText = t.remove;
            document.getElementById('originalLabel').innerText = t.original;
            document.getElementById('resultLabel').innerText = t.result;
            document.getElementById('downloadText').innerText = t.download;
            document.getElementById('outputFormat').innerText = t.outputFormat;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const originalDimensions = document.getElementById('originalDimensions');
        const originalFileSize = document.getElementById('originalFileSize');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const keepRatio = document.getElementById('keepRatio');
        const resizeBtn = document.getElementById('resizeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const removeBtn = document.getElementById('removeBtn');
        const previewRow = document.getElementById('previewRow');
        const originalPreview = document.getElementById('originalPreview');
        const resultPreview = document.getElementById('resultPreview');
        const originalDimInfo = document.getElementById('originalDimInfo');
        const resultDimInfo = document.getElementById('resultDimInfo');
        const originalSizeInfo = document.getElementById('originalSizeInfo');
        const resultSizeInfo = document.getElementById('resultSizeInfo');
        const downloadBtn = document.getElementById('downloadBtn');

        let img = null;
        let currentFile = null;
        let resultDataURL = null;
        let resultWidth = 0;
        let resultHeight = 0;
        let originalWidth = 0;
        let originalHeight = 0;
        let isUpdating = false;

        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const t = texts[lang];
            if (!file.type.startsWith('image/')) {
                alert(t.notImage);
                return;
            }
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataURL = e.target.result;
                loadImage(dataURL);
            };
            reader.readAsDataURL(file);
        }

        function loadImage(dataURL) {
            const tempImg = new Image();
            tempImg.onload = function() {
                img = tempImg;
                originalWidth = img.naturalWidth;
                originalHeight = img.naturalHeight;

                originalPreview.src = dataURL;
                originalDimensions.innerText = `${originalWidth} × ${originalHeight}`;
                originalFileSize.innerText = formatSize(currentFile.size);
                originalDimInfo.innerText = `${originalWidth} × ${originalHeight}`;
                originalSizeInfo.innerText = formatSize(currentFile.size);

                widthInput.value = originalWidth;
                heightInput.value = originalHeight;

                controls.classList.add('show');
                previewRow.classList.remove('show');
                resultPreview.src = '';
                resultDimInfo.innerText = '';
                resultSizeInfo.innerText = '';
                downloadBtn.disabled = true;
                resultDataURL = null;
            };
            tempImg.src = dataURL;
        }

        widthInput.addEventListener('input', function() {
            const t = texts[lang];
            if (isUpdating) return;
            if (keepRatio.checked && img && this.value) {
                isUpdating = true;
                const ratio = originalWidth / originalHeight;
                const newWidth = parseInt(this.value) || 0;
                if (newWidth > 0) {
                    heightInput.value = Math.round(newWidth / ratio);
                }
                isUpdating = false;
            }
        });

        heightInput.addEventListener('input', function() {
            if (isUpdating) return;
            if (keepRatio.checked && img && this.value) {
                isUpdating = true;
                const ratio = originalWidth / originalHeight;
                const newHeight = parseInt(this.value) || 0;
                if (newHeight > 0) {
                    widthInput.value = Math.round(newHeight * ratio);
                }
                isUpdating = false;
            }
        });

        keepRatio.addEventListener('change', function() {
            if (this.checked && img) {
                widthInput.value = originalWidth;
                heightInput.value = originalHeight;
            }
        });

        resetBtn.addEventListener('click', function() {
            if (!img) return;
            widthInput.value = originalWidth;
            heightInput.value = originalHeight;
            previewRow.classList.remove('show');
            resultPreview.src = '';
            resultDimInfo.innerText = '';
            resultSizeInfo.innerText = '';
            downloadBtn.disabled = true;
            resultDataURL = null;
        });

        removeBtn.addEventListener('click', function() {
            img = null;
            currentFile = null;
            controls.classList.remove('show');
            previewRow.classList.remove('show');
            originalPreview.src = '';
            resultPreview.src = '';
            originalDimensions.innerText = '-- × --';
            originalFileSize.innerText = '--';
            originalDimInfo.innerText = '';
            originalSizeInfo.innerText = '';
            resultDimInfo.innerText = '';
            resultSizeInfo.innerText = '';
            downloadBtn.disabled = true;
            resultDataURL = null;
            widthInput.value = '';
            heightInput.value = '';
            fileInput.value = '';
        });

        function performResize() {
            const t = texts[lang];
            if (!img) return;

            const newWidth = parseInt(widthInput.value) || 0;
            const newHeight = parseInt(heightInput.value) || 0;

            if (newWidth < 1 || newHeight < 1) {
                alert(t.enterValid);
                return;
            }

            if (newWidth > 10000 || newHeight > 10000) {
                alert(t.tooLarge);
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = newWidth;
            canvas.height = newHeight;
            const ctx = canvas.getContext('2d');

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, newWidth, newHeight);

            resultDataURL = canvas.toDataURL('image/png');
            resultWidth = newWidth;
            resultHeight = newHeight;

            resultPreview.src = resultDataURL;
            resultDimInfo.innerText = `${newWidth} × ${newHeight}`;

            const base64 = resultDataURL.split(',')[1];
            const sizeInBytes = Math.round((base64.length * 3) / 4);
            resultSizeInfo.innerText = formatSize(sizeInBytes);

            previewRow.classList.add('show');
            downloadBtn.disabled = false;
        }

        function downloadResult() {
            if (!resultDataURL) return;
            const link = document.createElement('a');
            const baseName = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'resized';
            link.download = baseName + `_${resultWidth}x${resultHeight}.png`;
            link.href = resultDataURL;
            link.click();
        }

        function formatSize(bytes) {
            const t = texts[lang];
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' ' + t.format;
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        resizeBtn.addEventListener('click', performResize);
        downloadBtn.addEventListener('click', downloadResult);

        widthInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performResize();
        });
        heightInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performResize();
        });
    </script>

</body>

</html>

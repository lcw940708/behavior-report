<body>

    <div class="calculator-grid">

        <div class="panel">
            <h2 class="panel-title" id="inputPanelTitle">⚙️ 帳單與分攤設定</h2>

            <div class="form-group">
                <label id="lblBill" for="billAmount">帳單原始總額 ($)</label>

            <!-- 小費快速按鈕與自訂輸入 -->

                    <button type="button" class="tip-btn active" data-tip="10">10%</button>
                    <button type="button" class="tip-btn" data-tip="15">15%</button>
                    <button type="button" class="tip-btn" data-tip="20">20%</button>
                </div>

<script>
document.addEventListener('DOMContentLoaded', function() {

    // 介面語言多語系翻譯
    const i18n = {
        zh: {
            back: "← 文章列表",
            title: "🍽️ 小費與帳單分攤計算器",
            desc: "輸入帳單總額、小費百分比及聚會人數，即時算清小費總額與每人應付的 AA 制金額。",
            inputTitle: "⚙️ 帳單與分攤設定",
            lblBill: "帳單原始總額 ($)",
            lblTipPercent: "小費百分比 (%)",
            lblPeople: "分攤人數 (人)",
            unitPeople: "人",
            btnCalc: "即時計算",
            resultTitle: "📊 分攤結果與細項",
            verdictHeader: "每人應付總額 (PER PERSON)",
            lblTipTotal: "💡 小費總額",
            lblGrandTotal: "🧾 含小費總帳單",
            lblBreakdownTitle: "📋 每人消費明細拆拆 Breakdown",
            tdPerPersonBase: "每人餐費本金:",
            tdPerPersonTip: "每人分攤小費:",
            tdTotalPeople: "總參與分攤人數:",
            subPrefix: "包含小費每人負擔 ",
            unitPersonSuffix: " 人",
            footHome: "主頁",
            footBlog: "最新文章",
            footAbout: "關於我",
            footPrivacy: "隱私權政策"
        },
        en: {
            back: "← Articles",
            title: "🍽️ Tip & Split Bill Calculator",
            desc: "Calculate total tips, grand total, and equal split per person effortlessly.",
            inputTitle: "⚙️ Bill & Split Settings",
            lblBill: "Original Bill Amount ($)",
            lblTipPercent: "Tip Percentage (%)",
            lblPeople: "Split Persons",
            unitPeople: "persons",
            btnCalc: "Calculate Now",
            resultTitle: "📊 Split Result Breakdown",
            verdictHeader: "AMOUNT PER PERSON",
            lblTipTotal: "💡 Total Tip",
            lblGrandTotal: "🧾 Grand Total",
            lblBreakdownTitle: "📋 Detailed Breakdown per Person",
            tdPerPersonBase: "Base Bill per Person:",
            tdPerPersonTip: "Tip per Person:",
            tdTotalPeople: "Total People:",
            subPrefix: "Includes tip of ",
            unitPersonSuffix: " persons",
            footHome: "Home",
            footBlog: "Blog",
            footAbout: "About",
            footPrivacy: "Privacy Policy"
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let currentLang = urlParams.get('lang') || 'hk';

    function formatCurrency(amount) {
        return '$' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // 主計算邏輯
    function calculateSplit() {
        const bill = parseFloat(document.getElementById('billAmount').value) || 0;
        const tipRate = (parseFloat(document.getElementById('customTip').value) || 0) / 100;
        const people = Math.max(1, parseInt(document.getElementById('peopleCount').value) || 1);

        const tipTotal = bill * tipRate;
        const grandTotal = bill + tipTotal;
        
        const perPersonTotal = grandTotal / people;
        const perPersonBase = bill / people;
        const perPersonTip = tipTotal / people;

        const isEn = (currentLang === 'en');
        const langData = isEn ? i18n.en : i18n.zh;

        // UI 渲染
        document.getElementById('valPerPerson').textContent = formatCurrency(perPersonTotal);
        document.getElementById('valTipTotal').textContent = formatCurrency(tipTotal);
        document.getElementById('valGrandTotal').textContent = formatCurrency(grandTotal);

        document.getElementById('verdictSub').textContent = `${langData.subPrefix}${formatCurrency(perPersonTip)}`;
        
        document.getElementById('valPerPersonBase').textContent = formatCurrency(perPersonBase);
        document.getElementById('valPerPersonTip').textContent = formatCurrency(perPersonTip);
        document.getElementById('valTotalPeople').textContent = `${people} ${langData.unitPersonSuffix}`;
    }

    // 多語系渲染
    function renderPage(langKey) {
        currentLang = langKey;
        const isEn = (langKey === 'en');
        const langData = isEn ? i18n.en : i18n.zh;

        document.getElementById('backLink').textContent = langData.back;
        document.getElementById('pageTitle').textContent = langData.title;
        document.getElementById('pageDesc').textContent = langData.desc;
        document.getElementById('inputPanelTitle').textContent = langData.inputTitle;

        document.getElementById('lblBill').textContent = langData.lblBill;
        document.getElementById('lblTipPercent').textContent = langData.lblTipPercent;
        document.getElementById('lblPeople').textContent = langData.lblPeople;
        document.getElementById('unitPeople').textContent = langData.unitPeople;

        document.getElementById('btnCalculate').textContent = langData.btnCalc;
        document.getElementById('resultPanelTitle').textContent = langData.resultTitle;
        document.getElementById('verdictHeader').textContent = langData.verdictHeader;

        document.getElementById('lblTipTotal').textContent = langData.lblTipTotal;
        document.getElementById('lblGrandTotal').textContent = langData.lblGrandTotal;
        document.getElementById('lblBreakdownTitle').textContent = langData.lblBreakdownTitle;

        document.getElementById('tdPerPersonBase').textContent = langData.tdPerPersonBase;
        document.getElementById('tdPerPersonTip').textContent = langData.tdPerPersonTip;
        document.getElementById('tdTotalPeople').textContent = langData.tdTotalPeople;

        document.getElementById('footHome').textContent = langData.footHome;
        document.getElementById('footBlog').textContent = langData.footBlog;
        document.getElementById('footAbout').textContent = langData.footAbout;
        document.getElementById('footPrivacy').textContent = langData.footPrivacy;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === langKey) {
                btn.classList.add('active');
            }
        });

        calculateSplit();
    }

    // 事件監聽：小費按鈕快選
    document.querySelectorAll('.tip-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('customTip').value = this.dataset.tip;
            calculateSplit();
        });
    });

    // 事件監聽：輸入連動
    document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('input', function() {
            if (this.id === 'customTip') {
                const val = this.value;
                document.querySelectorAll('.tip-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.tip === val);
                });
            }
            calculateSplit();
        });
    });

    document.getElementById('btnCalculate').addEventListener('click', calculateSplit);

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const selectedLang = this.dataset.lang;
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', selectedLang);
            window.history.pushState({}, '', newUrl);
            renderPage(selectedLang);
        });
    });

    renderPage(currentLang);
});
</script>
<!-- 語言參數接收與傳遞 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const lang = urlParams.get('lang');
    if (lang) {
        if (typeof setLang === 'function') {
            setLang(lang);
        }
        document.querySelectorAll('a[href]').forEach(function(link) {
            const href = link.getAttribute('href');
            if (href && href.startsWith('../')) {
                const url = new URL(href, window.location.href);
                url.searchParams.set('lang', lang);
                link.setAttribute('href', url.toString());
            }
        });
    }
});
</script>

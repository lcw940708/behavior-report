        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;

            document.getElementById('hexLabel').innerText = t.hexLabel;
            document.getElementById('rgbLabel').innerText = t.rgbLabel;
            document.getElementById('hslLabel').innerText = t.hslLabel;

            // Update status text based on current state
            if (isActive) {
                document.getElementById('activateBtn').innerHTML = t.deactivate;
                statusText.innerHTML = t.statusActive;
            } else {
                document.getElementById('activateBtn').innerHTML = t.activate;
                if (!window.EyeDropper) {
                    statusText.innerHTML = t.statusNoSupport;
                } else {
                    statusText.innerHTML = t.statusInitial;
                }
            }
            document.getElementById('resetBtn').innerHTML = t.reset;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {

                    url.searchParams.set('lang', l);
                    a.href = url.toString();

            });

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        // =============================================================
        // 工具核心
        // =============================================================
        const colorPreview = document.getElementById('colorPreview');
        const hexValue = document.getElementById('hexValue');
        const rgbValue = document.getElementById('rgbValue');
        const hslValue = document.getElementById('hslValue');
        const activateBtn = document.getElementById('activateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const hexItem = document.getElementById('hexItem');
        const rgbItem = document.getElementById('rgbItem');
        const hslItem = document.getElementById('hslItem');

        let isActive = false;
        let currentHex = '#22d3ee';
        let currentRgb = { r: 34, g: 211, b: 238 };
        let currentHsl = { h: 187, s: 86, l: 53 };

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHsl(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r:
                        h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
                        break;
                    case g:
                        h = ((b - r) / d + 2) / 6;
                        break;
                    case b:
                        h = ((r - g) / d + 4) / 6;
                        break;
                }
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(c => {
                const hex = c.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        function updateColor(hex) {
            currentHex = hex;
            const rgb = hexToRgb(hex);
            currentRgb = rgb;
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            currentHsl = hsl;

            colorPreview.style.background = hex;
            const currentColor = document.getElementById('currentColor');
            if (currentColor) currentColor.textContent = hex;
            hexValue.textContent = hex;
            rgbValue.textContent = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            hslValue.textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;

            document.querySelectorAll('.code-item').forEach(el => el.classList.remove('copied'));
        }

        function activatePicker() {
            const t = texts[lang];
            if (isActive) {
                deactivatePicker();
                return;
            }

            isActive = true;
            activateBtn.innerHTML = t.deactivate;
            activateBtn.style.borderColor = 'var(--red)';
            statusBar.classList.add('show');
            statusText.innerHTML = t.statusActive;
            document.body.style.cursor = 'crosshair';

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onColorPick);
        }

            const t = texts[lang];
            isActive = false;
            activateBtn.innerHTML = t.activate;
            activateBtn.style.borderColor = '';
            statusBar.classList.remove('show');
            document.body.style.cursor = '';

            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('click', onColorPick);
        }

        function onMouseMove(e) {
            if (!isActive) return;
        }

        function onColorPick(e) {
            const t = texts[lang];
            if (!isActive) return;
            e.preventDefault();

            if (window.EyeDropper) {
                const eyeDropper = new EyeDropper();
                eyeDropper.open()
                    .then(result => {
                        const hex = result.sRGBHex;
                        updateColor(hex);
                        statusText.innerHTML = t.statusPicked + `<strong>${hex}</strong>`;
                        setTimeout(() => {
                            if (isActive) {
                                statusText.innerHTML = t.statusActive;
                            }
                        }, 2000);
                    })
                    .catch(err => {
                        if (err.message !== 'User cancelled') {
                            console.error('EyeDropper 錯誤:', err);
                        }
                    });
                return;
            }

            alert(t.noSupportAlert);
            deactivatePicker();
        }

        function copyText(text, element) {
            const t = texts[lang];
            navigator.clipboard.writeText(text).then(() => {
                document.querySelectorAll('.code-item').forEach(el => el.classList.remove('copied'));
                element.classList.add('copied');
                setTimeout(() => {
                    element.classList.remove('copied');
                }, 1500);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                document.querySelectorAll('.code-item').forEach(el => el.classList.remove('copied'));
                element.classList.add('copied');
                setTimeout(() => {
                    element.classList.remove('copied');
                }, 1500);
            });
        }

        hexItem.addEventListener('click', function() {
            copyText(currentHex, this);
        });

        rgbItem.addEventListener('click', function() {
            copyText(`rgb(${currentRgb.r}, ${currentRgb.g}, ${currentRgb.b})`, this);
        });

        hslItem.addEventListener('click', function() {
            copyText(`hsl(${currentHsl.h}, ${currentHsl.s}%, ${currentHsl.l}%)`, this);
        });

        resetBtn.addEventListener('click', function() {
            const t = texts[lang];
            if (isActive) deactivatePicker();
            updateColor('#22d3ee');
            statusBar.classList.remove('show');
            activateBtn.innerHTML = t.activate;
        });

        activateBtn.addEventListener('click', activatePicker);

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        if (!window.EyeDropper) {
            const t = texts[lang];
            statusBar.classList.add('show');
            statusText.innerHTML = t.statusNoSupport;
            activateBtn.disabled = true;
            activateBtn.style.opacity = '0.4';
            activateBtn.style.cursor = 'not-allowed';
        } else {
            const t = texts[lang];
            statusBar.classList.add('show');
            statusText.innerHTML = t.statusInitial;
            setTimeout(() => {
                if (!isActive) {
                    statusBar.classList.remove('show');
                }
            }, 4000);
        }

        updateColor('#22d3ee');
    </script>

</body>

</html>

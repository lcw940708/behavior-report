                clear: '🗑️ 清空',
                batchLabel: '📋 批量結果',
                batchEmpty: '等待生成...',
                uuidLabel: 'UUID',
                copied: '✅ 已複製！',
                noUuid: '點擊「生成」產生 UUID',
                copiedMsg: '已複製到剪貼簿'
            },
            en: {
                title: '🆔 UUID Generator',
                sub: 'Random unique identifier generator · UUID v4 / v7 support',
                badge1: '🆔 UUID v4 / v7',
                badge2: '⚡ Instant Generate',
                badge3: '📋 One-click Copy',
                badge4: '🆓 Free',
                storyLabel: '📖 You might also like',
                otherTools: '🔧 Other Tools:',
                labelVersion: '📌 Version',
                labelCount: '📊 Count',
                generate: '🔄 Generate',
                copy: '📋 Copy',
                clear: '🗑️ Clear',
                batchLabel: '📋 Batch Results',
                batchEmpty: 'Waiting for generation...',
                uuidLabel: 'UUID',
                copied: '✅ Copied!',

        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;

            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('labelVersion').innerText = t.labelVersion;
            document.getElementById('labelCount').innerText = t.labelCount;
            document.getElementById('generateText').innerText = t.generate;
            document.getElementById('copyText').innerText = t.copy;
            document.getElementById('clearText').innerText = t.clear;
            document.getElementById('batchLabel').innerText = t.batchLabel;
            document.getElementById('batchEmpty').innerText = t.batchEmpty;
            document.getElementById('uuidLabel').innerText = t.uuidLabel;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });

            updateUI();
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        document.querySelectorAll('.lang-switch a').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const l = this.textContent.includes('English') ? 'en' :
                    this.textContent.includes('台') ? 'tw' : 'hk';
                switchLang(l);
            });
        });

        // =============================================================
        // UUID 生成
        // =============================================================
        function generateUUIDv4() {
            // 用 crypto.randomUUID() (現代瀏覽器)
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return crypto.randomUUID();
            }

            // Fallback
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function generateUUIDv7() {
            // v7: 時間排序 + 隨機
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                // 用 v7 格式: 自訂實現
                const timestamp = Date.now();
                const tsHex = timestamp.toString(16).padStart(12, '0');
                const rand1 = Math.floor(Math.random() * 0xFFFF).toString(16).padStart(4, '0');
                const rand2 = Math.floor(Math.random() * 0xFFFF).toString(16).padStart(4, '0');
                const rand3 = Math.floor(Math.random() * 0xFFFF).toString(16).padStart(4, '0');
                const rand4 = Math.floor(Math.random() * 0xFFFF).toString(16).padStart(4, '0');
                const rand5 = Math.floor(Math.random() * 0xFFFF).toString(16).padStart(4, '0');

                // v7: 版本號 7，變體 0-3
                const v7 = `${tsHex.slice(0, 8)}-${tsHex.slice(8, 12)}-7${rand1.slice(0, 3)}-${rand2.slice(0, 4)}-${rand3}${rand4}${rand5}`;
                return v7;
            }

            // Fallback to v4
            return generateUUIDv4();
        }

        function generateUUIDs(version, count) {
            const uuids = [];
            for (let i = 0; i < count; i++) {
                uuids.push(version === 'v4' ? generateUUIDv4() : generateUUIDv7());
            }
            return uuids;
        }

        // =============================================================
        // UI 更新
        // =============================================================
        function updateUI() {
            const version = document.getElementById('uuidVersion').value;
            const count = parseInt(document.getElementById('uuidCount').value) || 1;
            const t = texts[lang];

            if (count === 1) {
                const uuids = generateUUIDs(version, 1);
                document.getElementById('uuidValue').textContent = uuids[0];
                document.getElementById('batchOutput').innerHTML = `<span class="empty">${t.batchEmpty}</span>`;
            } else {
                const uuids = generateUUIDs(version, count);
                document.getElementById('uuidValue').textContent = uuids[0] + ' ...';
                document.getElementById('batchOutput').textContent = uuids.join('\n');
            }
        }

        // =============================================================
        // 複製
        // =============================================================
        function copyUUID() {
            const t = texts[lang];
            const version = document.getElementById('uuidVersion').value;
            const count = parseInt(document.getElementById('uuidCount').value) || 1;
            const uuids = generateUUIDs(version, count);

            const text = count === 1 ? uuids[0] : uuids.join('\n');

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const original = btn.innerHTML;
                btn.innerHTML = '✅ ' + t.copied;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const btn = document.getElementById('copyBtn');
                const original = btn.innerHTML;
                btn.innerHTML = '✅ ' + t.copied;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        // =============================================================
        // 清空
        // =============================================================
        function clearAll() {
            const t = texts[lang];
            document.getElementById('uuidValue').textContent = t.noUuid;
            document.getElementById('batchOutput').innerHTML = `<span class="empty">${t.batchEmpty}</span>`;
        }

        // =============================================================
        // Events
        // =============================================================
        document.getElementById('generateBtn').addEventListener('click', updateUI);
        document.getElementById('copyBtn').addEventListener('click', copyUUID);
        document.getElementById('clearBtn').addEventListener('click', clearAll);

        document.getElementById('uuidVersion').addEventListener('change', updateUI);
        document.getElementById('uuidCount').addEventListener('change', updateUI);

        // Enter shortcut
        document.getElementById('uuidCount').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                updateUI();
            }
        });

        // =============================================================
        // Init
        // =============================================================
        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // 第一次自動生成
        setTimeout(updateUI, 100);
    </script>

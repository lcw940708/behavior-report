<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>免費密碼生成器 — 強密碼產生器、自訂長度、複製｜Free Password Generator｜ABRG 免費工具</title>
    <meta name="description" content="免費線上密碼生成器，自訂長度、大細楷、數字、符號，一鍵複製。Free password generator, customizable length, uppercase, lowercase, numbers, symbols, 100% client-side." />
    <link rel="canonical" href="https://www.behavior-report.com/tools/password-generator.html" />
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --cyan: #22d3ee;
            --green: #10b981;
            --yellow: #fbbf24;
            --red: #ef4444;
            --border: #24324f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .password-display {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .password-display input {
            flex: 1;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: var(--bg);
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            transition: border-color 0.2s;
            user-select: all;
        }
        .password-display input:focus {
            outline: none;
            border-color: var(--cyan);
        }
        .password-display .btn {
            padding: 16px 20px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
        }
        .btn-copy {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-copy:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }
        .btn-copy:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .btn-copy.copied {
            background: var(--green);
        }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            height: 6px;
        }
        .strength-bar .segment {
            flex: 1;
            background: rgba(148, 163, 184, 0.1);
            border-radius: 3px;
            transition: background 0.3s;
        }
        .strength-bar .segment.active.weak {
            background: var(--red);
        }
        .strength-bar .segment.active.medium {
            background: var(--yellow);
        }
        .strength-bar .segment.active.strong {
            background: var(--green);
        }
        .strength-label {
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 24px;
            color: #64748b;
        }
        .strength-label .label {
            font-weight: bold;
        }
        .strength-label .label.weak {
            color: var(--red);
        }
        .strength-label .label.medium {
            color: var(--yellow);
        }
        .strength-label .label.strong {
            color: var(--green);
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.06);
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .setting-item label {
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            flex: 1;
        }
        .setting-item input[type="checkbox"] {
            accent-color: var(--cyan);
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .setting-item input[type="range"] {
            flex: 1;
            accent-color: var(--cyan);
            background: var(--bg);
            height: 4px;
            border-radius: 2px;
            min-width: 60px;
        }
        .setting-item .range-value {
            font-size: 0.9rem;
            color: var(--cyan);
            font-weight: bold;
            min-width: 30px;
            text-align: right;
        }
        .setting-item .range-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            min-width: 50px;
        }
        .setting-full {
            grid-column: 1 / -1;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-generate:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }
        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
            .settings {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .setting-full {
                grid-column: 1;
            }
            .password-display {
                flex-direction: column;
            }
            .password-display input {
                font-size: 1rem;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <a onclick="switchLang('hk')">🇭🇰 港版</a> |
            <a onclick="switchLang('tw')">🇹🇼 台版</a> |
            <a onclick="switchLang('en')">🇬🇧 English</a>
        </div>

        <h1 class="tool-title" id="toolTitle">🔐 密碼生成器</h1>
        <p class="tool-sub" id="toolSub">自訂長度同字符類型，生成強密碼，一鍵複製</p>
        <div class="badge-row">
            <span class="badge" id="badge1">🔒 私隱安全</span>
            <span class="badge" id="badge2">⚡ 即時生成</span>
            <span class="badge" id="badge3">🆓 完全免費</span>
        </div>

        <div class="password-display">
            <input type="text" id="passwordOutput" readonly />
            <button class="btn btn-copy" id="copyBtn">📋 複製</button>
        </div>

        <div class="strength-bar" id="strengthBar">
            <span class="segment" data-index="0"></span>
            <span class="segment" data-index="1"></span>
            <span class="segment" data-index="2"></span>
            <span class="segment" data-index="3"></span>
        </div>
        <div class="strength-label">
            <span id="strengthPrefix">密碼強度：</span><span class="label" id="strengthLabel">—</span>
        </div>

        <div class="settings">
            <div class="setting-item setting-full">
                <span class="range-label" id="lengthLabel">長度</span>
                <input type="range" id="lengthRange" min="4" max="64" value="16" />
                <span class="range-value" id="lengthDisplay">16</span>
            </div>
            <div class="setting-item">
                <input type="checkbox" id="uppercase" checked />
                <label id="uppercaseLabel">大楷 (A-Z)</label>
            </div>
            <div class="setting-item">
                <input type="checkbox" id="lowercase" checked />
                <label id="lowercaseLabel">細楷 (a-z)</label>
            </div>
            <div class="setting-item">
                <input type="checkbox" id="numbers" checked />
                <label id="numbersLabel">數字 (0-9)</label>
            </div>
            <div class="setting-item">
                <input type="checkbox" id="symbols" checked />
                <label id="symbolsLabel">符號 (!@#$...)</label>
            </div>
            <div class="setting-item">
                <input type="checkbox" id="excludeSimilar" />
                <label id="excludeLabel">排除相似字符 (il1Lo0O)</label>
            </div>
        </div>

        <button class="btn-generate" id="generateBtn">🔄 生成密碼</button>

        <div class="story-suggest">
            <div class="label" id="storyLabel">📖 你可能會中意嘅連載或測驗</div>
            <div class="items">
                <a href="../story_01.html">《你睡著以後》</a>
                <a href="../story_02.html">《貓狗人格》</a>
                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🔐 密碼生成器',
                sub: '自訂長度同字符類型，生成強密碼，一鍵複製',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時生成',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                copy: '📋 複製',
                copied: '✅ 已複製！',
                generate: '🔄 生成密碼',
                length: '長度',
                uppercase: '大楷 (A-Z)',
                lowercase: '細楷 (a-z)',
                numbers: '數字 (0-9)',
                symbols: '符號 (!@#$...)',
                exclude: '排除相似字符 (il1Lo0O)',
                strength: '密碼強度：',
                weak: '弱',
                medium: '中等',
                strong: '強'
            },
            tw: {
                title: '🔐 密碼生成器',
                sub: '自訂長度與字符類型，生成強密碼，一鍵複製',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時生成',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                copy: '📋 複製',
                copied: '✅ 已複製！',
                generate: '🔄 生成密碼',
                length: '長度',
                uppercase: '大寫 (A-Z)',
                lowercase: '小寫 (a-z)',
                numbers: '數字 (0-9)',
                symbols: '符號 (!@#$...)',
                exclude: '排除相似字符 (il1Lo0O)',
                strength: '密碼強度：',
                weak: '弱',
                medium: '中等',
                strong: '強'
            },
            en: {
                title: '🔐 Password Generator',
                sub: 'Custom length & character types, generate strong passwords, one-click copy',
                badge1: '🔒 Privacy Safe',
                badge2: '⚡ Instant Generate',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                copy: '📋 Copy',
                copied: '✅ Copied!',
                generate: '🔄 Generate Password',
                length: 'Length',
                uppercase: 'Uppercase (A-Z)',
                lowercase: 'Lowercase (a-z)',
                numbers: 'Numbers (0-9)',
                symbols: 'Symbols (!@#$...)',
                exclude: 'Exclude similar chars (il1Lo0O)',
                strength: 'Password Strength：',
                weak: 'Weak',
                medium: 'Medium',
                strong: 'Strong'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('copyBtn').innerHTML = t.copy;
            document.getElementById('generateBtn').innerHTML = t.generate;
            document.getElementById('lengthLabel').innerText = t.length;
            document.getElementById('uppercaseLabel').innerText = t.uppercase;
            document.getElementById('lowercaseLabel').innerText = t.lowercase;
            document.getElementById('numbersLabel').innerText = t.numbers;
            document.getElementById('symbolsLabel').innerText = t.symbols;
            document.getElementById('excludeLabel').innerText = t.exclude;
            document.getElementById('strengthPrefix').innerText = t.strength;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const passwordOutput = document.getElementById('passwordOutput');
        const copyBtn = document.getElementById('copyBtn');
        const generateBtn = document.getElementById('generateBtn');
        const lengthRange = document.getElementById('lengthRange');
        const lengthDisplay = document.getElementById('lengthDisplay');
        const uppercaseChk = document.getElementById('uppercase');
        const lowercaseChk = document.getElementById('lowercase');
        const numbersChk = document.getElementById('numbers');
        const symbolsChk = document.getElementById('symbols');
        const excludeSimilarChk = document.getElementById('excludeSimilar');
        const strengthLabel = document.getElementById('strengthLabel');
        const strengthSegments = document.querySelectorAll('.strength-bar .segment');

        const CHARSETS = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };
        const SIMILAR_CHARS = 'il1Lo0O';

        function generatePassword() {
            const length = parseInt(lengthRange.value);
            let charset = '';
            if (uppercaseChk.checked) charset += CHARSETS.uppercase;
            if (lowercaseChk.checked) charset += CHARSETS.lowercase;
            if (numbersChk.checked) charset += CHARSETS.numbers;
            if (symbolsChk.checked) charset += CHARSETS.symbols;

            if (excludeSimilarChk.checked) {
                charset = charset.split('').filter(c => !SIMILAR_CHARS.includes(c)).join('');
            }

            if (charset.length === 0) {
                charset = CHARSETS.uppercase + CHARSETS.lowercase + CHARSETS.numbers + CHARSETS.symbols;
                uppercaseChk.checked = true;
                lowercaseChk.checked = true;
                numbersChk.checked = true;
                symbolsChk.checked = true;
            }

            let password = '';
            const randomArray = new Uint32Array(length);
            crypto.getRandomValues(randomArray);

            for (let i = 0; i < length; i++) {
                const randomIndex = randomArray[i] % charset.length;
                password += charset[randomIndex];
            }

            return password;
        }

        function calculateStrength(password) {
            let score = 0;
            const length = password.length;

            if (length >= 8) score += 1;
            if (length >= 12) score += 1;
            if (length >= 16) score += 1;
            if (length >= 20) score += 1;

            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^a-zA-Z0-9]/.test(password)) score += 1;

            score = Math.min(score, 10);

            const t = texts[lang];
            if (score <= 3) return { level: 'weak', label: t.weak, color: 'weak' };
            if (score <= 6) return { level: 'medium', label: t.medium, color: 'medium' };
            return { level: 'strong', label: t.strong, color: 'strong' };
        }

        function updatePassword() {
            const password = generatePassword();
            passwordOutput.value = password;
            const result = calculateStrength(password);
            strengthLabel.textContent = result.label;
            strengthLabel.className = 'label ' + result.color;

            const scoreMap = { weak: 1, medium: 2, strong: 4 };
            const activeCount = scoreMap[result.level] || 0;

            strengthSegments.forEach((seg, index) => {
                seg.className = 'segment';
                if (index < activeCount) {
                    seg.classList.add('active', result.color);
                }
            });

            const t = texts[lang];
            copyBtn.innerHTML = t.copy;
            copyBtn.className = 'btn btn-copy';
        }

        copyBtn.addEventListener('click', async function() {
            const password = passwordOutput.value;
            if (!password) return;
            const t = texts[lang];

            try {
                await navigator.clipboard.writeText(password);
                this.innerHTML = t.copied;
                this.className = 'btn btn-copy copied';
                setTimeout(() => {
                    this.innerHTML = t.copy;
                    this.className = 'btn btn-copy';
                }, 2000);
            } catch {
                passwordOutput.select();
                document.execCommand('copy');
                this.innerHTML = t.copied;
                this.className = 'btn btn-copy copied';
                setTimeout(() => {
                    this.innerHTML = t.copy;
                    this.className = 'btn btn-copy';
                }, 2000);
            }
        });

        generateBtn.addEventListener('click', updatePassword);

        lengthRange.addEventListener('input', function() {
            lengthDisplay.textContent = this.value;
            updatePassword();
        });

        document.querySelectorAll('.settings input[type="checkbox"]').forEach(chk => {
            chk.addEventListener('change', updatePassword);
        });

        updatePassword();
    </script>
</body>
</html>

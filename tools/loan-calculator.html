<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>免費貸款計算機 — 每月供款、總利息、還款表｜Free Loan Calculator｜ABRG 免費工具</title>
    <meta name="description" content="免費線上貸款計算機，輸入貸款金額、利率、還款期數，即時計算每月供款、總利息同詳細還款時間表。Free loan calculator, monthly payment, amortization schedule, 100% client-side." />
    <link rel="canonical" href="https://www.behavior-report.com/tools/loan-calculator.html" />
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --cyan: #22d3ee;
            --green: #10b981;
            --border: #24324f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .form-group .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-group .input-row input {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: var(--bg);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group .input-row input:focus {
            outline: none;
            border-color: var(--cyan);
        }
        .form-group .input-row .suffix {
            color: #64748b;
            font-size: 0.9rem;
            min-width: 30px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .result-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(148, 163, 184, 0.06);
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
        }
        .result-item .number {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }
        .result-item .number .currency {
            font-size: 0.9rem;
            color: var(--cyan);
        }
        .result-item .label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .result-item.highlight {
            border-color: rgba(34, 211, 238, 0.15);
            background: rgba(34, 211, 238, 0.03);
        }
        .result-item.highlight .number {
            color: var(--cyan);
        }

        .schedule-section {
            margin-top: 20px;
            display: none;
        }
        .schedule-section.show {
            display: block;
        }
        .schedule-section .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .schedule-wrapper {
            max-height: 320px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.06);
        }
        .schedule-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .schedule-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .schedule-wrapper::-webkit-scrollbar-thumb {
            background: rgba(34, 211, 238, 0.2);
            border-radius: 4px;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .schedule-table th {
            background: rgba(255, 255, 255, 0.03);
            color: #64748b;
            font-weight: 600;
            padding: 10px 12px;
            text-align: right;
            border-bottom: 1px solid rgba(148, 163, 184, 0.06);
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 1;
        }
        .schedule-table th:first-child {
            text-align: center;
        }
        .schedule-table td {
            padding: 8px 12px;
            text-align: right;
            border-bottom: 1px solid rgba(148, 163, 184, 0.03);
            color: #cbd5e1;
        }
        .schedule-table td:first-child {
            text-align: center;
            color: #64748b;
        }
        .schedule-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .schedule-table .total-row td {
            font-weight: bold;
            border-top: 2px solid rgba(148, 163, 184, 0.15);
            color: #fff;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-cyan {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-cyan:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
        }
        .btn-outline:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }
        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
            .result-grid {
                grid-template-columns: 1fr 1fr;
            }
            .result-item .number {
                font-size: 1.1rem;
            }
            .form-group .input-row {
                flex-direction: column;
                align-items: stretch;
            }
            .form-group .input-row input {
                min-width: 0;
            }
            .schedule-table {
                font-size: 0.75rem;
            }
            .schedule-table th,
            .schedule-table td {
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <a onclick="switchLang('hk')">🇭🇰 港版</a> |
            <a onclick="switchLang('tw')">🇹🇼 台版</a> |
            <a onclick="switchLang('en')">🇬🇧 English</a>
        </div>

        <h1 class="tool-title" id="toolTitle">🏦 貸款計算機</h1>
        <p class="tool-sub" id="toolSub">輸入貸款金額、利率、期數，即時計算每月供款</p>
        <div class="badge-row">
            <span class="badge" id="badge1">🔒 私隱安全</span>
            <span class="badge" id="badge2">⚡ 即時計算</span>
            <span class="badge" id="badge3">🆓 完全免費</span>
        </div>

        <!-- 輸入 -->
        <div class="form-group">
            <label id="labelAmount">💰 貸款金額</label>
            <div class="input-row">
                <input type="number" id="loanAmount" value="1000000" step="10000" min="0" />
                <span class="suffix" id="currencyLabel">HKD</span>
            </div>
        </div>

        <div class="form-group">
            <label id="labelRate">📊 年利率</label>
            <div class="input-row">
                <input type="number" id="interestRate" value="5" step="0.1" min="0" max="100" />
                <span class="suffix">%</span>
            </div>
        </div>

        <div class="form-group">
            <label id="labelTerm">📅 還款期數</label>
            <div class="input-row">
                <input type="number" id="loanTerm" value="120" step="12" min="1" max="360" />
                <span class="suffix" id="monthsLabel">個月</span>
            </div>
        </div>

        <!-- 結果 -->
        <div class="result-grid" id="resultGrid">
            <div class="result-item highlight">
                <div class="number" id="monthlyPayment">$0</div>
                <div class="label" id="labelMonthly">每月供款</div>
            </div>
            <div class="result-item">
                <div class="number" id="totalPayment">$0</div>
                <div class="label" id="labelTotal">總還款額</div>
            </div>
            <div class="result-item">
                <div class="number" id="totalInterest">$0</div>
                <div class="label" id="labelInterest">總利息支出</div>
            </div>
        </div>

        <!-- 還款表 -->
        <div class="schedule-section" id="scheduleSection">
            <div class="label" id="scheduleLabel">📋 還款時間表</div>
            <div class="schedule-wrapper">
                <table class="schedule-table" id="scheduleTable">
                    <thead>
                        <tr>
                            <th id="thPeriod">#</th>
                            <th id="thPayment">每月供款</th>
                            <th id="thInterest">利息</th>
                            <th id="thPrincipal">本金</th>
                            <th id="thBalance">剩餘本金</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-cyan" id="showScheduleBtn">📋 顯示還款表</button>
            <button class="btn btn-outline" id="hideScheduleBtn">🔽 隱藏還款表</button>
        </div>

        <div class="story-suggest">
            <div class="label" id="storyLabel">📖 你可能會中意嘅連載或測驗</div>
            <div class="items">
                <a href="../story_01.html">《你睡著以後》</a>
                <a href="../story_02.html">《貓狗人格》</a>
                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🏦 貸款計算機',
                sub: '輸入貸款金額、利率、期數，即時計算每月供款',
                labelAmount: '💰 貸款金額',
                labelRate: '📊 年利率',
                labelTerm: '📅 還款期數',
                currencyLabel: 'HKD',
                monthsLabel: '個月',
                labelMonthly: '每月供款',
                labelTotal: '總還款額',
                labelInterest: '總利息支出',
                scheduleLabel: '📋 還款時間表',
                thPeriod: '#',
                thPayment: '每月供款',
                thInterest: '利息',
                thPrincipal: '本金',
                thBalance: '剩餘本金',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時計算',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                showSchedule: '📋 顯示還款表',
                hideSchedule: '🔽 隱藏還款表'
            },
            tw: {
                title: '🏦 貸款計算機',
                sub: '輸入貸款金額、利率、期數，即時計算每月供款',
                labelAmount: '💰 貸款金額',
                labelRate: '📊 年利率',
                labelTerm: '📅 還款期數',
                currencyLabel: 'HKD',
                monthsLabel: '個月',
                labelMonthly: '每月供款',
                labelTotal: '總還款額',
                labelInterest: '總利息支出',
                scheduleLabel: '📋 還款時間表',
                thPeriod: '#',
                thPayment: '每月供款',
                thInterest: '利息',
                thPrincipal: '本金',
                thBalance: '剩餘本金',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時計算',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                showSchedule: '📋 顯示還款表',
                hideSchedule: '🔽 隱藏還款表'
            },
            en: {
                title: '🏦 Loan Calculator',
                sub: 'Enter loan amount, interest rate, term, instant monthly payment calculation',
                labelAmount: '💰 Loan Amount',
                labelRate: '📊 Annual Interest Rate',
                labelTerm: '📅 Loan Term',
                currencyLabel: 'HKD',
                monthsLabel: 'months',
                labelMonthly: 'Monthly Payment',
                labelTotal: 'Total Payment',
                labelInterest: 'Total Interest',
                scheduleLabel: '📋 Amortization Schedule',
                thPeriod: '#',
                thPayment: 'Payment',
                thInterest: 'Interest',
                thPrincipal: 'Principal',
                thBalance: 'Balance',
                badge1: '🔒 Privacy Safe',
                badge2: '⚡ Instant Calculate',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                showSchedule: '📋 Show Schedule',
                hideSchedule: '🔽 Hide Schedule'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('labelAmount').innerText = t.labelAmount;
            document.getElementById('labelRate').innerText = t.labelRate;
            document.getElementById('labelTerm').innerText = t.labelTerm;
            document.getElementById('currencyLabel').innerText = t.currencyLabel;
            document.getElementById('monthsLabel').innerText = t.monthsLabel;
            document.getElementById('labelMonthly').innerText = t.labelMonthly;
            document.getElementById('labelTotal').innerText = t.labelTotal;
            document.getElementById('labelInterest').innerText = t.labelInterest;
            document.getElementById('scheduleLabel').innerText = t.scheduleLabel;
            document.getElementById('thPeriod').innerText = t.thPeriod;
            document.getElementById('thPayment').innerText = t.thPayment;
            document.getElementById('thInterest').innerText = t.thInterest;
            document.getElementById('thPrincipal').innerText = t.thPrincipal;
            document.getElementById('thBalance').innerText = t.thBalance;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('showScheduleBtn').innerHTML = t.showSchedule;
            document.getElementById('hideScheduleBtn').innerHTML = t.hideSchedule;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 計算核心
        // =============================================================
        const loanAmount = document.getElementById('loanAmount');
        const interestRate = document.getElementById('interestRate');
        const loanTerm = document.getElementById('loanTerm');

        const monthlyPaymentEl = document.getElementById('monthlyPayment');
        const totalPaymentEl = document.getElementById('totalPayment');
        const totalInterestEl = document.getElementById('totalInterest');
        const scheduleBody = document.getElementById('scheduleBody');
        const scheduleSection = document.getElementById('scheduleSection');

        function calculateLoan() {
            const P = parseFloat(loanAmount.value) || 0;
            const annualRate = parseFloat(interestRate.value) || 0;
            const n = parseInt(loanTerm.value) || 1;

            const monthlyRate = annualRate / 100 / 12;

            let monthly = 0;
            let totalPaid = 0;
            let totalInterest = 0;

            if (monthlyRate === 0) {
                monthly = P / n;
                totalPaid = P;
                totalInterest = 0;
            } else {
                monthly = P * monthlyRate * Math.pow(1 + monthlyRate, n) / (Math.pow(1 + monthlyRate, n) - 1);
                totalPaid = monthly * n;
                totalInterest = totalPaid - P;
            }

            const formatter = new Intl.NumberFormat('zh-HK', {
                style: 'currency',
                currency: 'HKD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            });

            monthlyPaymentEl.textContent = formatter.format(monthly);
            totalPaymentEl.textContent = formatter.format(totalPaid);
            totalInterestEl.textContent = formatter.format(totalInterest);

            generateSchedule(P, monthlyRate, n, monthly);
        }

        function generateSchedule(P, monthlyRate, n, monthly) {
            let balance = P;
            let rows = [];

            for (let i = 1; i <= n; i++) {
                let interest = balance * monthlyRate;
                let principal = monthly - interest;
                if (i === n) {
                    principal = balance;
                    interest = monthly - principal;
                }
                balance = balance - principal;

                rows.push({
                    period: i,
                    payment: monthly,
                    interest: interest,
                    principal: principal,
                    balance: Math.max(balance, 0)
                });
            }

            const formatter = new Intl.NumberFormat('zh-HK', {
                style: 'currency',
                currency: 'HKD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            });

            let html = '';
            rows.forEach(row => {
                html += `
                    <tr>
                        <td>${row.period}</td>
                        <td>${formatter.format(row.payment)}</td>
                        <td>${formatter.format(row.interest)}</td>
                        <td>${formatter.format(row.principal)}</td>
                        <td>${formatter.format(row.balance)}</td>
                    </tr>
                `;
            });

            const totalPayment = rows.reduce((sum, r) => sum + r.payment, 0);
            const totalInterest = rows.reduce((sum, r) => sum + r.interest, 0);
            const totalPrincipal = rows.reduce((sum, r) => sum + r.principal, 0);
            html += `
                <tr class="total-row">
                    <td>${lang === 'en' ? 'Total' : '總計'}</td>
                    <td>${formatter.format(totalPayment)}</td>
                    <td>${formatter.format(totalInterest)}</td>
                    <td>${formatter.format(totalPrincipal)}</td>
                    <td>—</td>
                </tr>
            `;

            scheduleBody.innerHTML = html;
        }

        loanAmount.addEventListener('input', calculateLoan);
        interestRate.addEventListener('input', calculateLoan);
        loanTerm.addEventListener('input', calculateLoan);

        document.getElementById('showScheduleBtn').addEventListener('click', function() {
            scheduleSection.classList.add('show');
        });

        document.getElementById('hideScheduleBtn').addEventListener('click', function() {
            scheduleSection.classList.remove('show');
        });

        calculateLoan();
        scheduleSection.classList.add('show');
    </script>
</body>
</html>

        let lang = 'hk';

        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('unitMetric').innerHTML = t.unitMetric;
            document.getElementById('unitImperial').innerHTML = t.unitImperial;
            document.getElementById('labelHeight').innerText = t.labelHeight;
            document.getElementById('labelWeight').innerText = t.labelWeight;
            document.getElementById('labelHeightImperial').innerText = t.labelHeightImperial;
            document.getElementById('labelWeightImperial').innerText = t.labelWeightImperial;
            document.getElementById('labelUnderweight').innerText = t.labelUnderweight;
            document.getElementById('labelNormal').innerText = t.labelNormal;
            document.getElementById('labelOverweight').innerText = t.labelOverweight;
            document.getElementById('labelObese').innerText = t.labelObese;
            document.getElementById('labelSevere').innerText = t.labelSevere;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href, window.location.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });

            calculateBMI();
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        // 單位切換與數據同動
        const unitBtns = document.querySelectorAll('.unit-btn');
        const metricInputs = document.getElementById('metricInputs');
        const imperialInputs = document.getElementById('imperialInputs');
        let currentUnit = 'metric';

        const heightCm = document.getElementById('heightCm');
        const weightKg = document.getElementById('weightKg');
        const heightFt = document.getElementById('heightFt');
        const heightIn = document.getElementById('heightIn');
        const weightLbs = document.getElementById('weightLbs');

        unitBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const targetUnit = this.dataset.unit;
                if (targetUnit === currentUnit) return;

                // 單位切換時進行雙向數值換算
                if (targetUnit === 'imperial') {
                    const cm = parseFloat(heightCm.value) || 0;
                    const kg = parseFloat(weightKg.value) || 0;
                    if (cm > 0) {
                        const totalInches = cm / 2.54;
                        heightFt.value = Math.floor(totalInches / 12);
                        heightIn.value = (totalInches % 12).toFixed(1);
                    }
                    if (kg > 0) {
                        weightLbs.value = (kg * 2.20462).toFixed(1);
                    }
                    metricInputs.style.display = 'none';
                    imperialInputs.style.display = 'block';
                } else {
                    const ft = parseFloat(heightFt.value) || 0;
                    const inc = parseFloat(heightIn.value) || 0;
                    const lbs = parseFloat(weightLbs.value) || 0;
                    if (ft > 0 || inc > 0) {
                        const totalInches = ft * 12 + inc;
                        heightCm.value = (totalInches * 2.54).toFixed(1);
                    }
                    if (lbs > 0) {
                        weightKg.value = (lbs / 2.20462).toFixed(1);
                    }
                    metricInputs.style.display = 'block';
                    imperialInputs.style.display = 'none';
                }

                unitBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentUnit = targetUnit;
                calculateBMI();
            });
        });

        const bmiNumber = document.getElementById('bmiNumber');
        const bmiStatus = document.getElementById('bmiStatus');
        const bmiDesc = document.getElementById('bmiDesc');
        const bmiRange = document.getElementById('bmiRange');
        const bmiMarker = document.getElementById('bmiMarker');

        function calculateBMI() {
            const t = texts[lang];
            let bmi = 0;

            if (currentUnit === 'metric') {
                const h = parseFloat(heightCm.value) || 0;
                const w = parseFloat(weightKg.value) || 0;
                if (h > 0 && w > 0) {
                    const heightM = h / 100;
                    bmi = w / (heightM * heightM);
                }
            } else {
                const ft = parseFloat(heightFt.value) || 0;
                const inc = parseFloat(heightIn.value) || 0;
                const lbs = parseFloat(weightLbs.value) || 0;
                if ((ft > 0 || inc > 0) && lbs > 0) {
                    const totalInches = ft * 12 + inc;
                    // 英制 BMI 公式: 703 * lbs / (in^2)
                    bmi = (lbs * 703) / (totalInches * totalInches);
                }
            }

            if (bmi > 0 && bmi < 100) {
                bmiNumber.textContent = bmi.toFixed(1);

                let status = '';
                let desc = '';
                let range = '';
                let color = '';

                if (bmi < 18.5) {
                    status = t.statusUnderweight;
                    desc = t.descUnderweight;
                    range = t.range;
                    color = 'underweight';
                } else if (bmi < 25) {
                    status = t.statusNormal;
                    desc = t.descNormal;
                    range = t.range;
                    color = 'normal';
                } else if (bmi < 30) {
                    status = t.statusOverweight;
                    desc = t.descOverweight;
                    range = t.range;
                    color = 'overweight';
                } else if (bmi < 35) {
                    status = t.statusObese;
                    desc = t.descObese;
                    range = t.range;
                    color = 'obese';
                } else {
                    status = t.statusSevere;
                    desc = t.descSevere;
                    range = t.range;
                    color = 'severe-obese';
                }

                bmiStatus.textContent = status;
                bmiStatus.className = 'bmi-status ' + color;
                bmiDesc.textContent = desc;
                bmiRange.textContent = range;

                // Marker 定位計算 (刻度範圍設定為 10 ~ 40)
                const pct = Math.min(Math.max((bmi - 10) / (40 - 10) * 100, 0), 100);
                bmiMarker.style.display = 'block';
                bmiMarker.style.left = pct + '%';

            } else {
                bmiNumber.textContent = '—';
                bmiStatus.textContent = t.invalid;
                bmiStatus.className = 'bmi-status';
                bmiDesc.textContent = t.invalidDesc;
                bmiRange.textContent = '';
                bmiMarker.style.display = 'none';
            }
        }

        // 綁定輸入事件
        [heightCm, weightKg, heightFt, heightIn, weightLbs].forEach(input => {
            input.addEventListener('input', calculateBMI);
        });

        // 初始化
        switchLang(detectLanguage());
    </script>
</body>
</html>

        const worldCities = [

        // 語言切換

        function switchLang(l) {
            lang = l;
            const t = texts[l];

            toolTitle.innerHTML = t.title;
            toolSub.innerText = t.sub;
            badge1.innerText = t.badge1;
            badge2.innerText = t.badge2;
            badge3.innerText = t.badge3;
            badge4.innerText = t.badge4;

            otherToolsLabel.innerText = t.otherTools;
            labelDateTime.innerText = t.labelDateTime;
            labelFrom.innerText = t.labelFrom;
            labelTo.innerText = t.labelTo;
            convertText.innerText = t.convert;
            nowText.innerText = t.now;
            worldClockLabel.innerText = t.worldClock;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });

            populateTimezones();
            updateWorldClock();
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const l = this.textContent.includes('English') ? 'en' :
                    this.textContent.includes('台') ? 'tw' : 'hk';
                switchLang(l);
            });
        });

        // =============================================================
        // Populate timezones
        // =============================================================
        function populateTimezones() {
            const isEn = lang === 'en';
            const options = timezones.map(tz => ({
                value: tz.value,
                label: isEn ? tz.labelEn : tz.label
            }));

            const fromVal = fromTimezone.value;
            const toVal = toTimezone.value;

            fromTimezone.innerHTML = options.map(o =>
                `<option value="${o.value}" ${o.value === fromVal ? 'selected' : ''}>${o.label}</option>`
            ).join('');

            toTimezone.innerHTML = options.map(o =>
                `<option value="${o.value}" ${o.value === toVal ? 'selected' : ''}>${o.label}</option>`
            ).join('');
        }

        // =============================================================
        // Set default date
        // =============================================================
        function setDefaultDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            inputDateTime.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        // =============================================================
        // Convert
        // =============================================================
        function convertTimezone() {
            const t = texts[lang];
            const dateVal = inputDateTime.value;

            if (!dateVal) {
                resultText.textContent = t.invalidDate;
                return;
            }

            const fromTz = fromTimezone.value;
            const toTz = toTimezone.value;

            const localDate = new Date(dateVal);
            if (isNaN(localDate.getTime())) {
                resultText.textContent = t.invalidDate;
                return;
            }

            const fromOffset = getTimezoneOffset(fromTz, localDate);
            const toOffset = getTimezoneOffset(toTz, localDate);

            const localOffset = -localDate.getTimezoneOffset() / 60;
            const fromOffsetDiff = fromOffset - localOffset;
            const fromDate = new Date(localDate.getTime() + fromOffsetDiff * 3600000);

            const toOffsetDiff = toOffset - fromOffset;
            const toDate = new Date(fromDate.getTime() + toOffsetDiff * 3600000);

            const isEn = lang === 'en';
            const dateStr = toDate.toLocaleDateString(isEn ? 'en-US' : 'zh-HK', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            const timeStr = toDate.toLocaleTimeString(isEn ? 'en-US' : 'zh-HK', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const toLabel = isEn ?
                timezones.find(t => t.value === toTz)?.labelEn || toTz :
                timezones.find(t => t.value === toTz)?.label || toTz;

            const diffHours = Math.round((toOffset - fromOffset) * 100) / 100;
            const diffSign = diffHours >= 0 ? '+' : '';
            const diffStr = `${diffSign}${diffHours.toFixed(2)}h`;

            resultText.innerHTML = `
                ${dateStr} ${timeStr}
                <span class="timezone">${toLabel}</span>
                <span class="offset">(${diffStr})</span>
            `;
        }

        function getTimezoneOffset(tz, date) {
            try {
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).formatToParts(date);

                const values = {};
                parts.forEach(p => { values[p.type] = p.value; });

                const year = parseInt(values.year);
                const month = parseInt(values.month) - 1;
                const day = parseInt(values.day);
                const hour = parseInt(values.hour);
                const minute = parseInt(values.minute);
                const second = parseInt(values.second);

                const tzDate = new Date(year, month, day, hour, minute, second);
                const offset = (tzDate.getTime() - date.getTime()) / 3600000;
                return offset;
            } catch (e) {
                return 0;
            }
        }

        // =============================================================
        // World Clock
        // =============================================================
        function updateWorldClock() {
            const now = new Date();
            const isEn = lang === 'en';

            let html = '';
            worldCities.forEach(city => {
                try {
                    const tz = city.tz;
                    const date = new Date(now.toLocaleString('en-US', { timeZone: tz }));
                    const timeStr = date.toLocaleTimeString(isEn ? 'en-US' : 'zh-HK', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });
                    const offset = getTimezoneOffset(tz, now);
                    const offsetStr = (offset >= 0 ? '+' : '') + offset.toFixed(1) + 'h';
                    const name = isEn ? city.nameEn : city.name;

                    html += `
                        <div class="city">
                            <div class="name">${name}</div>
                            <div class="time">${timeStr}</div>
                            <div class="timezone-label">${tz.split('/')[1] || tz}</div>
                            <div class="offset-label">${offsetStr}</div>
                        </div>
                    `;
                } catch (e) {
                    // skip
                }
            });
            worldClock.innerHTML = html;
        }

        // =============================================================
        // Events
        // =============================================================
        convertBtn.addEventListener('click', convertTimezone);

        nowBtn.addEventListener('click', function() {
            setDefaultDateTime();
            convertTimezone();
        });

        swapBtn.addEventListener('click', function() {
            const fromVal = fromTimezone.value;
            const toVal = toTimezone.value;
            fromTimezone.value = toVal;
            toTimezone.value = fromVal;
            convertTimezone();
        });

        inputDateTime.addEventListener('change', convertTimezone);
        fromTimezone.addEventListener('change', convertTimezone);
        toTimezone.addEventListener('change', convertTimezone);

        inputDateTime.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') convertTimezone();
        });

        // =============================================================
        // Init
        // =============================================================
        const detectedLang = detectLanguage();
        switchLang(detectedLang);
        setDefaultDateTime();

        fromTimezone.value = 'UTC';
        toTimezone.value = 'Asia/Hong_Kong';

        setTimeout(convertTimezone, 200);

        setInterval(updateWorldClock, 1000);

        setInterval(() => {
            if (resultText.textContent && !resultText.textContent.includes('選擇時區')) {
                convertTimezone();
            }
        }, 10000);
    </script>

</body>

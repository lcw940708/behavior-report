    <script>

        const texts = {

                copy: '📋 複製結果',

                decodeError: '❌ 解碼失敗：',
                copied: '✅ 已複製',
                copyFallback: '已複製到剪貼簿'
            },
            tw: {
                title: '📷 QR Code 解碼器',
                sub: '上傳二維碼圖片 · 即時解碼 · 純前端處理 · 圖片不會離開你的瀏覽器',
                badge1: '📷 上傳解碼',
                badge2: '⚡ 即時掃描',
                badge3: '🔒 私隱安全',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                otherTools: '🔧 其他工具：',
                upload: '拖曳 QR Code 圖片到這裡，或點擊選擇檔案',
                hint: '支援 PNG、JPG、WebP',
                preview: '📂 上傳圖片',
                result: '📋 解碼結果',
                decode: '📷 掃描解碼',
                copy: '📋 複製結果',
                remove: '🗑️ 移除圖片',
                scanning: '⏳ 掃描中...',
                noImage: '請先上傳圖片',
                notImage: '請上傳圖片檔案',
                decodeSuccess: '✅ 已複製',
                decodeFailed: '❌ 無法解碼，請確保圖片是有效的 QR Code',
                loadFailed: '❌ 圖片載入失敗，請嘗試其他檔案',
                decodeError: '❌ 解碼失敗：',
                copied: '✅ 已複製',
                copyFallback: '已複製到剪貼簿'
            },
            en: {
                title: '📷 QR Code Decoder',
                sub: 'Upload QR image · Instant decode · 100% client-side · Your images never leave your browser',
                badge1: '📷 Upload & Decode',
                badge2: '⚡ Instant Scan',
                badge3: '🔒 Privacy Safe',
                badge4: '🆓 Free',
                storyLabel: '📖 You might also like',
                otherTools: '🔧 Other Tools:',
                upload: 'Drag & drop your QR Code image here, or click to select',
                hint: 'Supports PNG, JPG, WebP',
                preview: '📂 Uploaded Image',
                result: '📋 Decoded Result',
                decode: '📷 Scan & Decode',
                copy: '📋 Copy Result',
                remove: '🗑️ Remove Image',
                scanning: '⏳ Scanning...',
                noImage: 'Please upload an image first',
                notImage: 'Please upload an image file',
                decodeSuccess: '✅ Copied',
                decodeFailed: '❌ Cannot decode, please ensure it is a valid QR Code',
                loadFailed: '❌ Image load failed, please try another file',
                decodeError: '❌ Decode failed:',
                copied: '✅ Copied',
                copyFallback: 'Copied to clipboard'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('previewLabel').innerText = t.preview;
            document.getElementById('resultLabel').innerText = t.result;
            document.getElementById('decodeText').innerText = t.decode;
            document.getElementById('copyText').innerText = t.copy;
            document.getElementById('removeText').innerText = t.remove;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const decodeBtn = document.getElementById('decodeBtn');
        const copyBtn = document.getElementById('copyBtn');
        const removeBtn = document.getElementById('removeBtn');

        let currentFile = null;
        let currentImageDataURL = null;
        let decodedText = '';

        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const t = texts[lang];
            if (!file.type.startsWith('image/')) {
                alert(t.notImage);
                return;
            }
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageDataURL = e.target.result;
                previewImage.src = currentImageDataURL;
                previewSection.classList.add('show');
                resultBox.classList.remove('show');
                resultText.textContent = '--';
                resultText.className = 'result-text';
                copyBtn.disabled = true;
                decodedText = '';
            };
            reader.readAsDataURL(file);
        }

        function decodeQR() {
            const t = texts[lang];
            if (!currentImageDataURL) {
                alert(t.noImage);
                return;
            }

            decodeBtn.disabled = true;
            decodeBtn.innerHTML = t.scanning;

            try {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height, {
                        inversionAttempts: "dontInvert",
                    });

                    resultBox.classList.add('show');

                    if (code && code.data) {
                        decodedText = code.data;
                        resultText.textContent = decodedText;
                        resultText.className = 'result-text success';
                        copyBtn.disabled = false;
                    } else {
                        resultText.textContent = t.decodeFailed;
                        resultText.className = 'result-text error';
                        copyBtn.disabled = true;
                        decodedText = '';
                    }

                    decodeBtn.disabled = false;
                    decodeBtn.innerHTML = '📷 ' + t.decode;
                };

                img.onerror = function() {
                    resultBox.classList.add('show');
                    resultText.textContent = t.loadFailed;
                    resultText.className = 'result-text error';
                    copyBtn.disabled = true;
                    decodeBtn.disabled = false;
                    decodeBtn.innerHTML = '📷 ' + t.decode;
                };

                img.src = currentImageDataURL;

            } catch (err) {
                console.error('解碼失敗:', err);
                resultBox.classList.add('show');
                resultText.textContent = t.decodeError + err.message;
                resultText.className = 'result-text error';
                copyBtn.disabled = true;
                decodeBtn.disabled = false;
                decodeBtn.innerHTML = '📷 ' + t.decode;
            }
        }

        function copyResult() {
            const t = texts[lang];
            if (!decodedText) return;
            navigator.clipboard.writeText(decodedText).then(() => {
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = t.copied;
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = decodedText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert(t.copyFallback);
            });
        }

        function removeImage() {
            const t = texts[lang];
            currentFile = null;
            currentImageDataURL = null;
            previewSection.classList.remove('show');
            previewImage.src = '';
            resultBox.classList.remove('show');
            resultText.textContent = '--';
            resultText.className = 'result-text';
            copyBtn.disabled = true;
            decodedText = '';
            fileInput.value = '';
            decodeBtn.disabled = false;
            decodeBtn.innerHTML = '📷 ' + t.decode;
        }

        decodeBtn.addEventListener('click', decodeQR);
        copyBtn.addEventListener('click', copyResult);
        removeBtn.addEventListener('click', removeImage);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && previewSection.classList.contains('show')) {
                decodeQR();
            }
        });

        if (typeof jsQR === 'undefined') {
            console.warn('jsQR 未載入，嘗試從 CDN 重新載入');
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
            document.head.appendChild(script);
        }
    </script>

</body>
</html>

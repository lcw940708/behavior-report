<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>免費文字統計工具 — 字數、字元數、閱讀時間｜Free Word Counter｜ABRG 免費工具</title>
    <meta name="description" content="免費線上文字統計工具，即時計算字數、字元數、句數、段落數、閱讀時間，仲有關鍵字密度分析。Free word counter, character counter, reading time, 100% client-side." />
    <link rel="canonical" href="https://www.behavior-report.com/tools/word-counter.html" />
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --cyan: #22d3ee;
            --red: #ef4444;
            --border: #24324f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .editor-area {
            position: relative;
        }
        textarea {
            width: 100%;
            height: 260px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: var(--bg);
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.7;
            resize: vertical;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--cyan);
        }
        textarea::placeholder {
            color: #475569;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
            justify-content: space-between;
        }
        .toolbar-left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }
        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
            border-color: var(--cyan);
        }
        .btn-primary:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }
        .btn-danger {
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .btn-danger:hover {
            border-color: var(--red);
            color: #fff;
            background: rgba(239, 68, 68, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(148, 163, 184, 0.06);
            border-radius: 10px;
            padding: 14px 12px;
            text-align: center;
            transition: all 0.2s;
        }
        .stat-item:hover {
            border-color: rgba(34, 211, 238, 0.15);
        }
        .stat-item .number {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        .stat-item .label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .stat-item .label .unit {
            color: #475569;
            font-size: 0.6rem;
        }

        .top-words {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(148, 163, 184, 0.06);
        }
        .top-words .title {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .top-words .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-words .tag {
            background: rgba(34, 211, 238, 0.06);
            border: 1px solid rgba(34, 211, 238, 0.08);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .top-words .tag .count {
            color: #64748b;
            font-size: 0.7rem;
            margin-left: 4px;
        }
        .top-words .empty {
            color: #475569;
            font-size: 0.85rem;
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }
        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .stat-item .number {
                font-size: 1.2rem;
            }
            .toolbar {
                flex-direction: column;
            }
            .toolbar-left,
            .toolbar-right {
                width: 100%;
            }
            .btn {
                flex: 1;
                text-align: center;
            }
        }
        @media (max-width: 380px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <a onclick="switchLang('hk')">🇭🇰 港版</a> |
            <a onclick="switchLang('tw')">🇹🇼 台版</a> |
            <a onclick="switchLang('en')">🇬🇧 English</a>
        </div>

        <h1 class="tool-title" id="toolTitle">📊 文字統計工具</h1>
        <p class="tool-sub" id="toolSub">貼上或輸入文字，即時統計字數、閱讀時間、關鍵字密度</p>
        <div class="badge-row">
            <span class="badge" id="badge1">⚡ 即時統計</span>
            <span class="badge" id="badge2">🔒 私隱安全</span>
            <span class="badge" id="badge3">🆓 完全免費</span>
        </div>

        <div class="editor-area">
            <textarea id="textInput" placeholder="在此貼上或輸入文字，統計會自動更新..."></textarea>
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="btn btn-primary" id="clearBtn">🗑️ 清空</button>
                </div>
                <div class="toolbar-right">
                    <button class="btn" id="copyBtn">📋 複製統計</button>
                </div>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-item"><div class="number" id="totalWords">0</div><div class="label" id="labelTotalWords">總字數</div></div>
            <div class="stat-item"><div class="number" id="chineseChars">0</div><div class="label" id="labelChineseChars">中文字</div></div>
            <div class="stat-item"><div class="number" id="englishWords">0</div><div class="label" id="labelEnglishWords">英文字</div></div>
            <div class="stat-item"><div class="number" id="numbers">0</div><div class="label" id="labelNumbers">數字</div></div>
            <div class="stat-item"><div class="number" id="charCount">0</div><div class="label" id="labelCharCount">字元數</div></div>
            <div class="stat-item"><div class="number" id="sentences">0</div><div class="label" id="labelSentences">句數</div></div>
            <div class="stat-item"><div class="number" id="paragraphs">0</div><div class="label" id="labelParagraphs">段落</div></div>
            <div class="stat-item"><div class="number" id="readingTime">0</div><div class="label" id="labelReadingTime">閱讀時間 (分鐘)</div></div>
        </div>

        <div class="top-words" id="topWordsSection">
            <div class="title" id="labelTopWords">🔑 關鍵字密度 TOP 10</div>
            <div class="tags" id="topWordsTags"><span class="empty" id="emptyWordsMsg">輸入文字後會自動顯示</span></div>
        </div>

        <div class="story-suggest">
            <div class="label" id="storyLabel">📖 你可能會中意嘅連載或測驗</div>
            <div class="items">
                <a href="../story_01.html">《你睡著以後》</a>
                <a href="../story_02.html">《貓狗人格》</a>
                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../contact.html">聯絡我們</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '📊 文字統計工具',
                sub: '貼上或輸入文字，即時統計字數、閱讀時間、關鍵字密度',
                placeholder: '在此貼上或輸入文字，統計會自動更新...',
                clear: '🗑️ 清空',
                copy: '📋 複製統計',
                totalWords: '總字數',
                chineseChars: '中文字',
                englishWords: '英文字',
                numbers: '數字',
                charCount: '字元數',
                sentences: '句數',
                paragraphs: '段落',
                readingTime: '閱讀時間 (分鐘)',
                topWords: '🔑 關鍵字密度 TOP 10',
                emptyWords: '輸入文字後會自動顯示',
                badge1: '⚡ 即時統計',
                badge2: '🔒 私隱安全',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                copied: '✅ 已複製！'
            },
            tw: {
                title: '📊 文字統計工具',
                sub: '貼上或輸入文字，即時統計字數、閱讀時間、關鍵字密度',
                placeholder: '在此貼上或輸入文字，統計會自動更新...',
                clear: '🗑️ 清空',
                copy: '📋 複製統計',
                totalWords: '總字數',
                chineseChars: '中文字',
                englishWords: '英文字',
                numbers: '數字',
                charCount: '字元數',
                sentences: '句數',
                paragraphs: '段落',
                readingTime: '閱讀時間 (分鐘)',
                topWords: '🔑 關鍵字密度 TOP 10',
                emptyWords: '輸入文字後會自動顯示',
                badge1: '⚡ 即時統計',
                badge2: '🔒 私隱安全',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                copied: '✅ 已複製！'
            },
            en: {
                title: '📊 Word Counter',
                sub: 'Paste or type text, instant word count, reading time, keyword density',
                placeholder: 'Paste or type text here, stats update automatically...',
                clear: '🗑️ Clear',
                copy: '📋 Copy Stats',
                totalWords: 'Total Words',
                chineseChars: 'Chinese',
                englishWords: 'English',
                numbers: 'Numbers',
                charCount: 'Characters',
                sentences: 'Sentences',
                paragraphs: 'Paragraphs',
                readingTime: 'Reading Time (min)',
                topWords: '🔑 Top 10 Keywords',
                emptyWords: 'Type some text to see keywords',
                badge1: '⚡ Live Stats',
                badge2: '🔒 Privacy Safe',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                copied: '✅ Copied!'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];
            document.getElementById('toolTitle').innerText = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('textInput').placeholder = t.placeholder;
            document.getElementById('clearBtn').innerHTML = t.clear;
            document.getElementById('copyBtn').innerHTML = t.copy;
            document.getElementById('labelTotalWords').innerText = t.totalWords;
            document.getElementById('labelChineseChars').innerText = t.chineseChars;
            document.getElementById('labelEnglishWords').innerText = t.englishWords;
            document.getElementById('labelNumbers').innerText = t.numbers;
            document.getElementById('labelCharCount').innerText = t.charCount;
            document.getElementById('labelSentences').innerText = t.sentences;
            document.getElementById('labelParagraphs').innerText = t.paragraphs;
            document.getElementById('labelReadingTime').innerText = t.readingTime;
            document.getElementById('labelTopWords').innerText = t.topWords;
            document.getElementById('emptyWordsMsg').innerText = t.emptyWords;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const textInput = document.getElementById('textInput');
        const stats = {
            totalWords: document.getElementById('totalWords'),
            chineseChars: document.getElementById('chineseChars'),
            englishWords: document.getElementById('englishWords'),
            numbers: document.getElementById('numbers'),
            charCount: document.getElementById('charCount'),
            sentences: document.getElementById('sentences'),
            paragraphs: document.getElementById('paragraphs'),
            readingTime: document.getElementById('readingTime')
        };
        const topWordsTags = document.getElementById('topWordsTags');
        const emptyWordsMsg = document.getElementById('emptyWordsMsg');

        function analyzeText(text) {
            const charCount = text.length;
            const chineseChars = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
            const englishWords = (text.match(/[a-zA-Z]+/g) || []).length;
            const numbers = (text.match(/[0-9]+/g) || []).length;
            const totalWords = chineseChars + englishWords + numbers;
            const sentences = text.split(/[。！？\.\!\?]+/).filter(s => s.trim().length > 0).length;
            const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0).length;
            const readingTime = chineseChars > 0 ? Math.ceil(chineseChars / 300) : 0;

            const words = text.match(/[\u4e00-\u9fa5a-zA-Z]+/g) || [];
            const wordCount = {};
            words.forEach(w => {
                const key = w.toLowerCase();
                wordCount[key] = (wordCount[key] || 0) + 1;
            });
            const sortedWords = Object.entries(wordCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            return {
                charCount,
                totalWords,
                chineseChars,
                englishWords,
                numbers,
                sentences,
                paragraphs,
                readingTime,
                topWords: sortedWords
            };
        }

        function updateStats() {
            const text = textInput.value;
            const result = analyzeText(text);

            stats.totalWords.innerText = result.totalWords;
            stats.chineseChars.innerText = result.chineseChars;
            stats.englishWords.innerText = result.englishWords;
            stats.numbers.innerText = result.numbers;
            stats.charCount.innerText = result.charCount;
            stats.sentences.innerText = result.sentences;
            stats.paragraphs.innerText = result.paragraphs;
            stats.readingTime.innerText = result.readingTime;

            if (result.topWords.length === 0) {
                topWordsTags.innerHTML = `<span class="empty">${texts[lang].emptyWords}</span>`;
                return;
            }

            let html = '';
            result.topWords.forEach(([word, count]) => {
                html += `<span class="tag">${word} <span class="count">${count}</span></span>`;
            });
            topWordsTags.innerHTML = html;
        }

        textInput.addEventListener('input', updateStats);

        document.getElementById('clearBtn').addEventListener('click', () => {
            textInput.value = '';
            updateStats();
            textInput.focus();
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const text = textInput.value;
            const result = analyzeText(text);
            const t = texts[lang];
            const lines = [
                `📊 ${t.title}`,
                `─────────────`,
                `${t.totalWords}：${result.totalWords}`,
                `${t.chineseChars}：${result.chineseChars}`,
                `${t.englishWords}：${result.englishWords}`,
                `${t.numbers}：${result.numbers}`,
                `${t.charCount}：${result.charCount}`,
                `${t.sentences}：${result.sentences}`,
                `${t.paragraphs}：${result.paragraphs}`,
                `${t.readingTime}：${result.readingTime}`,
                `─────────────`,
                `${t.topWords}：`,
            ];
            if (result.topWords.length > 0) {
                result.topWords.forEach(([word, count], i) => {
                    lines.push(`  ${i+1}. ${word} (${count})`);
                });
            } else {
                lines.push(`  （--）`);
            }
            const report = lines.join('\n');

            navigator.clipboard.writeText(report).then(() => {
                const btn = document.getElementById('copyBtn');
                const original = btn.innerHTML;
                btn.innerHTML = t.copied;
                setTimeout(() => { btn.innerHTML = original; }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = report;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const btn = document.getElementById('copyBtn');
                const original = btn.innerHTML;
                btn.innerHTML = t.copied;
                setTimeout(() => { btn.innerHTML = original; }, 2000);
            });
        });

        textInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                document.getElementById('clearBtn').click();
            }
        });

        updateStats();
    </script>
</body>
</html>

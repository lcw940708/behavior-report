<script>
document.addEventListener('DOMContentLoaded', function() {

    // 介面語言多語系翻譯
    const i18n = {
        zh: {
            back: "← 文章列表",
            title: "🚗 汽車貸款計算器",
            desc: "試算每月供款金額、利息總支出，並計算包含貸款手續費後的實際年利率 (APR)。",
            inputTitle: "⚙️ 車貸條件設定",
            lblVehiclePrice: "汽車總價 ($)",
            lblDownPayment: "首付金額 ($)",
            lblInterestRate: "名義年利率 (%)",
            lblLoanTerm: "貸款年期 (月)",
            lblLoanFees: "貸款手續費 / 雜費 ($)",
            unitMonths: "個月",
            btnCalc: "即時計算",
            resultTitle: "📊 試算結果",
            lblMonthlyPaymentCard: "💵 每月供款 (Monthly Payment)",
            descMonthlyPayment: "按等額本息分期計算之每月固定應還金額。",
            lblAprCard: "📈 實際年利率 (Effective APR)",
            descAprCard: "考量手續費與相關費用後的真正融資年化成本。",
            lblSummaryCard: "📋 貸款成本結構 Breakdown",
            tdLoanAmount: "實際貸款總額:",
            tdTotalInterest: "利息總支出:",
            tdTotalCost: "購車最終總成本:",
            footHome: "主頁",
            footBlog: "最新文章",
            footAbout: "關於我",
            footPrivacy: "隱私權政策"
        },
        en: {
            back: "← Articles",
            title: "🚗 Auto Loan Calculator",
            desc: "Calculate your monthly payment, total interest costs, and total annual percentage rate (APR) including fees.",
            inputTitle: "⚙️ Loan Terms",
            lblVehiclePrice: "Vehicle Price ($)",
            lblDownPayment: "Down Payment ($)",
            lblInterestRate: "Stated Interest Rate (%)",
            lblLoanTerm: "Loan Term (Months)",
            lblLoanFees: "Upfront Loan Fees ($)",
            unitMonths: "mo",
            btnCalc: "Calculate Now",
            resultTitle: "📊 Payment Summary",
            lblMonthlyPaymentCard: "💵 Monthly Payment",
            descMonthlyPayment: "Fixed monthly payout based on amortized loan schedule.",
            lblAprCard: "📈 Effective APR",
            descAprCard: "True annual borrowing cost including all upfront charges and fees.",
            lblSummaryCard: "📋 Cost Breakdown",
            tdLoanAmount: "Total Loan Amount:",
            tdTotalInterest: "Total Interest Paid:",
            tdTotalCost: "Total Out-of-Pocket Cost:",
            footHome: "Home",
            footBlog: "Blog",
            footAbout: "About",
            footPrivacy: "Privacy Policy"
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let currentLang = urlParams.get('lang') || 'hk';

    function formatCurrency(amount) {
        return '$' + Math.round(amount).toLocaleString('en-US');
    }

    // 計算 APR (Newton-Raphson Iteration)
    function calculateAPR(netLoan, monthlyPayment, months) {
        if (netLoan <= 0 || monthlyPayment <= 0 || months <= 0) return 0;
        let r = 0.005; // 初始月利率猜測 0.5%
        for (let i = 0; i < 100; i++) {
            let f = monthlyPayment * (1 - Math.pow(1 + r, -months)) / r - netLoan;
            let df = monthlyPayment * ( (months * Math.pow(1 + r, -months - 1) * r - (1 - Math.pow(1 + r, -months))) / (r * r) );
            let nextR = r - f / df;
            if (Math.abs(nextR - r) < 1e-7) {
                return nextR * 12 * 100;
            }
            r = nextR;
        }
        return r * 12 * 100;
    }

    // 核心計算
    function calculateAutoLoan() {
        const vehiclePrice = parseFloat(document.getElementById('vehiclePrice').value) || 0;
        const downPayment = parseFloat(document.getElementById('downPayment').value) || 0;
        const interestRate = (parseFloat(document.getElementById('interestRate').value) || 0) / 100;
        const months = parseFloat(document.getElementById('loanTermMonths').value) || 1;
        const fees = parseFloat(document.getElementById('loanFees').value) || 0;

        const loanAmount = Math.max(0, vehiclePrice - downPayment);
        const monthlyRate = interestRate / 12;

        let monthlyPayment = 0;
        if (monthlyRate > 0) {
            monthlyPayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
        } else {
            monthlyPayment = loanAmount / months;
        }

        const totalPayments = monthlyPayment * months;
        const totalInterest = Math.max(0, totalPayments - loanAmount);
        const totalCost = downPayment + totalPayments + fees;

        // 計算實際 APR (把手續費視為實得貸款的扣除)
        const netLoanReceived = loanAmount - fees;
        const effectiveAPR = calculateAPR(netLoanReceived, monthlyPayment, months);

        // 更新介面 UI
        document.getElementById('valMonthlyPayment').textContent = formatCurrency(monthlyPayment);
        document.getElementById('valAPR').textContent = effectiveAPR > 0 ? effectiveAPR.toFixed(2) + '%' : interestRate * 100 + '%';
        document.getElementById('valLoanAmount').textContent = formatCurrency(loanAmount);
        document.getElementById('valTotalInterest').textContent = formatCurrency(totalInterest);
        document.getElementById('valTotalCost').textContent = formatCurrency(totalCost);
    }

    // 多語系渲染
    function renderPage(langKey) {
        currentLang = langKey;
        const isEn = (langKey === 'en');
        const langData = isEn ? i18n.en : i18n.zh;

        document.getElementById('backLink').textContent = langData.back;
        document.getElementById('pageTitle').textContent = langData.title;
        document.getElementById('pageDesc').textContent = langData.desc;
        document.getElementById('inputPanelTitle').textContent = langData.inputTitle;

        document.getElementById('lblVehiclePrice').textContent = langData.lblVehiclePrice;
        document.getElementById('lblDownPayment').textContent = langData.lblDownPayment;
        document.getElementById('lblInterestRate').textContent = langData.lblInterestRate;
        document.getElementById('lblLoanTerm').textContent = langData.lblLoanTerm;
        document.getElementById('lblLoanFees').textContent = langData.lblLoanFees;
        document.getElementById('unitMonths').textContent = langData.unitMonths;
        document.getElementById('btnCalculate').textContent = langData.btnCalc;

        document.getElementById('resultPanelTitle').textContent = langData.resultTitle;
        document.getElementById('lblMonthlyPaymentCard').textContent = langData.lblMonthlyPaymentCard;
        document.getElementById('descMonthlyPayment').textContent = langData.descMonthlyPayment;
        document.getElementById('lblAprCard').textContent = langData.lblAprCard;
        document.getElementById('descAprCard').textContent = langData.descAprCard;
        document.getElementById('lblSummaryCard').textContent = langData.lblSummaryCard;
        document.getElementById('tdLoanAmount').textContent = langData.tdLoanAmount;
        document.getElementById('tdTotalInterest').textContent = langData.tdTotalInterest;
        document.getElementById('tdTotalCost').textContent = langData.tdTotalCost;

        document.getElementById('footHome').textContent = langData.footHome;
        document.getElementById('footBlog').textContent = langData.footBlog;
        document.getElementById('footAbout').textContent = langData.footAbout;
        document.getElementById('footPrivacy').textContent = langData.footPrivacy;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === langKey) {
                btn.classList.add('active');
            }
        });

        calculateAutoLoan();
    }

    // 事件監聽
    document.getElementById('btnCalculate').addEventListener('click', calculateAutoLoan);
    document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('input', calculateAutoLoan);
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const selectedLang = this.dataset.lang;
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', selectedLang);
            window.history.pushState({}, '', newUrl);
            renderPage(selectedLang);
        });
    });

    renderPage(currentLang);
});
</script>
<!-- 語言參數接收與傳遞 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const lang = urlParams.get('lang');
    if (lang) {
        if (typeof setLang === 'function') {
            setLang(lang);
        }
        document.querySelectorAll('a[href]').forEach(function(link) {
            const href = link.getAttribute('href');
            if (href && href.startsWith('../')) {
                const url = new URL(href, window.location.href);
                url.searchParams.set('lang', lang);
                link.setAttribute('href', url.toString());
            }
        });
    }
});
</script>

</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const texts = {
                zh: {
                    title: '匯率換算器',
                    sub: '即時匯率 · 支援 170+ 貨幣',
                    rateLabel: '📊 當前匯率',

            };

            let currentLang = 'zh';
            let exchangeRates = null;

            const subText = document.getElementById('subText');

            const amountLabel = document.getElementById('amountLabel');
            const fromLabel = document.getElementById('fromLabel');
            const toLabel = document.getElementById('toLabel');
            const convertText = document.getElementById('convertText');
            const clearText = document.getElementById('clearText');
            const badge1 = document.getElementById('badge1');
            const badge2 = document.getElementById('badge2');
            const badge3 = document.getElementById('badge3');
            const storyLabel = document.getElementById('storyLabel');
            const otherToolsLabel = document.getElementById('otherToolsLabel');
            const updateTime = document.getElementById('updateTime');

            const amountInput = document.getElementById('amountInput');
            const fromCurrency = document.getElementById('fromCurrency');
            const toCurrency = document.getElementById('toCurrency');
            const swapBtn = document.getElementById('swapBtn');
            const convertBtn = document.getElementById('convertBtn');
            const clearBtn = document.getElementById('clearBtn');

                currentLang = lang;
                const t = lang === 'en' ? texts.en : texts.zh;

                titleText.textContent = t.title;
                subText.textContent = t.sub;
                rateLabel.textContent = t.rateLabel;
                amountLabel.textContent = t.amountLabel;
                fromLabel.textContent = t.fromLabel;
                toLabel.textContent = t.toLabel;
                convertText.textContent = t.convert;
                clearText.textContent = t.clear;
                badge1.textContent = t.badge1;
                badge2.textContent = t.badge2;
                badge3.textContent = t.badge3;
                storyLabel.textContent = t.storyLabel;
                otherToolsLabel.textContent = t.otherTools;

                updateSelectOptions();

                langBtns.forEach(btn => {
                    btn.classList.remove('active');

                        btn.classList.add('active');

                });

                updateRateDisplay();

            const currencyOptions = {

                    { value: 'JPY', label: '🇯🇵 JPY - 日圓' },

                    { value: 'AUD', label: '🇦🇺 AUD - 澳元' },

                    { value: 'MYR', label: '🇲🇾 MYR - 馬來西亞令吉' },

                    { value: 'USD', label: '🇺🇸 USD - US Dollar' },

                    { value: 'AUD', label: '🇦🇺 AUD - Australian Dollar' },

                    { value: 'PHP', label: '🇵🇭 PHP - Philippine Peso' },
                    { value: 'IDR', label: '🇮🇩 IDR - Indonesian Rupiah' },

            function updateSelectOptions() {
                const opts = currentLang === 'en' ? currencyOptions.en : currencyOptions.zh;
                const fromVal = fromCurrency.value;
                const toVal = toCurrency.value;

                fromCurrency.innerHTML = opts.map(o =>
                    `<option value="${o.value}" ${o.value === fromVal ? 'selected' : ''}>${o.label}</option>`
                ).join('');

                toCurrency.innerHTML = opts.map(o =>
                    `<option value="${o.value}" ${o.value === toVal ? 'selected' : ''}>${o.label}</option>`
                ).join('');
            }

            function detectLanguage() {
                const params = new URLSearchParams(window.location.search);
                if (params.get('lang') === 'en') return 'en';
                if (params.get('lang') === 'zh') return 'zh';
                const userLang = navigator.language || navigator.userLanguage;
                if (userLang.startsWith('en')) return 'en';
                return 'zh';
            }

            async function fetchRates() {
                try {
                    // 使用開放穩定 API
                    const url = 'https://open.er-api.com/v6/latest/HKD';
                    const response = await fetch(url);

                    if (!response.ok) throw new Error('API 請求失敗');

                    const data = await response.json();
                    if (data && data.rates) {
                        exchangeRates = data.rates;
                        updateRateDisplay();
                        convertCurrency();

                        const now = new Date();
                        const t = currentLang === 'en' ? texts.en : texts.zh;
                        updateTime.textContent = t.loading.replace('...', '') + ' ' + now.toLocaleTimeString();
                    } else {
                        throw new Error('數據無效');
                    }

                } catch (err) {
                    console.error('獲取匯率失敗:', err);
                    updateTime.textContent = '⚠️ ' + (currentLang === 'en' ? 'Failed to load rates' : '無法載入匯率');
                }
            }

            function updateRateDisplay() {
                if (!exchangeRates) return;

                const from = fromCurrency.value;
                const to = toCurrency.value;

                if (!exchangeRates[from] || !exchangeRates[to]) return;

                if (from === to) {
                    rateDisplay.textContent = '1.0000';
                } else {
                    const rate = exchangeRates[to] / exchangeRates[from];
                    rateDisplay.textContent = rate.toFixed(4);
                }

                const otherRates = document.querySelectorAll('.other-rates .rate-item');
                const displayCurrencies = ['USD', 'CNY', 'EUR', 'JPY', 'GBP', 'AUD'];
                otherRates.forEach((item, index) => {
                    if (index < displayCurrencies.length) {
                        const code = displayCurrencies[index];
                        if (exchangeRates[code] && exchangeRates[from]) {
                            const value = exchangeRates[code] / exchangeRates[from];
                            item.querySelector('.code').textContent = code;
                            item.querySelector('.value').textContent = value.toFixed(4);
                        }
                    }
                });
            }

            function convertCurrency() {
                if (!exchangeRates) {
                    resultAmount.textContent = '--';
                    resultCurrency.textContent = '--';
                    return;
                }

                const amount = parseFloat(amountInput.value);
                if (isNaN(amount) || amount <= 0) {
                    resultAmount.textContent = '--';
                    resultCurrency.textContent = '--';
                    return;
                }

                const from = fromCurrency.value;
                const to = toCurrency.value;

                if (!exchangeRates[from] || !exchangeRates[to]) {
                    resultAmount.textContent = '--';
                    resultCurrency.textContent = '--';
                    return;
                }

                if (from === to) {
                    resultAmount.textContent = amount.toFixed(2);
                    resultCurrency.textContent = to;
                    return;
                }

                const rate = exchangeRates[to] / exchangeRates[from];
                const result = amount * rate;

                resultAmount.textContent = result.toFixed(2);
                resultCurrency.textContent = to;
            }

            function swapCurrencies() {
                const fromVal = fromCurrency.value;
                const toVal = toCurrency.value;
                fromCurrency.value = toVal;
                toCurrency.value = fromVal;
                convertCurrency();
                updateRateDisplay();
            }

            function clearAll() {
                amountInput.value = '';
                resultAmount.textContent = '--';
                resultCurrency.textContent = '--';
            }

            langBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const lang = this.dataset.lang;
                    if (lang === 'hk' || lang === 'tw') {
                        switchLang('zh');
                    } else {
                        switchLang('en');
                    }
                });
            });

            fromCurrency.addEventListener('change', () => {
                convertCurrency();
                updateRateDisplay();
            });

            toCurrency.addEventListener('change', () => {
                convertCurrency();
                updateRateDisplay();
            });

            amountInput.addEventListener('input', convertCurrency);
            swapBtn.addEventListener('click', swapCurrencies);
            convertBtn.addEventListener('click', convertCurrency);
            clearBtn.addEventListener('click', clearAll);

            const detectedLang = detectLanguage();
            switchLang(detectedLang);
            fetchRates();

            setInterval(fetchRates, 5 * 60 * 1000);
        });
    </script>
</body>
</html>

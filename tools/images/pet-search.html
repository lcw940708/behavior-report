<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>寵物食物風險分析器 — 評估貓狗食物風險｜ABRG 免費工具</title>
    <meta name="description" content="免費寵物食物風險分析器，揀選品種、年齡、食物，AI 即時評估風險機率。純前端，私隱安全。" />
    <link rel="canonical" href="https://www.behavior-report.com/tools/pet-food-risk.html" />
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --cyan: #22d3ee;
            --green: #10b981;
            --yellow: #fbbf24;
            --red: #ef4444;
            --border: #24324f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: var(--bg);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.2s;
            appearance: none;
            cursor: pointer;
        }
        .form-group select:focus {
            outline: none;
            border-color: var(--cyan);
        }
        .form-group select option {
            background: var(--card);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            color: var(--cyan);
            text-align: center;
            padding: 20px;
            display: none;
            font-size: 1rem;
        }
        .loading.show { display: block; }
        .loading .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: var(--red);
            text-align: center;
            padding: 15px;
            display: none;
            background: rgba(239, 68, 68, 0.08);
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            margin-top: 15px;
        }
        .error.show { display: block; }

        .result-box {
            margin-top: 25px;
            display: none;
            background: var(--bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(34, 211, 238, 0.15);
        }
        .result-box.show { display: block; }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.06);
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item .label {
            font-size: 0.85rem;
            color: #64748b;
        }
        .result-item .value {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            text-align: right;
            max-width: 60%;
        }
        .result-item .value.risk-low { color: var(--green); }
        .result-item .value.risk-medium { color: var(--yellow); }
        .result-item .value.risk-high { color: var(--red); }

        .risk-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .risk-badge.low { background: rgba(16, 185, 129, 0.15); color: var(--green); }
        .risk-badge.medium { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
        .risk-badge.high { background: rgba(239, 68, 68, 0.15); color: var(--red); }

        .disclaimer {
            margin-top: 20px;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.04);
            border: 1px solid rgba(239, 68, 68, 0.08);
            border-radius: 8px;
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.6;
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 480px) {
            .container { padding: 18px; }
            .result-item { flex-direction: column; align-items: flex-start; gap: 4px; }
            .result-item .value { text-align: left; max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="tool-title">🍖 寵物食物風險分析器</h1>
        <p class="tool-sub">揀選品種、年齡、食物，AI 即時評估風險機率</p>
        <div class="badge-row">
            <span class="badge">🔒 私隱安全</span>
            <span class="badge">🤖 AI 分析</span>
            <span class="badge">🆓 完全免費</span>
        </div>

        <div class="form-group">
            <label>🐱 寵物品種</label>
            <select id="breed">
                <option value="布偶貓">布偶貓</option>
                <option value="緬因貓">緬因貓</option>
                <option value="異國短毛貓">異國短毛貓</option>
                <option value="英國短毛貓">英國短毛貓</option>
                <option value="美國短毛貓">美國短毛貓</option>
                <option value="金毛尋回犬">金毛尋回犬</option>
                <option value="拉布拉多">拉布拉多</option>
                <option value="貴婦狗">貴婦狗</option>
                <option value="松鼠狗">松鼠狗</option>
                <option value="柴犬">柴犬</option>
                <option value="秋田犬">秋田犬</option>
            </select>
        </div>

        <div class="form-group">
            <label>📅 年齡階段</label>
            <select id="age">
                <option value="幼年">幼年（<1歲）</option>
                <option value="成年" selected>成年（1-7歲）</option>
                <option value="老年">老年（>7歲）</option>
            </select>
        </div>

        <div class="form-group">
            <label>🍗 食物</label>
            <select id="food">
                <option value="雞肉">雞肉</option>
                <option value="牛肉">牛肉</option>
                <option value="三文魚">三文魚</option>
                <option value="羊肉">羊肉</option>
                <option value="鴨肉">鴨肉</option>
                <option value="魚肉">魚肉</option>
                <option value="豬肉">豬肉</option>
            </select>
        </div>

        <button class="btn" id="analyzeBtn">🔍 分析風險</button>

        <div class="loading" id="loading"><span class="spinner">⟳</span> AI 分析中，請稍候...</div>
        <div class="error" id="error">❌ 分析失敗，請再試一次</div>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <span class="label">📊 風險等級</span>
                <span class="value" id="resultRisk">—</span>
            </div>
            <div class="result-item">
                <span class="label">🎯 風險機率</span>
                <span class="value" id="resultProbability">—</span>
            </div>
            <div class="result-item" style="flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding-bottom:4px;">
                <span class="label">💡 原因</span>
                <span class="value" id="resultReason" style="text-align:left;max-width:100%;font-weight:400;color:#cbd5e1;font-size:0.9rem;">—</span>
            </div>
            <div class="result-item" style="flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding-top:4px;">
                <span class="label">📝 建議</span>
                <span class="value" id="resultSuggestion" style="text-align:left;max-width:100%;font-weight:400;color:#cbd5e1;font-size:0.9rem;">—</span>
            </div>
        </div>

        <div class="disclaimer">
            ⚠️ 本工具僅供參考，AI 分析結果不能取代獸醫專業意見。如有健康疑慮，請諮詢獸醫。
        </div>

        <div class="story-suggest">
            <div class="label">📖 你可能會中意嘅連載或測驗</div>
            <div class="items">
                <a href="../story_01.html">《你睡著以後》</a>
                <a href="../story_02.html">《貓狗人格》</a>
                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script>
        const WORKER_URL = 'https://pet-ai.lcw940708.workers.dev';

        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultBox = document.getElementById('resultBox');

        const resultRisk = document.getElementById('resultRisk');
        const resultProbability = document.getElementById('resultProbability');
        const resultReason = document.getElementById('resultReason');
        const resultSuggestion = document.getElementById('resultSuggestion');

        const breedSelect = document.getElementById('breed');
        const ageSelect = document.getElementById('age');
        const foodSelect = document.getElementById('food');

        analyzeBtn.addEventListener('click', async function() {
            const breed = breedSelect.value;
            const age = ageSelect.value;
            const food = foodSelect.value;

            analyzeBtn.disabled = true;
            loading.classList.add('show');
            error.classList.remove('show');
            resultBox.classList.remove('show');

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ breed, age, food })
                });

                const data = await response.json();

                if (data.success && data.data) {
                    const d = data.data;
                    
                    // 顯示結果
                    const riskLevel = d.risk_level || '無法判斷';
                    const riskProb = d.risk_probability || '—';
                    
                    resultRisk.textContent = riskLevel;
                    resultRisk.className = 'value';
                    if (riskLevel.includes('低')) resultRisk.classList.add('risk-low');
                    else if (riskLevel.includes('中')) resultRisk.classList.add('risk-medium');
                    else if (riskLevel.includes('高')) resultRisk.classList.add('risk-high');

                    resultProbability.textContent = riskProb;
                    
                    // 處理 reason（可能係 JSON 字串）
                    let reason = d.reason || '—';
                    let suggestion = d.suggestion || '—';
                    
                    // 如果 suggestion 入面有 JSON，嘗試解析
                    try {
                        if (suggestion.startsWith('{')) {
                            const parsed = JSON.parse(suggestion);
                            if (parsed.reason) reason = parsed.reason;
                            if (parsed.risk_level) resultRisk.textContent = parsed.risk_level;
                            if (parsed.risk_probability) resultProbability.textContent = parsed.risk_probability;
                            if (parsed.suggestion) suggestion = parsed.suggestion;
                        }
                    } catch(e) {}

                    resultReason.textContent = reason;
                    resultSuggestion.textContent = suggestion;

                    resultBox.classList.add('show');
                } else {
                    error.textContent = '❌ ' + (data.error || '分析失敗，請再試一次');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '❌ 網絡連線失敗，請檢查網絡後再試';
                error.classList.add('show');
            }

            loading.classList.remove('show');
            analyzeBtn.disabled = false;
        });
    </script>
</body>
</html>

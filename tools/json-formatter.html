<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>免費 JSON 格式化工具 — 美觀排版、壓縮、驗證｜Free JSON Formatter｜ABRG 免費工具</title>
    <meta name="description" content="免費線上 JSON 格式化工具，將亂碼 JSON 排版成易讀格式，支援壓縮、語法高亮、錯誤驗證。Free JSON formatter, validator, minifier, 100% client-side, privacy safe." />
    <link rel="canonical" href="https://www.behavior-report.com/tools/json-formatter.html" />
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --cyan: #22d3ee;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #fbbf24;
            --border: #24324f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .editor-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .editor-area textarea {
            width: 100%;
            height: 280px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: var(--bg);
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.7;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.2s;
        }
        .editor-area textarea:focus {
            outline: none;
            border-color: var(--cyan);
        }
        .editor-area textarea::placeholder {
            color: #475569;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-cyan {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-cyan:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
        }
        .btn-outline:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--green);
            color: var(--green);
        }
        .btn-success:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.04);
            min-height: 40px;
        }
        .status-bar .status {
            font-size: 0.85rem;
            color: #64748b;
        }
        .status-bar .status.valid {
            color: var(--green);
        }
        .status-bar .status.invalid {
            color: var(--red);
        }
        .status-bar .count {
            font-size: 0.8rem;
            color: #64748b;
        }

        .output-area {
            margin-top: 12px;
            display: none;
            background: var(--bg);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid rgba(34, 211, 238, 0.08);
            max-height: 300px;
            overflow: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #e2e8f0;
        }
        .output-area.show {
            display: block;
        }
        .output-area .key {
            color: #f472b6;
        }
        .output-area .string {
            color: #34d399;
        }
        .output-area .number {
            color: #60a5fa;
        }
        .output-area .boolean {
            color: #fbbf24;
        }
        .output-area .null {
            color: #64748b;
        }
        .output-area .bracket {
            color: #a78bfa;
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }
        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
            .toolbar .btn {
                font-size: 0.8rem;
                padding: 8px 14px;
            }
            .editor-area textarea {
                height: 180px;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <a onclick="switchLang('hk')">🇭🇰 港版</a> |
            <a onclick="switchLang('tw')">🇹🇼 台版</a> |
            <a onclick="switchLang('en')">🇬🇧 English</a>
        </div>

        <h1 class="tool-title" id="toolTitle">🔧 JSON 格式化工具</h1>
        <p class="tool-sub" id="toolSub">貼上 JSON 數據，自動排版、壓縮、驗證</p>
        <div class="badge-row">
            <span class="badge" id="badge1">🔒 私隱安全</span>
            <span class="badge" id="badge2">🎨 語法高亮</span>
            <span class="badge" id="badge3">🆓 完全免費</span>
        </div>

        <div class="editor-area">
            <textarea id="jsonInput" placeholder='貼上 JSON 數據，例如：{"name":"ABRG","type":"tool"}'></textarea>

            <div class="toolbar">
                <button class="btn btn-cyan" id="formatBtn">✨ <span id="formatText">格式化</span></button>
                <button class="btn btn-outline" id="compressBtn">📦 <span id="compressText">壓縮</span></button>
                <button class="btn btn-success" id="validateBtn">✅ <span id="validateText">驗證</span></button>
                <button class="btn btn-danger" id="clearBtn">🗑️ <span id="clearText">清空</span></button>
                <button class="btn btn-outline" id="copyBtn">📋 <span id="copyText">複製</span></button>
            </div>

            <div class="status-bar">
                <span class="status" id="statusText">等待輸入...</span>
                <span class="count" id="countText"></span>
            </div>
        </div>

        <div class="output-area" id="outputArea"></div>

        <div class="story-suggest">
            <div class="label" id="storyLabel">📖 你可能會中意嘅連載或測驗</div>
            <div class="items">
                <a href="../story_01.html">《你睡著以後》</a>
                <a href="../story_02.html">《貓狗人格》</a>
                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🔧 JSON 格式化工具',
                sub: '貼上 JSON 數據，自動排版、壓縮、驗證',
                placeholder: '貼上 JSON 數據，例如：{"name":"ABRG","type":"tool"}',
                format: '格式化',
                compress: '壓縮',
                validate: '驗證',
                clear: '清空',
                copy: '複製',
                badge1: '🔒 私隱安全',
                badge2: '🎨 語法高亮',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                waiting: '等待輸入...',
                valid: '✅ 有效 JSON',
                invalid: '❌ 無效 JSON',
                compressed: '✅ 已壓縮',
                copied: '✅ 已複製！',
                chars: '字元數：'
            },
            tw: {
                title: '🔧 JSON 格式化工具',
                sub: '貼上 JSON 數據，自動排版、壓縮、驗證',
                placeholder: '貼上 JSON 數據，例如：{"name":"ABRG","type":"tool"}',
                format: '格式化',
                compress: '壓縮',
                validate: '驗證',
                clear: '清空',
                copy: '複製',
                badge1: '🔒 私隱安全',
                badge2: '🎨 語法高亮',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                waiting: '等待輸入...',
                valid: '✅ 有效 JSON',
                invalid: '❌ 無效 JSON',
                compressed: '✅ 已壓縮',
                copied: '✅ 已複製！',
                chars: '字元數：'
            },
            en: {
                title: '🔧 JSON Formatter',
                sub: 'Paste JSON data, auto format, minify, validate',
                placeholder: 'Paste JSON data, e.g. {"name":"ABRG","type":"tool"}',
                format: 'Format',
                compress: 'Minify',
                validate: 'Validate',
                clear: 'Clear',
                copy: 'Copy',
                badge1: '🔒 Privacy Safe',
                badge2: '🎨 Syntax Highlight',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                waiting: 'Waiting for input...',
                valid: '✅ Valid JSON',
                invalid: '❌ Invalid JSON',
                compressed: '✅ Minified',
                copied: '✅ Copied!',
                chars: 'Characters：'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('jsonInput').placeholder = t.placeholder;
            document.getElementById('formatText').innerText = t.format;
            document.getElementById('compressText').innerText = t.compress;
            document.getElementById('validateText').innerText = t.validate;
            document.getElementById('clearText').innerText = t.clear;
            document.getElementById('copyText').innerText = t.copy;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 核心功能
        // =============================================================
        const jsonInput = document.getElementById('jsonInput');
        const outputArea = document.getElementById('outputArea');
        const statusText = document.getElementById('statusText');
        const countText = document.getElementById('countText');

        const formatBtn = document.getElementById('formatBtn');
        const compressBtn = document.getElementById('compressBtn');
        const validateBtn = document.getElementById('validateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');

        function getJson() {
            const text = jsonInput.value.trim();
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch {
                return null;
            }
        }

        function updateStatus(valid, message, count) {
            const t = texts[lang];
            statusText.textContent = message || t.waiting;
            statusText.className = 'status ' + (valid ? 'valid' : 'invalid');
            countText.textContent = count || '';
        }

        function showOutput(html) {
            outputArea.innerHTML = html;
            outputArea.classList.add('show');
        }

        function hideOutput() {
            outputArea.classList.remove('show');
        }

        function syntaxHighlight(json) {
            const str = JSON.stringify(json, null, 2);
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/("(?:[^"\\]|\\.)*")(?=\s*:)/g, '<span class="key">$1</span>')
                .replace(/("(?:[^"\\]|\\.)*")/g, '<span class="string">$1</span>')
                .replace(/\b(true|false)\b/g, '<span class="boolean">$1</span>')
                .replace(/\bnull\b/g, '<span class="null">$1</span>')
                .replace(/\b(\d+\.?\d*)\b/g, '<span class="number">$1</span>')
                .replace(/([\[\]{}])/g, '<span class="bracket">$1</span>');
        }

        formatBtn.addEventListener('click', function() {
            const t = texts[lang];
            const obj = getJson();
            if (!obj) {
                updateStatus(false, t.invalid + '，' + t.format.toLowerCase());
                hideOutput();
                return;
            }
            const formatted = JSON.stringify(obj, null, 2);
            jsonInput.value = formatted;
            showOutput(syntaxHighlight(obj));
            updateStatus(true, t.valid, t.chars + formatted.length);
        });

        compressBtn.addEventListener('click', function() {
            const t = texts[lang];
            const obj = getJson();
            if (!obj) {
                updateStatus(false, t.invalid + '，' + t.compress.toLowerCase());
                hideOutput();
                return;
            }
            const compressed = JSON.stringify(obj);
            jsonInput.value = compressed;
            hideOutput();
            updateStatus(true, t.compressed, t.chars + compressed.length);
        });

        validateBtn.addEventListener('click', function() {
            const t = texts[lang];
            const text = jsonInput.value.trim();
            if (!text) {
                updateStatus(false, t.waiting);
                hideOutput();
                return;
            }
            try {
                const obj = JSON.parse(text);
                showOutput(syntaxHighlight(obj));
                updateStatus(true, t.valid, t.chars + text.length);
            } catch (e) {
                updateStatus(false, t.invalid + '：' + e.message);
                hideOutput();
            }
        });

        clearBtn.addEventListener('click', function() {
            const t = texts[lang];
            jsonInput.value = '';
            hideOutput();
            updateStatus(false, t.waiting, '');
        });

        copyBtn.addEventListener('click', function() {
            const t = texts[lang];
            const text = jsonInput.value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = t.copied;
                setTimeout(() => { copyBtn.innerHTML = original; }, 2000);
            }).catch(() => {
                jsonInput.select();
                document.execCommand('copy');
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = t.copied;
                setTimeout(() => { copyBtn.innerHTML = original; }, 2000);
            });
        });

        jsonInput.addEventListener('input', function() {
            const t = texts[lang];
            const text = this.value.trim();
            if (!text) {
                updateStatus(false, t.waiting, '');
                hideOutput();
                return;
            }
            try {
                const obj = JSON.parse(text);
                showOutput(syntaxHighlight(obj));
                updateStatus(true, t.valid, t.chars + text.length);
            } catch {
                updateStatus(false, '⚠️ ' + t.invalid + '（繼續輸入...）');
                hideOutput();
            }
        });

        jsonInput.value = '{"name":"ABRG","type":"免費工具","features":["私隱安全","純前端","零成本"],"stats":{"tools":8,"users":"穩定增長"}}';
        jsonInput.dispatchEvent(new Event('input'));
    </script>
</body>
</html>

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];
            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('tabHk').innerHTML = t.tabHk;
            document.getElementById('tabTw').innerHTML = t.tabTw;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });

            renderHolidays(currentYear, currentRegion);
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        // =============================================================
        // Render
        // =============================================================
        function renderHolidays(year, region) {
            const data = holidayData[region]?.[year];
            if (!data) {
                document.getElementById(region + 'List').innerHTML = '<div style="color:#64748b;text-align:center;padding:20px;">暫無數據</div>';
                return;
            }

            const t = texts[lang];
            const list = document.getElementById(region + 'List');
            const totalEl = document.getElementById(region + 'Total');
            const compEl = document.getElementById(region + 'Comp');
            const nextEl = document.getElementById(region + 'Next');

            let html = '';
            let today = new Date();
            let todayStr = today.toISOString().slice(0, 10);
            let nextHoliday = null;
            let compCount = 0;

            // 計算補假日數（週末補假）
            const sorted = [...data].sort((a, b) => a.date.localeCompare(b.date));

            sorted.forEach((h, index) => {
                const dateObj = new Date(h.date + 'T00:00:00');
                const dayOfWeek = dateObj.getDay();
                const dayName = t.dayNames[dayOfWeek];
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                const isToday = h.date === todayStr;

                // 計算補假（如果假期喺週末，政府會補假）
                if (region === 'hk') {
                    // 香港：週日會補假，週六通常唔補
                    if (dayOfWeek === 0) compCount++;
                } else {
                    // 台灣：週六日都會補假
                    if (isWeekend) compCount++;
                }

                // 搵下一個假期
                if (!nextHoliday && h.date >= todayStr) {
                    nextHoliday = h;
                }

                const dateDisplay = dateObj.toLocaleDateString(lang === 'en' ? 'en-US' : 'zh-HK', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });

                let nameDisplay = h.name;
                if (lang === 'en' && h.nameEn) {
                    nameDisplay = h.nameEn;
                }

                html += `
                    <div class="holiday-item">
                        <span class="date">${dateDisplay}</span>
                        <span class="name">${isToday ? '🔴 ' : ''}${nameDisplay}</span>
                        <span class="day">${isWeekend ? '📆' : dayName}</span>
                        ${isToday ? '<span class="badge-holiday">今日</span>' : ''}
                        ${isWeekend ? '<span class="badge-holiday" style="background:rgba(251,191,36,0.12);color:var(--yellow);border-color:rgba(251,191,36,0.12);">補假</span>' : ''}
                    </div>
                `;
            });

            list.innerHTML = html;
            totalEl.textContent = data.length;
            compEl.textContent = compCount;

            if (nextHoliday) {
                const nextDate = new Date(nextHoliday.date + 'T00:00:00');
                const diffDays = Math.ceil((nextDate - new Date()) / (1000 * 60 * 60 * 24));
                const nameDisplay = lang === 'en' && nextHoliday.nameEn ? nextHoliday.nameEn : nextHoliday.name;
                nextEl.textContent = `${nameDisplay} (${diffDays > 0 ? diffDays + '日後' : '今日'})`;
            } else {
                nextEl.textContent = t.noHoliday;
            }
        }

                this.classList.add('active');
                currentYear = parseInt(this.dataset.year);
                renderHolidays(currentYear, currentRegion);
            });
        });

        document.querySelectorAll('.region-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.region-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentRegion = this.dataset.region;
                document.querySelectorAll('.holiday-panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel' + (currentRegion === 'hk' ? 'Hk' : 'Tw')).classList.add('active');
                renderHolidays(currentYear, currentRegion);
            });
        });

        renderHolidays(2026, 'hk');

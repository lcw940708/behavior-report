</head>

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        langBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const l = this.textContent.includes('English') ? 'en' :
                    this.textContent.includes('台') ? 'tw' : 'hk';
                switchLang(l);
            });
        });

        // =============================================================
        // Flags sync
        // =============================================================
        function syncFlags() {
            const checked = [];
            flagCheckboxes.forEach(cb => {
                if (cb.checked) checked.push(cb.value);
            });

            // Update select
            const flagsStr = checked.join('');
            flagsSelect.value = flagsStr;

            // Update select if empty
            if (flagsStr === '') flagsSelect.value = '';
        }

        flagCheckboxes.forEach(cb => {
            cb.addEventListener('change', syncFlags);
        });

        flagsSelect.addEventListener('change', function() {
            const val = this.value;
            flagCheckboxes.forEach(cb => {
                cb.checked = val.includes(cb.value);
            });
        });

        // =============================================================
        // 範例
        // =============================================================
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                patternInput.value = this.dataset.pattern;
                testTextArea.value = this.dataset.text;
                // Reset flags
                flagCheckboxes.forEach(cb => cb.checked = false);
                flagsSelect.value = '';
                testRegex();
            });
        });

        // =============================================================
        // 核心測試
        // =============================================================
        function testRegex() {
            const t = texts[lang];
            const pattern = patternInput.value.trim();
            const text = testTextArea.value;
            const flags = flagsSelect.value || '';

            if (!pattern) {
                resultOutput.innerHTML = `<span class="empty">${t.statusEmpty}</span>`;
                matchCount.textContent = '0';
                groupCount.textContent = '0';
                statusText.textContent = t.statusEmpty;
                statusText.style.color = '#64748b';
                return;
            }

            try {
                const regex = new RegExp(pattern, flags);
                let matches = [];
                let match;

                // 用 matchAll 或 exec
                if (flags.includes('g')) {
                    const allMatches = text.matchAll(regex);
                    matches = Array.from(allMatches);
                } else {
                    const firstMatch = regex.exec(text);
                    if (firstMatch) matches = [firstMatch];
                }

                // 統計
                matchCount.textContent = matches.length;

                let groupCountNum = 0;
                if (matches.length > 0 && matches[0].length > 1) {
                    groupCountNum = matches[0].length - 1;
                }
                groupCount.textContent = groupCountNum;

                statusText.textContent = t.statusValid;
                statusText.style.color = 'var(--green)';

                // 顯示結果（高亮）
                if (matches.length === 0) {
                    resultOutput.textContent = t.noMatch;
                    return;
                }

                // 高亮匹配
                let highlighted = text;
                const replacements = [];

                // 收集所有匹配位置（由後往前取代，避免偏移）
                const positions = [];
                if (flags.includes('g')) {
                    const regexClone = new RegExp(pattern, flags);
                    let m;
                    while ((m = regexClone.exec(text)) !== null) {
                        positions.push({ index: m.index, length: m[0].length });
                    }
                } else {
                    const regexClone = new RegExp(pattern, flags);
                    const m = regexClone.exec(text);
                    if (m) {
                        positions.push({ index: m.index, length: m[0].length });
                    }
                }

                // 由後往前取代
                let result = text;
                for (let i = positions.length - 1; i >= 0; i--) {
                    const pos = positions[i];
                    const before = result.substring(0, pos.index);
                    const matchText = result.substring(pos.index, pos.index + pos.length);
                    const after = result.substring(pos.index + pos.length);
                    result = before + `<span class="match">${escapeHtml(matchText)}</span>` + after;
                }

                // 如果有 capture groups，顯示詳細
                let detail = '';
                if (matches.length > 0 && matches[0].length > 1) {
                    detail = '\n\n📋 捕獲組：';
                    matches.forEach((m, idx) => {
                        detail += `\n  Match ${idx + 1}:`;
                        for (let i = 1; i < m.length; i++) {
                            detail += `\n    Group ${i}: "${m[i] || '(empty)'}"`;
                        }
                    });
                }

                resultOutput.innerHTML = result + escapeHtml(detail);

            } catch (err) {
                matchCount.textContent = '0';
                groupCount.textContent = '0';
                statusText.textContent = t.statusInvalid;
                statusText.style.color = 'var(--red)';
                resultOutput.innerHTML = `<span class="error-text">${t.error}${err.message}</span>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // =============================================================
        // 複製
        // =============================================================
        function copyResult() {
            const t = texts[lang];
            const text = resultOutput.textContent;
            if (!text || text === t.statusEmpty || text === t.noMatch) {
                alert(t.noMatch || '沒有可複製嘅內容');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = t.copied;
                setTimeout(() => {
                    copyBtn.innerHTML = original;
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = t.copied;
                setTimeout(() => {
                    copyBtn.innerHTML = original;
                }, 2000);
            });
        }

        // =============================================================
        // 清空
        // =============================================================
        function clearAll() {
            const t = texts[lang];
            patternInput.value = '';
            testTextArea.value = '';
            flagCheckboxes.forEach(cb => cb.checked = false);
            flagsSelect.value = '';
            resultOutput.innerHTML = `<span class="empty">${t.statusEmpty}</span>`;
            matchCount.textContent = '0';
            groupCount.textContent = '0';
            statusText.textContent = t.statusEmpty;
            statusText.style.color = '#64748b';
        }

        // =============================================================
        // Events
        // =============================================================
        testBtn.addEventListener('click', testRegex);
        copyBtn.addEventListener('click', copyResult);
        clearBtn.addEventListener('click', clearAll);

        patternInput.addEventListener('input', testRegex);
        testTextArea.addEventListener('input', testRegex);
        flagsSelect.addEventListener('change', testRegex);
        flagCheckboxes.forEach(cb => {
            cb.addEventListener('change', testRegex);
        });

        // Ctrl+Enter shortcut
        testTextArea.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                testRegex();
            }
        });

        // =============================================================
        // Init
        // =============================================================
        const detectedLang = detectLanguage();
        switchLang(detectedLang);
        setTimeout(testRegex, 100);
    </script>

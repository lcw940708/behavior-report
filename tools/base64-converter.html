            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('modeText').innerHTML = t.modeText;
            document.getElementById('modeImage').innerHTML = t.modeImage;
            document.getElementById('inputLabel').innerHTML = t.inputLabel;
            document.getElementById('charUnit').innerText = t.charUnit;
            document.getElementById('encodeText').innerText = t.encode;
            document.getElementById('decodeText').innerText = t.decode;
            document.getElementById('clearText').innerText = t.clear;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('imgToBase64Text').innerText = t.imgToBase64;
            document.getElementById('base64ToImgText').innerText = t.base64ToImg;
            document.getElementById('clearImgText').innerText = t.clearImg;
            document.getElementById('resultLabel').innerText = t.result;
            document.getElementById('copyResultText').innerText = t.copyResult;
            document.getElementById('downloadResultText').innerText = t.downloadResult;

            // Update direction labels
            updateDirection();
            document.getElementById('imageDirectionLabel').textContent = t.directionImage;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const modeBtns = document.querySelectorAll('.mode-btn');
        const textMode = document.getElementById('textMode');
        const imageMode = document.getElementById('imageMode');
        const inputText = document.getElementById('inputText');
        const inputCount = document.getElementById('inputCount');
        const directionLabel = document.getElementById('directionLabel');
        const encodeBtn = document.getElementById('encodeBtn');
        const decodeBtn = document.getElementById('decodeBtn');
        const clearBtn = document.getElementById('clearBtn');

        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewImage = document.getElementById('previewImage');
        const fileInfo = document.getElementById('fileInfo');
        const imageDirectionLabel = document.getElementById('imageDirectionLabel');
        const imageToBase64Btn = document.getElementById('imageToBase64Btn');
        const base64ToImageBtn = document.getElementById('base64ToImageBtn');
        const clearImageBtn = document.getElementById('clearImageBtn');

        const resultSection = document.getElementById('resultSection');
        const resultText = document.getElementById('resultText');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const downloadResultBtn = document.getElementById('downloadResultBtn');

        let currentMode = 'text';
        let currentFile = null;
        let currentImageDataURL = null;
        let lastResult = '';

        function getTexts() {
            return texts[lang];
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;

                if (currentMode === 'text') {
                    textMode.style.display = 'block';
                    imageMode.style.display = 'none';
                    resultSection.classList.remove('show');
                } else {
                    textMode.style.display = 'none';
                    imageMode.style.display = 'block';
                    resultSection.classList.remove('show');
                }
            });
        });

        inputText.addEventListener('input', function() {
            inputCount.textContent = this.value.length;
            updateDirection();
        });

        function updateDirection() {
            const t = getTexts();
            const text = inputText.value.trim();
            if (text.length > 0) {
                const isBase64 = /^[A-Za-z0-9+/=]+$/.test(text) && text.length % 4 === 0;
                if (isBase64 && text.length > 10) {
                    directionLabel.textContent = t.directionBase64;
                    return;
                }
            }
            directionLabel.textContent = t.directionText;
        }

        function encodeText() {
            const t = getTexts();
            const text = inputText.value;
            if (!text) {
                alert(t.noText);
                return;
            }

            try {
                const encoded = btoa(unescape(encodeURIComponent(text)));
                showResult(encoded);
            } catch (err) {
                alert(t.encodeFailed + err.message);
            }
        }

        function decodeText() {
            const t = getTexts();
            const text = inputText.value.trim();
            if (!text) {
                alert(t.noBase64);
                return;
            }

            try {
                const decoded = decodeURIComponent(escape(atob(text)));
                showResult(decoded);
            } catch (err) {
                alert(t.decodeFailed);
            }
        }

        function showResult(text) {
            lastResult = text;
            resultText.value = text;
            resultSection.classList.add('show');
            downloadResultBtn.style.display = 'none';
            downloadResultBtn.disabled = true;
        }

        function clearText() {
            inputText.value = '';
            inputCount.textContent = '0';
            resultSection.classList.remove('show');
            lastResult = '';
            updateDirection();
        }

        encodeBtn.addEventListener('click', encodeText);
        decodeBtn.addEventListener('click', decodeText);
        clearBtn.addEventListener('click', clearText);

        // Image mode
        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleImageFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleImageFile(e.target.files[0]);
        });

        function handleImageFile(file) {
            const t = getTexts();
            if (!file.type.startsWith('image/')) {
                alert(t.notImage);
                return;
            }

            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageDataURL = e.target.result;
                previewImage.src = currentImageDataURL;
                imagePreview.classList.add('show');
                fileInfo.textContent = `${file.name} (${formatSize(file.size)})`;
                base64ToImageBtn.disabled = false;
                resultSection.classList.remove('show');
            };
            reader.readAsDataURL(file);
        }

        function imageToBase64() {
            const t = getTexts();
            if (!currentImageDataURL) {
                alert(t.noImage);
                return;
            }

            const base64 = currentImageDataURL.split(',')[1];
            showResult(base64);
            downloadResultBtn.style.display = 'inline-flex';
            downloadResultBtn.disabled = false;
            downloadResultBtn.textContent = '⬇️ ' + t.downloadResult + ' (txt)';
            downloadResultBtn.onclick = function() {
                const blob = new Blob([base64], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `base64_${Date.now()}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };
        }

        function base64ToImage() {
            const t = getTexts();
            const text = resultText.value.trim();
            if (!text) {
                alert(t.enterBase64);
                return;
            }

            try {
                let dataUrl = text;
                if (!dataUrl.startsWith('data:image')) {
                    const header = text.substring(0, 20);
                    let mime = 'image/png';
                    if (header.includes('/9j/')) mime = 'image/jpeg';
                    else if (header.includes('iVBORw0KGgo')) mime = 'image/png';
                    dataUrl = `data:${mime};base64,${text}`;
                }

                const img = new Image();
                img.onload = function() {
                    previewImage.src = dataUrl;
                    imagePreview.classList.add('show');
                    currentImageDataURL = dataUrl;
                    fileInfo.textContent = t.base64ToImgSuccess + ` (${img.width}×${img.height})`;
                    alert(t.base64ToImgSuccess);
                };
                img.onerror = function() {
                    alert(t.invalidBase64);
                };
                img.src = dataUrl;

            } catch (err) {
                alert(t.conversionFailed + err.message);
            }
        }

        function clearImage() {
            currentFile = null;
            currentImageDataURL = null;
            imagePreview.classList.remove('show');
            previewImage.src = '';
            fileInfo.textContent = '';
            base64ToImageBtn.disabled = true;
            resultSection.classList.remove('show');
            fileInput.value = '';
        }

        imageToBase64Btn.addEventListener('click', imageToBase64);
        base64ToImageBtn.addEventListener('click', base64ToImage);
        clearImageBtn.addEventListener('click', clearImage);

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        copyResultBtn.addEventListener('click', function() {
            const t = getTexts();
            const text = resultText.value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const original = this.textContent;
                this.textContent = t.copied;
                setTimeout(() => {
                    this.textContent = original;
                }, 2000);
            }).catch(() => {
                resultText.select();
                document.execCommand('copy');
                alert('已複製到剪貼簿');
            });
        });

        inputText.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                const text = this.value.trim();
                if (/^[A-Za-z0-9+/=]+$/.test(text) && text.length % 4 === 0) {
                    decodeText();
                } else {
                    encodeText();
                }
            }
        });

        updateDirection();
        imageDirectionLabel.textContent = texts[lang].directionImage;
    </script>

</body>
</html>

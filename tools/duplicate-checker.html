    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --text-light: #cbd5e1;
            --cyan: #22d3ee;
            --cyan-hover: #67e8f9;
            --border: #24324f;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #fbbf24;
            --orange: #f97316;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }

        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
        }
        .tool-title .emoji {
            font-size: 1.8rem;
        }

        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        /* ===== 輸入區 ===== */
        .input-section {
            margin-bottom: 16px;
        }

        .input-section textarea {
            width: 100%;
            min-height: 180px;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-light);
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: all 0.2s;
            line-height: 1.7;
        }

        .input-section textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08);
        }

        .input-section textarea::placeholder {
            color: #475569;
        }

        .input-section .char-count {
            text-align: right;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 2px;
        }

        /* ===== 設定 ===== */
        .settings {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            align-items: center;
        }

        .settings .field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings .field label {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .settings .field input[type="number"] {
            width: 60px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-light);
            font-size: 0.85rem;
            outline: none;
        }

        .settings .field input[type="number"]:focus {
            border-color: var(--cyan);
        }

        .settings .field select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-light);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .settings .field select:focus {
            border-color: var(--cyan);
        }

        /* ===== 結果 ===== */
        .result-section {
            margin-top: 16px;
        }

        .result-section .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px 14px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .result-section .stats .stat-item .num {
            color: var(--cyan);
            font-weight: bold;
        }

        .result-section .stats .stat-item .num.warning {
            color: var(--yellow);
        }

        .result-section .stats .stat-item .num.danger {
            color: var(--red);
        }

        .result-section .result-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 350px;
            overflow-y: auto;
        }

        .result-section .result-list .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            background: var(--bg);
            border-radius: 6px;
            border: 1px solid rgba(148, 163, 184, 0.04);
        }

        .result-section .result-list .item .word {
            flex: 1;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .result-section .result-list .item .count {

            min-width: 40px;

        .result-section .result-list .item .count.high {

        }

        .result-section .result-list .item .count.medium {
            color: var(--yellow);
        }

        .result-section .result-list .empty {
            color: #475569;
            text-align: center;
            padding: 20px;
        }

        /* ===== 按鈕 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--cyan-hover);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--green);
            color: #0b0f19;
        }
        .btn-success:hover:not(:disabled) {
            background: #34d399;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ===== Story suggest ===== */
        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }

        .story-suggest .label {

        .story-suggest .items {

            font-size: 0.85rem;
            color: var(--text-light);
            text-decoration: none;

        }

        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }

        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #555;
        }

        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            .settings {
                flex-direction: column;
                align-items: stretch;
            }

            .settings .field {
                flex-wrap: wrap;
            }

            .btn {
                flex: none;
                width: 100%;
            }

            .result-section .stats {
                flex-direction: column;
                gap: 4px;
            }

            .result-section .result-list .item {
                flex-wrap: wrap;
                gap: 4px;
            }
        }
    </style>
</head>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🔍 文字重複檢測',
                sub: '檢查文章入面重複嘅詞語、短語同句子',
                badge1: '🔍 重複檢測',
                badge2: '📊 統計分析',
                badge3: '🔒 私隱安全',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                otherTools: '🔧 其他工具：',
                labelMinCount: '最少出現次數',
                labelMinLength: '最短詞語長度',
                labelMode: '檢測模式',
                optWord: '詞語',
                optPhrase: '短語 (2-3詞)',
                optSentence: '句子',
                check: '🔍 檢測',
                clear: '🗑️ 清空',
                charUnit: '字',
                labelTotalWords: '總詞數',
                labelUniqueWords: '唯一詞語',
                labelDuplicates: '重複詞語',
                labelDuplicationRate: '重複率',
                noResult: '輸入文字後按「檢測」',
                empty: '沒有檢測到重複內容',
                count: '次',
                times: '次'
            },
            tw: {
                title: '🔍 文字重複檢測',
                sub: '檢查文章裡面重複的詞語、短語和句子',
                badge1: '🔍 重複檢測',
                badge2: '📊 統計分析',
                badge3: '🔒 私隱安全',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                otherTools: '🔧 其他工具：',
                labelMinCount: '最少出現次數',
                labelMinLength: '最短詞語長度',
                labelMode: '檢測模式',
                optWord: '詞語',
                optPhrase: '短語 (2-3詞)',
                optSentence: '句子',
                check: '🔍 檢測',
                clear: '🗑️ 清空',
                charUnit: '字',
                labelTotalWords: '總詞數',
                labelUniqueWords: '唯一詞語',
                labelDuplicates: '重複詞語',
                labelDuplicationRate: '重複率',
                noResult: '輸入文字後按「檢測」',
                empty: '沒有檢測到重複內容',
                count: '次',
                times: '次'
            },
            en: {
                title: '🔍 Duplicate Checker',
                sub: 'Find repeated words, phrases and sentences in your text',
                badge1: '🔍 Duplicate Detection',
                badge2: '📊 Statistics',
                badge3: '🔒 Privacy Safe',
                badge4: '🆓 Free',
                storyLabel: '📖 You might also like',
                otherTools: '🔧 Other Tools:',
                labelMinCount: 'Min Occurrences',
                labelMinLength: 'Min Word Length',
                labelMode: 'Mode',
                optWord: 'Words',
                optPhrase: 'Phrases (2-3 words)',
                optSentence: 'Sentences',
                check: '🔍 Check',
                clear: '🗑️ Clear',
                charUnit: 'chars',
                labelTotalWords: 'Total Words',
                labelUniqueWords: 'Unique Words',
                labelDuplicates: 'Duplicates',
                labelDuplicationRate: 'Duplication Rate',
                noResult: 'Enter text and click "Check"',
                empty: 'No duplicates found',
                count: 'times',
                times: 'times'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('labelMinCount').innerText = t.labelMinCount;
            document.getElementById('labelMinLength').innerText = t.labelMinLength;
            document.getElementById('labelMode').innerText = t.labelMode;
            document.getElementById('optWord').innerText = t.optWord;
            document.getElementById('optPhrase').innerText = t.optPhrase;
            document.getElementById('optSentence').innerText = t.optSentence;
            document.getElementById('checkText').innerText = t.check;
            document.getElementById('clearText').innerText = t.clear;
            document.getElementById('charUnit').innerText = t.charUnit;
            document.getElementById('labelTotalWords').innerText = t.labelTotalWords;
            document.getElementById('labelUniqueWords').innerText = t.labelUniqueWords;
            document.getElementById('labelDuplicates').innerText = t.labelDuplicates;
            document.getElementById('labelDuplicationRate').innerText = t.labelDuplicationRate;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        document.querySelectorAll('.lang-switch a').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const l = this.textContent.includes('English') ? 'en' :
                    this.textContent.includes('台') ? 'tw' : 'hk';
                switchLang(l);
            });
        });

        // =============================================================
        // 核心檢測
        // =============================================================
        function checkDuplicates() {
            const text = document.getElementById('inputText').value.trim();
            const minCount = parseInt(document.getElementById('minCount').value) || 2;
            const minLength = parseInt(document.getElementById('minLength').value) || 2;
            const mode = document.getElementById('modeSelect').value;
            const resultSection = document.getElementById('resultSection');
            const resultList = document.getElementById('resultList');
            const t = texts[lang];

            if (!text) {
                resultSection.style.display = 'none';
                return;
            }

            // 提取 tokens
            let tokens = [];
            if (mode === 'word') {
                // 詞語：中英文數字
                tokens = text.match(/[\u4e00-\u9fa5a-zA-Z0-9]+/g) || [];
            } else if (mode === 'phrase') {
                // 短語：2-3 個詞
                const words = text.match(/[\u4e00-\u9fa5a-zA-Z0-9]+/g) || [];
                for (let i = 0; i < words.length - 1; i++) {
                    tokens.push(words[i] + ' ' + words[i + 1]);
                    if (i < words.length - 2) {
                        tokens.push(words[i] + ' ' + words[i + 1] + ' ' + words[i + 2]);
                    }
                }
            } else {
                // 句子：以標點符號分隔
                tokens = text.split(/[。！？\.\!\?]+/).filter(s => s.trim().length > 0).map(s => s.trim());
            }

            // 過濾長度
            if (mode === 'word') {
                tokens = tokens.filter(t => t.length >= minLength);
            }

            // 統計
            const countMap = {};
            tokens.forEach(t => {
                const key = t.toLowerCase();
                countMap[key] = (countMap[key] || 0) + 1;
            });

            // 過濾 > minCount
            const duplicates = Object.entries(countMap)
                .filter(([word, count]) => count >= minCount)
                .sort((a, b) => b[1] - a[1]);

            // 顯示統計
            document.getElementById('totalWords').textContent = tokens.length;
            document.getElementById('uniqueWords').textContent = Object.keys(countMap).length;
            document.getElementById('duplicateWords').textContent = duplicates.length;

            const rate = tokens.length > 0 ?
                Math.round((duplicates.reduce((sum, [w, c]) => sum + c, 0) / tokens.length) * 100) :
                0;
            document.getElementById('duplicationRate').textContent = rate + '%';

            // 顯示結果
            if (duplicates.length === 0) {
                resultList.innerHTML = `<div class="empty">${t.empty}</div>`;
            } else {
                let html = '';
                duplicates.forEach(([word, count]) => {
                    const countClass = count >= 5 ? 'high' : (count >= 3 ? 'medium' : '');
                    html += `
                        <div class="item">
                            <span class="word">${escapeHtml(word)}</span>
                            <span class="count ${countClass}">${count} ${t.times}</span>
                        </div>
                    `;
                });
                resultList.innerHTML = html;
            }

            resultSection.style.display = 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // =============================================================
        // 清空
        // =============================================================
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('inputCount').textContent = '0';
            document.getElementById('resultSection').style.display = 'none';
        }

        // =============================================================
        // Events
        // =============================================================
        const inputText = document.getElementById('inputText');
        const checkBtn = document.getElementById('checkBtn');
        const clearBtn = document.getElementById('clearBtn');

        inputText.addEventListener('input', function() {
            document.getElementById('inputCount').textContent = this.value.length;
        });

        checkBtn.addEventListener('click', checkDuplicates);
        clearBtn.addEventListener('click', clearAll);

        document.getElementById('minCount').addEventListener('change', checkDuplicates);
        document.getElementById('minLength').addEventListener('change', checkDuplicates);
        document.getElementById('modeSelect').addEventListener('change', checkDuplicates);

        // Ctrl+Enter shortcut
        inputText.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                checkDuplicates();
            }
        });

        // =============================================================
        // Init
        // =============================================================
        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // 放入範例
        inputText.value = `今日天氣好好，陽光普照。我今日去咗公園散步，見到好多花。今日嘅天氣真係好好，陽光好溫暖。公園入面嘅花開得好靚，今日真係一個好日子。`;
        document.getElementById('inputCount').textContent = inputText.value.length;
    </script>

</body>

    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --text-light: #cbd5e1;
            --cyan: #22d3ee;
            --cyan-hover: #67e8f9;
            --border: #24324f;
            --red: #ef4444;
            --green: #10b981;
            --yellow: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }

        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
        }
        .tool-title .emoji {
            font-size: 1.8rem;
        }

        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        /* ===== 輸入區 ===== */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group label .badge-label {
            font-size: 0.65rem;
            font-weight: normal;
            padding: 1px 10px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.1);
            color: #64748b;
        }

        .input-group label .badge-label.original {
            border: 1px solid var(--cyan);
            color: var(--cyan);
        }

        .input-group label .badge-label.changed {
            border: 1px solid var(--yellow);
            color: var(--yellow);
        }

        .text-area {
            width: 100%;
            min-height: 180px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-light);
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: all 0.2s;
            line-height: 1.6;
        }

        .text-area:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08);
        }

        .text-area::placeholder {
            color: #475569;
        }

        .char-count {
            text-align: right;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 2px;
        }

        /* ===== 按鈕 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0 16px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--cyan-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-success {
            background: var(--green);
            color: #0b0f19;
        }
        .btn-success:hover:not(:disabled) {
            background: #34d399;
            transform: translateY(-1px);
        }

        /* ===== 結果區 ===== */
        .result-section {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .result-section.show {
            display: block;
        }

        .result-section .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .result-section .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-section .stats .stat-item .num {
            font-weight: bold;
            font-size: 1rem;
        }
        .result-section .stats .stat-item .num.add {
            color: var(--green);
        }
        .result-section .stats .stat-item .num.del {
            color: var(--red);
        }
        .result-section .stats .stat-item .num.equal {
            color: #64748b;
        }

        .result-section .diff-output {
            background: var(--bg);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.92rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid rgba(148, 163, 184, 0.06);
            max-height: 400px;
            overflow-y: auto;
        }

        .diff-output .diff-del {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            text-decoration: line-through;
            border-radius: 3px;
            padding: 0 2px;
        }

        .diff-output .diff-add {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-radius: 3px;
            padding: 0 2px;
        }

        .diff-output .diff-equal {
            color: var(--text-light);
        }

        /* ===== Story suggest ===== */
        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }
        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }
            .input-row {
                grid-template-columns: 1fr;
            }
            .text-area {
                min-height: 120px;
            }
            .btn-group .btn {
                flex: 1;
            }
            .result-section .stats {
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>

<body>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🔍 文字比較器',
                sub: '對比兩段文字差異 · 即時顯示增刪改動',
                badge1: '🔍 逐字對比',
                badge2: '🟢 新增標示',
                badge3: '🔴 刪除標示',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                otherTools: '🔧 其他工具：',
                originalLabel: '📄 原始文字',
                originalBadge: '原文',
                changedLabel: '📄 修改後文字',
                changedBadge: '修改',
                charUnit: '字',
                diff: '🔍 比較差異',
                swap: '🔀 互換',
                clear: '🗑️ 清空',
                addLabel: '新增',
                delLabel: '刪除',
                equalLabel: '相同',
                simLabel: '相似度',
                copyResult: '📋 複製結果',
                copied: '✅ 已複製',
                emptyOriginal: '請輸入「原始文字」',
                emptyChanged: '請輸入「修改後文字」',
                emptyBoth: '請輸入至少一段文字',
                fallbackCopied: '已複製到剪貼簿'
            },
            tw: {
                title: '🔍 文字比較器',
                sub: '對比兩段文字差異 · 即時顯示增刪改動',
                badge1: '🔍 逐字對比',
                badge2: '🟢 新增標示',
                badge3: '🔴 刪除標示',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                otherTools: '🔧 其他工具：',
                originalLabel: '📄 原始文字',
                originalBadge: '原文',
                changedLabel: '📄 修改後文字',
                changedBadge: '修改',
                charUnit: '字',
                diff: '🔍 比較差異',
                swap: '🔀 互換',
                clear: '🗑️ 清空',
                addLabel: '新增',
                delLabel: '刪除',
                equalLabel: '相同',
                simLabel: '相似度',
                copyResult: '📋 複製結果',
                copied: '✅ 已複製',
                emptyOriginal: '請輸入「原始文字」',
                emptyChanged: '請輸入「修改後文字」',
                emptyBoth: '請輸入至少一段文字',
                fallbackCopied: '已複製到剪貼簿'
            },
            en: {
                title: '🔍 Text Diff Tool',
                sub: 'Compare two texts · Instant add/delete highlight',
                badge1: '🔍 Character Diff',
                badge2: '🟢 Add Highlight',
                badge3: '🔴 Delete Highlight',
                badge4: '🆓 Free',
                storyLabel: '📖 You might also like',
                otherTools: '🔧 Other Tools:',
                originalLabel: '📄 Original Text',
                originalBadge: 'Original',
                changedLabel: '📄 Changed Text',
                changedBadge: 'Changed',
                charUnit: 'chars',
                diff: '🔍 Compare',
                swap: '🔀 Swap',
                clear: '🗑️ Clear',
                addLabel: 'Add',
                delLabel: 'Delete',
                equalLabel: 'Equal',
                simLabel: 'Similarity',
                copyResult: '📋 Copy Result',
                copied: '✅ Copied',
                emptyOriginal: 'Please enter "Original Text"',
                emptyChanged: 'Please enter "Changed Text"',
                emptyBoth: 'Please enter at least one text',
                fallbackCopied: 'Copied to clipboard'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('originalLabel').innerHTML = t.originalLabel;
            document.getElementById('originalBadge').innerText = t.originalBadge;
            document.getElementById('changedLabel').innerHTML = t.changedLabel;
            document.getElementById('changedBadge').innerText = t.changedBadge;
            document.getElementById('charUnit').innerText = t.charUnit;
            document.getElementById('charUnit2').innerText = t.charUnit;
            document.getElementById('diffText').innerText = t.diff;
            document.getElementById('swapText').innerText = t.swap;
            document.getElementById('clearText').innerText = t.clear;
            document.getElementById('addLabel').innerText = t.addLabel;
            document.getElementById('delLabel').innerText = t.delLabel;
            document.getElementById('equalLabel').innerText = t.equalLabel;
            document.getElementById('simLabel').innerText = t.simLabel;
            document.getElementById('copyResultText').innerText = t.copyResult;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const originalText = document.getElementById('originalText');
        const changedText = document.getElementById('changedText');
        const originalCount = document.getElementById('originalCount');
        const changedCount = document.getElementById('changedCount');
        const diffBtn = document.getElementById('diffBtn');
        const swapBtn = document.getElementById('swapBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const resultSection = document.getElementById('resultSection');
        const diffOutput = document.getElementById('diffOutput');
        const addCount = document.getElementById('addCount');
        const delCount = document.getElementById('delCount');
        const equalCount = document.getElementById('equalCount');
        const similarity = document.getElementById('similarity');

        originalText.addEventListener('input', function() {
            originalCount.textContent = this.value.length;
        });

        changedText.addEventListener('input', function() {
            changedCount.textContent = this.value.length;
        });

        swapBtn.addEventListener('click', function() {
            const temp = originalText.value;
            originalText.value = changedText.value;
            changedText.value = temp;
            originalCount.textContent = originalText.value.length;
            changedCount.textContent = changedText.value.length;
            resultSection.classList.remove('show');
        });

        clearBtn.addEventListener('click', function() {
            originalText.value = '';
            changedText.value = '';
            originalCount.textContent = '0';
            changedCount.textContent = '0';
            resultSection.classList.remove('show');
        });

        copyResultBtn.addEventListener('click', function() {
            const t = texts[lang];
            const text = diffOutput.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const original = copyResultBtn.textContent;
                copyResultBtn.textContent = t.copied;
                setTimeout(() => {
                    copyResultBtn.textContent = original;
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert(t.fallbackCopied);
            });
        });

        function computeDiff() {
            const t = texts[lang];
            const text1 = originalText.value;
            const text2 = changedText.value;

            if (!text1 && !text2) {
                alert(t.emptyBoth);
                return;
            }

            if (!text1) {
                alert(t.emptyOriginal);
                return;
            }

            if (!text2) {
                alert(t.emptyChanged);
                return;
            }

            const dmp = new diff_match_patch();
            dmp.Diff_Timeout = 1;

            const diffs = dmp.diff_main(text1, text2);
            dmp.diff_cleanupSemantic(diffs);

            let adds = 0,
                dels = 0,
                equals = 0;
            let html = '';

            for (const [type, text] of diffs) {
                const chars = text.replace(/\s/g, '').length;
                if (type === 1) {
                    adds += chars;
                    html += `<span class="diff-add">${escapeHtml(text)}</span>`;
                } else if (type === -1) {
                    dels += chars;
                    html += `<span class="diff-del">${escapeHtml(text)}</span>`;
                } else {
                    equals += chars;
                    html += `<span class="diff-equal">${escapeHtml(text)}</span>`;
                }
            }

            addCount.textContent = adds;
            delCount.textContent = dels;
            equalCount.textContent = equals;

            const total = adds + dels + equals;
            const sim = total > 0 ? Math.round((equals / total) * 100) : 100;
            similarity.textContent = sim + '%';

            diffOutput.innerHTML = html;
            resultSection.classList.add('show');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        diffBtn.addEventListener('click', computeDiff);

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                computeDiff();
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片合成工具 — 免費圖片合成｜Free Image Composer｜ABRG 免費工具</title>
    <meta name="description" content="免費線上圖片合成工具，將兩張圖片合併成一張，支援透明 PNG 前景。Free image composer, merge two images into one, supports transparent PNG overlay, 100% client-side, privacy safe." />
    <link rel="canonical" href="https://www.behavior-report.com/tools/composer.html" />
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --text-light: #cbd5e1;
            --cyan: #22d3ee;
            --cyan-hover: #67e8f9;
            --border: #24324f;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .upload-area {
            border: 2px dashed var(--border);
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: var(--cyan);
        }
        .upload-area .status {
            color: #64748b;
            font-size: 0.9rem;
        }
        .upload-area .status.loaded {
            color: var(--cyan);
        }
        .btn {
            background: var(--cyan);
            color: #0b0f19;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn:hover {
            background: var(--cyan-hover);
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        .preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .hidden {
            display: none;
        }
        .file-input {
            display: none;
        }
        .loading-text {
            color: var(--cyan);
            text-align: center;
            padding: 10px;
            display: none;
        }
        .loading-text.show {
            display: block;
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        .privacy-note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 15px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <a onclick="switchLang('hk')">🇭🇰 港版</a> |
            <a onclick="switchLang('tw')">🇹🇼 台版</a> |
            <a onclick="switchLang('en')">🇬🇧 English</a>
        </div>

        <h1 class="tool-title" id="toolTitle">🖼️ 圖片合成工具</h1>
        <p class="tool-sub" id="toolSub">上傳兩張圖，自動合成埋一齊</p>

        <div class="badge-row">
            <span class="badge" id="badge1">🔒 私隱安全</span>
            <span class="badge" id="badge2">🖼️ 透明 PNG</span>
            <span class="badge" id="badge3">🆓 完全免費</span>
        </div>

        <div class="upload-area" id="fgDrop">
            <p id="fgDropText">📤 點擊上傳前景 (透明 PNG)</p>
            <span class="status" id="fgStatus">未上傳</span>
            <input type="file" id="fgInput" class="file-input" accept="image/png">
        </div>

        <div class="upload-area" id="bgDrop">
            <p id="bgDropText">🖼️ 點擊上傳背景</p>
            <span class="status" id="bgStatus">未上傳</span>
            <input type="file" id="bgInput" class="file-input" accept="image/*">
        </div>

        <button class="btn" id="composeBtn" disabled>🔗 合成圖片</button>
        <div class="loading-text" id="loadingText">⏳ 合成中，請稍候...</div>

        <div class="preview" id="resultArea">
            <img id="resultImg" src="" alt="合成結果" style="display:none;">
            <br><br>
            <button class="btn hidden" id="downloadBtn">⬇️ 下載 PNG</button>
        </div>
        <p class="privacy-note" id="privacyNote">所有圖片只會喺你嘅瀏覽器處理，唔會上傳。</p>

        <div class="story-suggest">
            <div class="label" id="storyLabel">📖 你可能會中意嘅連載或測驗</div>
            <div class="items">
                <a href="../story_01.html">《你睡著以後》</a>
                <a href="../story_02.html">《貓狗人格》</a>
                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🖼️ 圖片合成工具',
                sub: '上傳兩張圖，自動合成埋一齊',
                badge1: '🔒 私隱安全',
                badge2: '🖼️ 透明 PNG',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                fgDrop: '📤 點擊上傳前景 (透明 PNG)',
                bgDrop: '🖼️ 點擊上傳背景',
                fgStatus: '未上傳',
                bgStatus: '未上傳',
                compose: '🔗 合成圖片',
                loading: '⏳ 合成中，請稍候...',
                download: '⬇️ 下載 PNG',
                privacy: '所有圖片只會喺你嘅瀏覽器處理，唔會上傳。',
                uploaded: '✅ 已上傳',
                failed: '合成失敗: ',
                noFg: '請上傳前景圖片',
                noBg: '請上傳背景圖片'
            },
            tw: {
                title: '🖼️ 圖片合成工具',
                sub: '上傳兩張圖，自動合成在一起',
                badge1: '🔒 私隱安全',
                badge2: '🖼️ 透明 PNG',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                fgDrop: '📤 點擊上傳前景 (透明 PNG)',
                bgDrop: '🖼️ 點擊上傳背景',
                fgStatus: '未上傳',
                bgStatus: '未上傳',
                compose: '🔗 合成圖片',
                loading: '⏳ 合成中，請稍候...',
                download: '⬇️ 下載 PNG',
                privacy: '所有圖片只會在你的瀏覽器處理，不會上傳。',
                uploaded: '✅ 已上傳',
                failed: '合成失敗: ',
                noFg: '請上傳前景圖片',
                noBg: '請上傳背景圖片'
            },
            en: {
                title: '🖼️ Image Composer',
                sub: 'Upload two images, merge them into one',
                badge1: '🔒 Privacy Safe',
                badge2: '🖼️ Transparent PNG',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                fgDrop: '📤 Click to upload foreground (transparent PNG)',
                bgDrop: '🖼️ Click to upload background',
                fgStatus: 'Not uploaded',
                bgStatus: 'Not uploaded',
                compose: '🔗 Compose Image',
                loading: '⏳ Composing, please wait...',
                download: '⬇️ Download PNG',
                privacy: 'All images are processed in your browser, never uploaded.',
                uploaded: '✅ Uploaded',
                failed: 'Compose failed: ',
                noFg: 'Please upload foreground image',
                noBg: 'Please upload background image'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('fgDropText').innerHTML = t.fgDrop;
            document.getElementById('bgDropText').innerHTML = t.bgDrop;
            document.getElementById('privacyNote').innerText = t.privacy;

            // Update status texts if not loaded
            if (!fgDataUrl) {
                document.getElementById('fgStatus').textContent = t.fgStatus;
                document.getElementById('fgStatus').className = 'status';
            }
            if (!bgDataUrl) {
                document.getElementById('bgStatus').textContent = t.bgStatus;
                document.getElementById('bgStatus').className = 'status';
            }

            document.getElementById('composeBtn').innerHTML = t.compose;
            document.getElementById('loadingText').innerHTML = t.loading;
            document.getElementById('downloadBtn').innerHTML = t.download;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const fgDrop = document.getElementById('fgDrop');
        const bgDrop = document.getElementById('bgDrop');
        const fgInput = document.getElementById('fgInput');
        const bgInput = document.getElementById('bgInput');
        const fgStatus = document.getElementById('fgStatus');
        const bgStatus = document.getElementById('bgStatus');
        const composeBtn = document.getElementById('composeBtn');
        const resultImg = document.getElementById('resultImg');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingText = document.getElementById('loadingText');

        let fgDataUrl = null;
        let bgDataUrl = null;

        function getTexts() {
            return texts[lang];
        }

        function checkReady() {
            composeBtn.disabled = !(fgDataUrl && bgDataUrl);
        }

        function handleFile(input, statusEl, callback) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                callback(e.target.result);
                const t = getTexts();
                statusEl.textContent = t.uploaded;
                statusEl.className = 'status loaded';
                input.value = '';
                checkReady();
            };
            reader.readAsDataURL(file);
        }

        fgInput.addEventListener('change', () => handleFile(fgInput, fgStatus, (data) => { fgDataUrl = data; }));
        bgInput.addEventListener('change', () => handleFile(bgInput, bgStatus, (data) => { bgDataUrl = data; }));

        fgDrop.addEventListener('click', () => fgInput.click());
        bgDrop.addEventListener('click', () => bgInput.click());

        [fgDrop, bgDrop].forEach((drop) => {
            drop.addEventListener('dragover', (e) => {
                e.preventDefault();
                drop.style.borderColor = '#22d3ee';
            });
            drop.addEventListener('dragleave', () => {
                drop.style.borderColor = '#24324f';
            });
            drop.addEventListener('drop', (e) => {
                e.preventDefault();
                drop.style.borderColor = '#24324f';
                const file = e.dataTransfer.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const data = ev.target.result;
                    const t = getTexts();
                    if (drop === fgDrop) {
                        fgDataUrl = data;
                        fgStatus.textContent = t.uploaded;
                        fgStatus.className = 'status loaded';
                    } else {
                        bgDataUrl = data;
                        bgStatus.textContent = t.uploaded;
                        bgStatus.className = 'status loaded';
                    }
                    checkReady();
                };
                reader.readAsDataURL(file);
            });
        });

        function composeImages() {
            return new Promise((resolve, reject) => {
                const fgImg = new Image();
                const bgImg = new Image();
                let loaded = 0;

                fgImg.onload = () => { loaded++;
                    if (loaded === 2) doCompose(); };
                fgImg.onerror = () => reject(new Error('前景圖片載入失敗'));
                bgImg.onload = () => { loaded++;
                    if (loaded === 2) doCompose(); };
                bgImg.onerror = () => reject(new Error('背景圖片載入失敗'));

                fgImg.src = fgDataUrl;
                bgImg.src = bgDataUrl;

                function doCompose() {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = bgImg.width;
                        canvas.height = bgImg.height;

                        ctx.drawImage(bgImg, 0, 0);

                        const fgW = fgImg.width;
                        const fgH = fgImg.height;
                        const x = (bgImg.width - fgW) / 2;
                        const y = (bgImg.height - fgH) / 2;
                        ctx.drawImage(fgImg, x, y, fgW, fgH);

                        resolve(canvas.toDataURL('image/png'));
                    } catch (err) {
                        reject(err);
                    }
                }
            });
        }

        composeBtn.addEventListener('click', async () => {
            const t = getTexts();
            if (!fgDataUrl) {
                alert(t.noFg);
                return;
            }
            if (!bgDataUrl) {
                alert(t.noBg);
                return;
            }

            composeBtn.disabled = true;
            loadingText.classList.add('show');
            resultImg.style.display = 'none';
            downloadBtn.classList.add('hidden');

            try {
                const result = await composeImages();
                resultImg.src = result;
                resultImg.style.display = 'block';
                downloadBtn.classList.remove('hidden');
            } catch (err) {
                alert(t.failed + err.message);
            } finally {
                composeBtn.disabled = false;
                loadingText.classList.remove('show');
            }
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = resultImg.src;
            link.download = '合成圖.png';
            link.click();
        });
    </script>
</body>
</html>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🖼️ 圖片轉 PDF 工具',
                sub: '將多張圖片合併成一個 PDF 檔案',
                badge1: '🔒 私隱安全',
                badge2: '📄 支援 JPG/PNG/WebP',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                upload: '拖曳圖片到這裡，或點擊揀選',
                hint: '支援 JPG、PNG、WebP，按順序排列',
                pageSize: '📐 PDF 頁面大小：',
                convert: '📄 轉換成 PDF',
                clear: '🗑️ 清空全部',
                loading: '正在轉換中，請稍候...',
                error: '❌ 轉換失敗，請再試一次',
                success: '轉換完成！',
                download: '⬇️ 下載 PDF',
                fileSize: '檔案大小：',
                pages: '頁'
            },
            tw: {
                title: '🖼️ 圖片轉 PDF 工具',
                sub: '將多張圖片合併成一個 PDF 檔案',
                badge1: '🔒 私隱安全',
                badge2: '📄 支援 JPG/PNG/WebP',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                upload: '拖曳圖片到這裡，或點擊選擇',
                hint: '支援 JPG、PNG、WebP，按順序排列',
                pageSize: '📐 PDF 頁面大小：',
                convert: '📄 轉換成 PDF',
                clear: '🗑️ 清空全部',
                loading: '正在轉換中，請稍候...',
                error: '❌ 轉換失敗，請再試一次',
                success: '轉換完成！',
                download: '⬇️ 下載 PDF',
                fileSize: '檔案大小：',
                pages: '頁'
            },
            en: {
                title: '🖼️ Images to PDF Converter',
                sub: 'Merge multiple images into one PDF file',
                badge1: '🔒 Privacy Safe',
                badge2: '📄 Supports JPG/PNG/WebP',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                upload: 'Drag & drop your images here, or click to select',
                hint: 'Supports JPG, PNG, WebP, sorted by upload order',
                pageSize: '📐 PDF Page Size：',
                convert: '📄 Convert to PDF',
                clear: '🗑️ Clear All',
                loading: 'Converting, please wait...',
                error: '❌ Conversion failed, please try again',
                success: 'Conversion complete!',
                download: '⬇️ Download PDF',
                fileSize: 'File size：',
                pages: 'pages'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('labelPageSize').innerText = t.pageSize;
            document.getElementById('convertBtn').innerHTML = t.convert;
            document.getElementById('clearBtn').innerHTML = t.clear;
            document.getElementById('loadingText').innerText = t.loading;
            document.getElementById('error').innerHTML = '❌ ' + t.error;
            document.getElementById('resultMessage').innerText = t.success;
            document.getElementById('downloadBtn').innerHTML = t.download;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('dropArea');
        const fileList = document.getElementById('fileList');
        const fileItems = document.getElementById('fileItems');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultBox = document.getElementById('resultBox');
        const resultSize = document.getElementById('resultSize');
        const downloadBtn = document.getElementById('downloadBtn');
        const pageSizeSelect = document.getElementById('pageSize');

        let imageFiles = [];
        let pdfData = null;

        function renderFileList() {
            if (imageFiles.length === 0) {
                fileList.classList.remove('show');
                return;
            }
            fileList.classList.add('show');

            let html = '';
            imageFiles.forEach((file, index) => {
                const previewUrl = URL.createObjectURL(file);
                html += `
                    <div class="file-item">
                        <span class="index">#${index + 1}</span>
                        <img class="preview-img" src="${previewUrl}" alt="" />
                        <span class="name">${file.name}</span>
                        <span class="size">${formatSize(file.size)}</span>
                        <div class="actions">
                            <button class="move-up" data-index="${index}" title="上移">↑</button>
                            <button class="move-down" data-index="${index}" title="下移">↓</button>
                            <button class="remove" data-index="${index}" title="移除">✕</button>
                        </div>
                    </div>
                `;
            });
            fileItems.innerHTML = html;

            document.querySelectorAll('.remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    imageFiles.splice(idx, 1);
                    renderFileList();
                    resetResult();
                });
            });

            document.querySelectorAll('.move-up').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (idx > 0) {
                        [imageFiles[idx], imageFiles[idx - 1]] = [imageFiles[idx - 1], imageFiles[idx]];
                        renderFileList();
                        resetResult();
                    }
                });
            });

            document.querySelectorAll('.move-down').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (idx < imageFiles.length - 1) {
                        [imageFiles[idx], imageFiles[idx + 1]] = [imageFiles[idx + 1], imageFiles[idx]];
                        renderFileList();
                        resetResult();
                    }
                });
            });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function resetResult() {
            resultBox.classList.remove('show');
            pdfData = null;
        }

        function handleFiles(newFiles) {
            const imageTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'image/bmp', 'image/svg+xml'];
            const validFiles = Array.from(newFiles).filter(f => {
                return imageTypes.includes(f.type) || f.name.match(/\.(jpg|jpeg|png|webp|gif|bmp|svg)$/i);
            });
            if (validFiles.length === 0) {
                alert('請上傳圖片檔案（JPG、PNG、WebP 等）');
                return;
            }
            imageFiles = imageFiles.concat(validFiles);
            renderFileList();
            resetResult();
        }

        dropArea.addEventListener('click', () => fileInput.click());
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
                fileInput.value = '';
            }
        });

        clearBtn.addEventListener('click', () => {
            imageFiles = [];
            renderFileList();
            resetResult();
        });

        convertBtn.addEventListener('click', async () => {
            if (imageFiles.length === 0) {
                alert('請先上傳圖片');
                return;
            }

            convertBtn.disabled = true;
            loading.classList.add('show');
            error.classList.remove('show');
            resultBox.classList.remove('show');

            try {
                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.create();
                const pageSize = pageSizeSelect.value;

                const sizes = {
                    'A4': { width: 595, height: 842 },
                    'A5': { width: 420, height: 595 },
                    'Letter': { width: 612, height: 792 },
                    'Fit': null
                };

                for (const file of imageFiles) {
                    const imageData = await file.arrayBuffer();
                    let image;

                    if (file.type === 'image/png' || file.name.match(/\.png$/i)) {
                        image = await pdfDoc.embedPng(imageData);
                    } else if (file.type === 'image/jpeg' || file.name.match(/\.(jpg|jpeg)$/i)) {
                        image = await pdfDoc.embedJpg(imageData);
                    } else {
                        const img = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const img = new Image();
                                img.onload = () => resolve(img);
                                img.src = e.target.result;
                            };
                            reader.readAsDataURL(file);
                        });
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const jpgDataUrl = canvas.toDataURL('image/jpeg');
                        const jpgBuffer = await fetch(jpgDataUrl).then(res => res.arrayBuffer());
                        image = await pdfDoc.embedJpg(jpgBuffer);
                    }

                    const imgWidth = image.width;
                    const imgHeight = image.height;

                    let pageWidth, pageHeight;
                    if (sizes[pageSize]) {
                        pageWidth = sizes[pageSize].width;
                        pageHeight = sizes[pageSize].height;
                    } else {
                        const maxWidth = 595;
                        const maxHeight = 842;
                        const scale = Math.min(maxWidth / imgWidth, maxHeight / imgHeight);
                        pageWidth = imgWidth * scale;
                        pageHeight = imgHeight * scale;
                    }

                    const page = pdfDoc.addPage([pageWidth, pageHeight]);

                    const scaleX = (pageWidth - 40) / imgWidth;
                    const scaleY = (pageHeight - 40) / imgHeight;
                    const scale = Math.min(scaleX, scaleY, 1);
                    const finalWidth = imgWidth * scale;
                    const finalHeight = imgHeight * scale;
                    const x = (pageWidth - finalWidth) / 2;
                    const y = (pageHeight - finalHeight) / 2;

                    page.drawImage(image, {
                        x: x,
                        y: y,
                        width: finalWidth,
                        height: finalHeight,
                    });
                }

                const pdfBytes = await pdfDoc.save();
                pdfData = pdfBytes;

                const t = texts[lang];
                const sizeInMB = (pdfBytes.length / (1024 * 1024)).toFixed(2);
                resultSize.innerText = `${t.fileSize}${sizeInMB} MB（${pdfBytes.length.toLocaleString()} bytes）· ${imageFiles.length} ${t.pages}`;
                resultBox.classList.add('show');

            } catch (err) {
                const t = texts[lang];
                error.innerText = '❌ ' + (err.message || t.error);
                error.classList.add('show');
            }

            loading.classList.remove('show');
            convertBtn.disabled = false;
        });

        downloadBtn.addEventListener('click', () => {
            if (!pdfData) return;
            const blob = new Blob([pdfData], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'images.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        renderFileList();
    </script>
</body>
</html>

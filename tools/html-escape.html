<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>

    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --text-light: #cbd5e1;
            --cyan: #22d3ee;
            --cyan-hover: #67e8f9;
            --border: #24324f;
            --green: #10b981;
            --red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }

        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
        }
        .tool-title .emoji {
            font-size: 1.8rem;
        }

        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        /* ===== 模式切換 ===== */
        .mode-selector {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid rgba(148, 163, 184, 0.06);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }

        .mode-btn:hover {
            color: var(--text-light);
        }

        .mode-btn.active {
            background: var(--cyan);
            color: #0b0f19;
        }

        /* ===== 輸入/輸出 ===== */
        .editor-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .editor-area textarea {
            width: 100%;
            min-height: 150px;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-light);
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            resize: vertical;
            outline: none;
            transition: all 0.2s;
            line-height: 1.6;
        }

        .editor-area textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08);
        }

        .editor-area textarea::placeholder {
            color: #475569;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .editor-area .char-count {
            text-align: right;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 2px;
        }

        .result-area {
            margin-top: 16px;
        }

        .result-area .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .result-area .result-box {
            background: var(--bg);
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid rgba(148, 163, 184, 0.06);
            min-height: 60px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            color: var(--text-light);
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .result-area .result-box .empty {
            color: #475569;
        }

        /* ===== 按鈕 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--cyan-hover);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--green);
            color: #0b0f19;
        }
        .btn-success:hover:not(:disabled) {
            background: #34d399;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ===== Story suggest ===== */
        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }

        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.2s;
        }

        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }

        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #555;
        }

        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            .mode-selector {
                flex-wrap: wrap;
            }

            .mode-btn {
                flex: 1 1 45%;
                font-size: 0.8rem;
                padding: 8px;
            }

            .btn {
                flex: none;
                width: 100%;
            }

            .editor-area textarea {
                min-height: 120px;
            }
        }
    </style>
</head>

<body>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🔣 HTML 轉義工具',
                sub: 'HTML 特殊字符 ↔ HTML Entities 互轉 · 開發者必備',
                badge1: '🔀 雙向轉換',
                badge2: '⚡ 即時處理',
                badge3: '🔒 私隱安全',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                otherTools: '🔧 其他工具：',
                modeEscape: '🛡️ 轉義 (→ HTML Entities)',
                modeUnescape: '🔓 解碼 (← HTML Entities)',
                charUnit: '字',
                convert: '🔄 轉換',
                copy: '📋 複製結果',
                clear: '🗑️ 清空',
                result: '📄 結果',
                empty: '等待輸入...',
                copied: '✅ 已複製！',
                noInput: '請輸入文字',
                placeholder: '輸入你要轉換嘅文字...',
                escapeDesc: '將 HTML 特殊字符轉為 HTML Entities，防止瀏覽器誤解',
                unescapeDesc: '將 HTML Entities 解碼還原為正常字符'
            },
            tw: {
                title: '🔣 HTML 轉義工具',
                sub: 'HTML 特殊字符 ↔ HTML Entities 互轉 · 開發者必備',
                badge1: '🔀 雙向轉換',
                badge2: '⚡ 即時處理',
                badge3: '🔒 私隱安全',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                otherTools: '🔧 其他工具：',
                modeEscape: '🛡️ 轉義 (→ HTML Entities)',
                modeUnescape: '🔓 解碼 (← HTML Entities)',
                charUnit: '字',
                convert: '🔄 轉換',
                copy: '📋 複製結果',
                clear: '🗑️ 清空',
                result: '📄 結果',
                empty: '等待輸入...',
                copied: '✅ 已複製！',
                noInput: '請輸入文字',
                placeholder: '輸入你要轉換的文字...',
                escapeDesc: '將 HTML 特殊字符轉為 HTML Entities，防止瀏覽器誤解',
                unescapeDesc: '將 HTML Entities 解碼還原為正常字符'
            },
            en: {
                title: '🔣 HTML Escape Tool',
                sub: 'HTML Special Chars ↔ HTML Entities · Developer Essential',
                badge1: '🔀 Bidirectional',
                badge2: '⚡ Instant Processing',
                badge3: '🔒 Privacy Safe',
                badge4: '🆓 Free',
                storyLabel: '📖 You might also like',
                otherTools: '🔧 Other Tools:',
                modeEscape: '🛡️ Escape (→ HTML Entities)',
                modeUnescape: '🔓 Unescape (← HTML Entities)',
                charUnit: 'chars',
                convert: '🔄 Convert',
                copy: '📋 Copy Result',
                clear: '🗑️ Clear',
                result: '📄 Result',
                empty: 'Waiting for input...',
                copied: '✅ Copied!',
                noInput: 'Please enter text',
                placeholder: 'Enter text to convert...',
                escapeDesc: 'Convert HTML special characters to HTML Entities',
                unescapeDesc: 'Decode HTML Entities back to normal characters'
            }
        };

        let lang = 'hk';
        let currentMode = 'escape';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;
            document.getElementById('modeEscape').innerHTML = t.modeEscape;
            document.getElementById('modeUnescape').innerHTML = t.modeUnescape;
            document.getElementById('charUnit').innerText = t.charUnit;
            document.getElementById('convertText').innerText = t.convert;
            document.getElementById('copyText').innerText = t.copy;
            document.getElementById('clearText').innerText = t.clear;
            document.getElementById('resultLabel').innerText = t.result;
            document.getElementById('emptyText').innerText = t.empty;
            document.getElementById('inputText').placeholder = t.placeholder;

            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });

            convert();
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        document.querySelectorAll('.lang-switch a').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const l = this.textContent.includes('English') ? 'en' :
                    this.textContent.includes('台') ? 'tw' : 'hk';
                switchLang(l);
            });
        });

        // =============================================================
        // 模式切換
        // =============================================================
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                convert();
            });
        });

        // =============================================================
        // 核心轉換
        // =============================================================
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
                '`': '&#96;'
            };
            return text.replace(/[&<>"'`]/g, function(m) { return map[m]; });
        }

        function unescapeHtml(text) {
            const map = {
                '&amp;': '&',
                '&lt;': '<',
                '&gt;': '>',
                '&quot;': '"',
                '&#39;': "'",
                '&#96;': '`'
            };
            return text.replace(/&amp;|&lt;|&gt;|&quot;|&#39;|&#96;/g, function(m) { return map[m]; });
        }

        function convert() {
            const input = document.getElementById('inputText');
            const resultBox = document.getElementById('resultBox');
            const emptyText = document.getElementById('emptyText');
            const inputCount = document.getElementById('inputCount');
            const text = input.value;

            inputCount.textContent = text.length;

            if (!text) {
                resultBox.innerHTML = `<span class="empty">${texts[lang].empty}</span>`;
                return;
            }

            let result;
            if (currentMode === 'escape') {
                result = escapeHtml(text);
            } else {
                result = unescapeHtml(text);
            }

            resultBox.textContent = result;
        }

        // =============================================================
        // Events
        // =============================================================
        const inputText = document.getElementById('inputText');
        const convertBtn = document.getElementById('convertBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        inputText.addEventListener('input', convert);
        convertBtn.addEventListener('click', convert);

        copyBtn.addEventListener('click', function() {
            const t = texts[lang];
            const resultBox = document.getElementById('resultBox');
            const text = resultBox.textContent;

            if (!text || text === t.empty) {
                alert(t.noInput);
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                const original = this.textContent;
                this.innerHTML = t.copied;
                setTimeout(() => {
                    this.innerHTML = original;
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const original = this.textContent;
                this.innerHTML = t.copied;
                setTimeout(() => {
                    this.innerHTML = original;
                }, 2000);
            });
        });

        clearBtn.addEventListener('click', function() {
            inputText.value = '';
            const resultBox = document.getElementById('resultBox');
            const t = texts[lang];
            resultBox.innerHTML = `<span class="empty">${t.empty}</span>`;
            document.getElementById('inputCount').textContent = '0';
            inputText.focus();
        });

        // Ctrl+Enter shortcut
        inputText.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                convert();
            }
        });

        // =============================================================
        // Init
        // =============================================================
        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // 放入範例
        inputText.value = '<p>Hello & "World"</p>';
        convert();
    </script>

</body>

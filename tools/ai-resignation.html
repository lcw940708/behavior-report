        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

                    }
                    return `請用${l}繁體中文幫我寫一封表揚信。員工姓名：${employee}，表揚成就：${achievement}，感謝語：${thanks}。請用正式、溫暖、鼓勵嘅語氣。`;
                }
            },
            'thanks': {

                fields: [
                    { id: 'recipient', label_hk: '👤 感謝對象', label_tw: '👤 感謝對象', label_en: '👤 Recipient',
                        placeholder_hk: '例如：王老師', placeholder_tw: '例如：王老師', placeholder_en: 'e.g. Mr. Wang' },
                    { id: 'reason', label_hk: '📝 感謝原因', label_tw: '📝 感謝原因', label_en: '📝 Reason',
                        placeholder_hk: '例如：喺我離職前一直支持同指導我', placeholder_tw: '例如：在我離職前一直支持與指導我',
                        placeholder_en: 'e.g. For your support and guidance' }
                ],
                prompt: (data, lang) => {
                    const l = lang === 'en' ? 'English' : (lang === 'tw' ? '台灣' : '香港');
                    const recipient = data.recipient || '[Recipient]';
                    const reason = data.reason || '[Reason]';
                    if (lang === 'en') {
                        return `Write a thank you letter in English. Recipient: ${recipient}, Reason: ${reason}. Use sincere and warm tone.`;
                    }
                    return `請用${l}繁體中文幫我寫一封感謝信。感謝對象：${recipient}，感謝原因：${reason}。請用真誠、溫暖嘅語氣。`;
                }
            },
            'complaint': {

                fields: [
                    { id: 'target', label_hk: '🎯 投訴對象', label_tw: '🎯 投訴對象', label_en: '🎯 Target',
                        placeholder_hk: '例如：XX 電訊公司', placeholder_tw: '例如：XX 電信公司',
                        placeholder_en: 'e.g. ABC Telecom' },
                    { id: 'event', label_hk: '📋 事件經過', label_tw: '📋 事件經過', label_en: '📋 Incident',
                        placeholder_hk: '例如：合約到期後仍被自動續約收費', placeholder_tw: '例如：合約到期後仍被自動續約收費',
                        placeholder_en: 'e.g. Auto-renewal after contract ended' },
                    { id: 'expectation', label_hk: '✅ 期望結果', label_tw: '✅ 期望結果', label_en: '✅ Expectation',
                        placeholder_hk: '例如：全數退款及終止合約', placeholder_tw: '例如：全額退款及終止合約',
                        placeholder_en: 'e.g. Full refund and contract termination' }
                ],
                prompt: (data, lang) => {
                    const l = lang === 'en' ? 'English' : (lang === 'tw' ? '台灣' : '香港');
                    const target = data.target || '[Target]';
                    const event = data.event || '[Event]';
                    const expectation = data.expectation || '[Expectation]';
                    if (lang === 'en') {
                        return `Write a complaint letter in English. Target: ${target}, Incident: ${event}, Expectation: ${expectation}. Use formal and polite tone.`;

                }
            },
            'apology': {
                label: { hk: '🙏 道歉信', tw: '🙏 道歉信', en: '🙏 Apology Letter' },
                fields: [
                    { id: 'recipient', label_hk: '👤 道歉對象', label_tw: '👤 道歉對象', label_en: '👤 Recipient',
                        placeholder_hk: '例如：客戶張先生', placeholder_tw: '例如：客戶張先生',
                        placeholder_en: 'e.g. Client Mr. Zhang' },
                    { id: 'event', label_hk: '📋 事件經過', label_tw: '📋 事件經過', label_en: '📋 Incident',
                        placeholder_hk: '例如：延遲交貨，影響客戶營運', placeholder_tw: '例如：延遲交貨，影響客戶營運',
                        placeholder_en: 'e.g. Delayed delivery' },
                    { id: 'remedy', label_hk: '🛠️ 補救措施', label_tw: '🛠️ 補救措施', label_en: '🛠️ Remedy',
                        placeholder_hk: '例如：全額退款及提供折扣優惠', placeholder_tw: '例如：全額退款及提供折扣優惠',

                ],

                    const remedy = data.remedy || '[Remedy]';

                        return `Write an apology letter in English. Recipient: ${recipient}, Incident: ${event}, Remedy: ${remedy}. Use sincere and accountable tone.`;
                    }
                    return `請用${l}繁體中文幫我寫一封道歉信。道歉對象：${recipient}，事件經過：${event}，補救措施：${remedy}。請用真誠、負責任嘅語氣。`;
                }
            }
        };

        const dynamicFields = document.getElementById('dynamicFields');

        function renderFields(docType, lang) {
            const config = docConfigs[docType];
            if (!config) return;

            let html = '';
            config.fields.forEach(f => {
                const label = lang === 'en' ? f.label_en : (lang === 'tw' ? f.label_tw : f.label_hk);
                const placeholder = lang === 'en' ? f.placeholder_en : (lang === 'tw' ? f.placeholder_tw : f
                    .placeholder_hk);
                html += `
                    <div class="form-group">
                        <label>${label}</label>
                        <input type="text" id="${f.id}" placeholder="${placeholder}" />
                    </div>
                `;
            });
            dynamicFields.innerHTML = html;
        }

        document.getElementById('docType').addEventListener('change', function() {
            renderFields(this.value, lang);
        });

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        const workerUrl = 'https://little-rice-42fa.lcw940708.workers.dev';

        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        generateBtn.addEventListener('click', async () => {
            const docType = document.getElementById('docType').value;
            const config = docConfigs[docType];
            const tone = document.getElementById('tone').value;
            const t = texts[lang];

            const data = {};
            config.fields.forEach(f => {
                const el = document.getElementById(f.id);
                if (el) data[f.id] = el.value.trim();
            });

            const userPrompt = config.prompt(data, lang);

            generateBtn.disabled = true;
            loading.classList.add('show');
            error.classList.remove('show');
            resultBox.classList.remove('show');

            try {
                // 💡 關鍵修復：加入 { cache: "no-store", mode: "cors" } 避免 Service Worker 誤將 POST 請求塞入 Cache 導致 crash
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    mode: 'cors',
                    cache: 'no-store',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: userPrompt,
                        tone: tone,
                        lang: lang
                    })
                });

                const result = await response.json();

                if (result.success) {
                    resultContent.innerText = result.content;
                    resultBox.classList.add('show');
                } else {
                    error.innerText = '❌ ' + (result.error || t.error);
                    error.classList.add('show');
                }
            } catch (err) {
                console.error(err);
                error.innerText = t.networkError;
                error.classList.add('show');
            }

            loading.classList.remove('show');
            generateBtn.disabled = false;
        });

        copyBtn.addEventListener('click', () => {
            const t = texts[lang];
            const content = resultContent.innerText;
            navigator.clipboard.writeText(content).then(() => {
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = t.copied;
                setTimeout(() => { copyBtn.innerHTML = original; }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = content;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = t.copied;
                setTimeout(() => { copyBtn.innerHTML = original; }, 2000);
            });
        });

        downloadBtn.addEventListener('click', () => {
            const content = resultContent.innerText;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const names = {
                'resignation': 'Resignation_Letter',
                'cover-letter': 'Cover_Letter',
                'recommendation': 'Recommendation_Letter',
                'warning': 'Warning_Letter',
                'praise': 'Praise_Letter',
                'thanks': 'Thank_You_Letter',
                'complaint': 'Complaint_Letter',
                'apology': 'Apology_Letter'
            };
            const docType = document.getElementById('docType').value;
            a.download = `${names[docType] || 'document'}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') generateBtn.click();
            });
        });
    </script>

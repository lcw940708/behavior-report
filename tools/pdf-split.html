    <script>

                page: '頁',
                allSelected: '你揀選咗全部頁面。如果只係想下載原檔，直接下載就得，唔使拆。',
                selectAtLeast: '請至少揀選 1 頁進行拆分',
                fileSize: '檔案大小：',
                bytes: 'bytes',
            },
            tw: {
                title: '✂️ PDF 拆分工具',
                sub: '上傳 PDF，揀選頁面，拆出一個新 PDF',
                badge1: '🔒 私隱安全',
                badge2: '📄 逐頁揀選',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                upload: '拖曳 PDF 檔案到這裡，或點擊選擇',
                hint: '支援單一 PDF，揀選要拆出的頁面',
                selectAll: '✅ 全選',
                deselectAll: '⬜ 取消全選',
                selectOdd: '🔢 單數頁',
                selectEven: '🔢 雙數頁',
                selectedPrefix: '已揀選 ',
                selectedSuffix: ' 頁',
                split: '下載已揀選頁面',
                clear: '清空',

                error: '處理失敗，請再試一次',
                result: '拆分完成！',
                download: '下載拆分後 PDF',

                selectAtLeast: '請至少揀選 1 頁進行拆分',

            },
            en: {
                title: '✂️ PDF Splitter',
                sub: 'Upload PDF, select pages, extract to a new PDF',
                badge1: '🔒 Privacy Safe',
                badge2: '📄 Select Pages',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                upload: 'Drag & drop your PDF here, or click to select',

                selectAll: '✅ Select All',
                deselectAll: '⬜ Deselect All',
                selectOdd: '🔢 Odd Pages',
                selectEven: '🔢 Even Pages',
                selectedPrefix: 'Selected ',
                selectedSuffix: ' pages',
                split: 'Download Selected Pages',
                clear: 'Clear',
                loading: 'Processing, please wait...',
                error: 'Failed, please try again',
                result: 'Split complete!',
                download: 'Download Extracted PDF',
                page: 'pages',
                allSelected: 'You selected all pages. If you just want to download the original file, you can download it directly without splitting.',
                selectAtLeast: 'Please select at least 1 page to split',
                fileSize: 'File size：',
                bytes: 'bytes',
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('selectAllBtn').innerText = t.selectAll;
            document.getElementById('deselectAllBtn').innerText = t.deselectAll;
            document.getElementById('selectOddBtn').innerText = t.selectOdd;
            document.getElementById('selectEvenBtn').innerText = t.selectEven;
            document.getElementById('selectedPrefix').innerText = t.selectedPrefix;
            document.getElementById('selectedSuffix').innerText = t.selectedSuffix;
            document.getElementById('splitText').innerText = t.split;
            document.getElementById('clearText').innerText = t.clear;
            document.getElementById('loadingText').innerText = t.loading;
            document.getElementById('errorText').innerText = t.error;
            document.getElementById('resultMessage').innerText = t.result;
            document.getElementById('downloadText').innerText = t.download;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('dropArea');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const filePageCount = document.getElementById('filePageCount');
        const pageList = document.getElementById('pageList');
        const pageItems = document.getElementById('pageItems');

        const resultBox = document.getElementById('resultBox');

        const downloadBtn = document.getElementById('downloadBtn');

        const selectOddBtn = document.getElementById('selectOddBtn');

        let pageData = [];
        let splitPdfData = null;
        let originalFileName = '';

        function formatSize(bytes) {
            const t = texts[lang];
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function renderPageList() {
            if (pageData.length === 0) {
                pageList.classList.remove('show');
                return;
            }
            pageList.classList.add('show');

            let html = '';
            pageData.forEach((page, index) => {
                const checked = page.selected ? 'checked' : '';
                html += `
                    <div class="page-item">
                        <input type="checkbox" data-index="${index}" ${checked} />
                        <span class="page-label">第 ${index + 1} 頁</span>
                        <span class="page-index">#${index + 1}</span>
                    </div>
                `;
            });
            pageItems.innerHTML = html;

            document.querySelectorAll('.page-item input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    const idx = parseInt(this.dataset.index);
                    pageData[idx].selected = this.checked;
                    updateSelectedCount();
                });
            });

            updateSelectedCount();
        }

        function updateSelectedCount() {
            const count = pageData.filter(p => p.selected).length;
            selectedCount.innerText = count;
        }

        function resetResult() {
            resultBox.classList.remove('show');
            splitPdfData = null;
        }

        async function handleFile(file) {
            if (!file || !(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
                const t = texts[lang];
                alert('請上傳 PDF 檔案');
                return;
            }

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                const pageCount = pdf.getPageCount();

                currentFile = file;
                originalFileName = file.name.replace(/\.[^.]+$/, '');
                pageData = Array.from({ length: pageCount }, (_, i) => ({
                    selected: true
                }));

                fileInfo.classList.add('show');
                fileName.innerText = file.name;
                fileSize.innerText = formatSize(file.size);
                const t = texts[lang];
                filePageCount.innerText = `${pageCount} ${t.page}`;

                renderPageList();
                resetResult();

            } catch (e) {
                console.error('讀取 PDF 失敗:', e);
                alert('無法讀取此 PDF 檔案，可能已損壞。');
            }
        }

        dropArea.addEventListener('click', () => fileInput.click());
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
                fileInput.value = '';
            }
        });

        selectAllBtn.addEventListener('click', () => {
            pageData.forEach(p => p.selected = true);
            renderPageList();
            resetResult();
        });

        deselectAllBtn.addEventListener('click', () => {
            pageData.forEach(p => p.selected = false);
            renderPageList();
            resetResult();
        });

        selectOddBtn.addEventListener('click', () => {
            pageData.forEach((p, i) => p.selected = (i % 2 === 0));
            renderPageList();
            resetResult();
        });

        selectEvenBtn.addEventListener('click', () => {
            pageData.forEach((p, i) => p.selected = (i % 2 === 1));
            renderPageList();
            resetResult();
        });

        clearBtn.addEventListener('click', () => {
            currentFile = null;
            pageData = [];
            fileInfo.classList.remove('show');
            renderPageList();
            resetResult();
        });

        splitBtn.addEventListener('click', async () => {
            const t = texts[lang];
            const selected = pageData.filter(p => p.selected);
            if (selected.length === 0) {
                alert(t.selectAtLeast);
                return;
            }

            if (selected.length === pageData.length) {
                alert(t.allSelected);
                return;
            }

            splitBtn.disabled = true;
            loading.classList.add('show');
            error.classList.remove('show');
            resultBox.classList.remove('show');

            try {
                const { PDFDocument } = PDFLib;
                const arrayBuffer = await currentFile.arrayBuffer();
                const sourcePdf = await PDFDocument.load(arrayBuffer);
                const newPdf = await PDFDocument.create();

                const indices = [];
                pageData.forEach((p, i) => {
                    if (p.selected) indices.push(i);
                });

                for (const idx of indices) {
                    const [copiedPage] = await newPdf.copyPages(sourcePdf, [idx]);
                    newPdf.addPage(copiedPage);
                }

                const bytes = await newPdf.save();
                splitPdfData = bytes;

                const sizeInMB = (bytes.length / (1024 * 1024)).toFixed(2);
                resultSize.innerText = `${t.fileSize}${sizeInMB} MB（${bytes.length.toLocaleString()} ${t.bytes}）· ${indices.length} ${t.page}`;
                resultBox.classList.add('show');

            } catch (err) {
                const t = texts[lang];
                error.innerText = '❌ ' + (err.message || t.error);
                error.classList.add('show');
            }

            loading.classList.remove('show');
            splitBtn.disabled = false;
        });

        downloadBtn.addEventListener('click', () => {
            if (!splitPdfData) return;
            const blob = new Blob([splitPdfData], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${originalFileName}_extracted.pdf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        renderPageList();
    </script>
</body>
</html>

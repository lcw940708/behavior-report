    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '📏 單位換算器',
                sub: '即時轉換長度、重量、容量、溫度，支援批量輸入',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時轉換',
                badge3: '📋 批量處理',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                tabLength: '📐 長度',
                tabWeight: '⚖️ 重量',
                tabVolume: '🧪 容量',
                tabTemp: '🌡️ 溫度',
                batchLabel: '📋 批量轉換（每行一個數值）',
                convert: '🔄 轉換',
                copy: '📋 複製結果',
                clear: '🗑️ 清空',
                empty: '等待輸入...',
                copied: '✅ 已複製！'
            },
            tw: {
                title: '📏 單位換算器',
                sub: '即時轉換長度、重量、容量、溫度，支援批量輸入',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時轉換',
                badge3: '📋 批量處理',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                tabLength: '📐 長度',
                tabWeight: '⚖️ 重量',
                tabVolume: '🧪 容量',
                tabTemp: '🌡️ 溫度',
                batchLabel: '📋 批量轉換（每行一個數值）',
                convert: '🔄 轉換',
                copy: '📋 複製結果',
                clear: '🗑️ 清空',
                empty: '等待輸入...',
                copied: '✅ 已複製！'
            },
            en: {
                title: '📏 Unit Converter',
                sub: 'Instant conversion for length, weight, volume, temperature, batch input support',
                badge1: '🔒 Privacy Safe',
                badge2: '⚡ Instant Convert',
                badge3: '📋 Batch Processing',
                badge4: '🆓 Free',
                storyLabel: '📖 You might also like',
                tabLength: '📐 Length',
                tabWeight: '⚖️ Weight',
                tabVolume: '🧪 Volume',
                tabTemp: '🌡️ Temperature',
                batchLabel: '📋 Batch Convert (one value per line)',
                convert: '🔄 Convert',
                copy: '📋 Copy Results',
                clear: '🗑️ Clear',
                empty: 'Waiting for input...',
                copied: '✅ Copied!'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('tabLength').innerHTML = t.tabLength;
            document.getElementById('tabWeight').innerHTML = t.tabWeight;
            document.getElementById('tabVolume').innerHTML = t.tabVolume;
            document.getElementById('tabTemp').innerHTML = t.tabTemp;

            document.querySelectorAll('.batch-section .label').forEach(el => {
                el.innerText = t.batchLabel;
            });

            document.querySelectorAll('.btn-cyan').forEach(el => {
                el.innerHTML = t.convert;
            });
            document.querySelectorAll('.btn-outline').forEach(el => {
                if (el.textContent.includes('複製') || el.textContent.includes('Copy')) {
                    el.innerHTML = t.copy;
                }
                if (el.textContent.includes('清空') || el.textContent.includes('Clear')) {
                    el.innerHTML = t.clear;
                }
            });

            document.querySelectorAll('.batch-result .empty').forEach(el => {
                el.textContent = t.empty;
            });

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // Tab 切換
        // =============================================================
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.converter-panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('panel-' + this.dataset.cat).classList.add('active');
            });
        });

        // =============================================================
        // 換算器工廠
        // =============================================================
        function createConverter(config) {
            const input = document.getElementById(config.inputId);
            const fromSelect = document.getElementById(config.fromId);
            const toSelect = document.getElementById(config.toId);
            const resultDisplay = document.getElementById(config.resultId);
            const batchTextarea = document.getElementById(config.batchId);
            const batchResult = document.getElementById(config.batchResultId);
            const batchBtn = document.getElementById(config.batchBtnId);
            const copyBtn = document.getElementById(config.copyBtnId);
            const clearBtn = document.getElementById(config.clearBtnId);

            function convertSingle(value, fromUnit, toUnit) {
                const inBase = config.toBase(value, fromUnit);
                return config.fromBase(inBase, toUnit);
            }

            function updateSingle() {
                const val = parseFloat(input.value);
                if (isNaN(val)) {
                    resultDisplay.textContent = '—';
                    return;
                }
                const from = fromSelect.value;
                const to = toSelect.value;
                const result = convertSingle(val, from, to);
                const label = config.unitLabels[to] || '';
                resultDisplay.textContent = result.toFixed(4).replace(/\.?0+$/, '') + ' ' + label;
            }

            function updateBatch() {
                const text = batchTextarea.value;
                const lines = text.split('\n').filter(l => l.trim() !== '');
                const t = texts[lang];
                if (lines.length === 0) {
                    batchResult.innerHTML = '<span class="empty">' + t.empty + '</span>';
                    return;
                }
                const from = fromSelect.value;
                const to = toSelect.value;
                const label = config.unitLabels[to] || '';
                const results = lines.map(line => {
                    const val = parseFloat(line.trim());
                    if (isNaN(val)) return '❌ ' + (lang === 'en' ? 'Invalid value' : '無效數值');
                    const result = convertSingle(val, from, to);
                    return result.toFixed(4).replace(/\.?0+$/, '') + ' ' + label;
                });
                batchResult.textContent = results.join('\n');
            }

            input.addEventListener('input', updateSingle);
            fromSelect.addEventListener('change', updateSingle);
            toSelect.addEventListener('change', updateSingle);
            batchBtn.addEventListener('click', updateBatch);

            copyBtn.addEventListener('click', function() {
                const text = batchResult.textContent;
                const t = texts[lang];
                if (!text || text.includes(t.empty)) return;
                navigator.clipboard.writeText(text).then(() => {
                    const orig = this.textContent;
                    this.textContent = t.copied;
                    setTimeout(() => { this.textContent = orig; }, 2000);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    const orig = this.textContent;
                    this.textContent = t.copied;
                    setTimeout(() => { this.textContent = orig; }, 2000);
                });
            });

            clearBtn.addEventListener('click', function() {
                batchTextarea.value = '';
                const t = texts[lang];
                batchResult.innerHTML = '<span class="empty">' + t.empty + '</span>';
            });

            updateSingle();
            return { updateSingle, updateBatch };
        }

        // =============================================================
        // 長度
        // =============================================================
        const lengthUnits = { meter: 1, kilometer: 1000, centimeter: 0.01, millimeter: 0.001, mile: 1609.344, yard: 0.9144,
            foot: 0.3048, inch: 0.0254 };
        createConverter({
            inputId: 'length-input',
            fromId: 'length-from',
            toId: 'length-to',
            resultId: 'length-result',
            batchId: 'length-batch',
            batchResultId: 'length-batch-result',
            batchBtnId: 'length-batch-btn',
            copyBtnId: 'length-copy-btn',
            clearBtnId: 'length-clear-btn',
            unitLabels: { meter: 'm', kilometer: 'km', centimeter: 'cm', millimeter: 'mm', mile: 'mi', yard: 'yd',
                foot: 'ft', inch: 'in' },
            toBase: (val, unit) => val * lengthUnits[unit],
            fromBase: (val, unit) => val / lengthUnits[unit]
        });

        // =============================================================
        // 重量
        // =============================================================
        const weightUnits = { kilogram: 1, gram: 0.001, milligram: 0.000001, tonne: 1000, pound: 0.453592, ounce: 0.0283495 };
        createConverter({
            inputId: 'weight-input',
            fromId: 'weight-from',
            toId: 'weight-to',
            resultId: 'weight-result',
            batchId: 'weight-batch',
            batchResultId: 'weight-batch-result',
            batchBtnId: 'weight-batch-btn',
            copyBtnId: 'weight-copy-btn',
            clearBtnId: 'weight-clear-btn',
            unitLabels: { kilogram: 'kg', gram: 'g', milligram: 'mg', tonne: 't', pound: 'lb', ounce: 'oz' },
            toBase: (val, unit) => val * weightUnits[unit],
            fromBase: (val, unit) => val / weightUnits[unit]
        });

        // =============================================================
        // 容量
        // =============================================================
        const volumeUnits = { liter: 1, milliliter: 0.001, gallon: 3.78541, quart: 0.946353, pint: 0.473176, cup: 0.236588 };
        createConverter({
            inputId: 'volume-input',
            fromId: 'volume-from',
            toId: 'volume-to',
            resultId: 'volume-result',
            batchId: 'volume-batch',
            batchResultId: 'volume-batch-result',
            batchBtnId: 'volume-batch-btn',
            copyBtnId: 'volume-copy-btn',
            clearBtnId: 'volume-clear-btn',
            unitLabels: { liter: 'L', milliliter: 'mL', gallon: 'gal', quart: 'qt', pint: 'pt', cup: 'cup' },
            toBase: (val, unit) => val * volumeUnits[unit],
            fromBase: (val, unit) => val / volumeUnits[unit]
        });

        // =============================================================
        // 溫度
        // =============================================================
        createConverter({
            inputId: 'temp-input',
            fromId: 'temp-from',
            toId: 'temp-to',
            resultId: 'temp-result',
            batchId: 'temp-batch',
            batchResultId: 'temp-batch-result',
            batchBtnId: 'temp-batch-btn',
            copyBtnId: 'temp-copy-btn',
            clearBtnId: 'temp-clear-btn',
            unitLabels: { celsius: '°C', fahrenheit: '°F', kelvin: 'K' },
            toBase: (val, unit) => {
                if (unit === 'celsius') return val;
                if (unit === 'fahrenheit') return (val - 32) * 5 / 9;
                if (unit === 'kelvin') return val - 273.15;
                return val;
            },
            fromBase: (val, unit) => {
                if (unit === 'celsius') return val;
                if (unit === 'fahrenheit') return val * 9 / 5 + 32;
                if (unit === 'kelvin') return val + 273.15;
                return val;
            }
        });
    </script>
</body>
</html>

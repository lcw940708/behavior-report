        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --text-light: #cbd5e1;
            --cyan: #22d3ee;
            --cyan-hover: #67e8f9;
            --border: #24324f;
            --red: #ef4444;
            --green: #10b981;
            --yellow: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 780px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }

        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 8px;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .lang-switch a:hover, .lang-switch a.active {
            opacity: 1;
            text-decoration: underline;
            font-weight: bold;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
        }
        .tool-title .emoji {
            font-size: 1.8rem;
        }

        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        /* ===== 輸入區 ===== */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-row .field {
            flex: 1;
            min-width: 120px;
        }

        .input-row .field label {
            display: block;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .input-row .field input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-row .field input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08);
        }

        .input-row .field input[type="datetime-local"] {
            color-scheme: dark;
        }

        .preset-section {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .preset-btn {
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .preset-btn.active {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.08);
        }

        /* ===== 按鈕 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--cyan-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        /* ===== 倒數顯示 ===== */
        .countdown-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
            padding: 20px;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .countdown-unit .number {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .countdown-unit .number.ended {
            color: var(--red);
        }

        .countdown-unit .label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .countdown-status {
            text-align: center;
            font-size: 1rem;
            color: var(--text-light);
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(148, 163, 184, 0.06);
        }

        .countdown-status .event-name {
            color: var(--cyan);
            font-weight: bold;
        }

        .countdown-status .ended-text {
            color: var(--red);
            font-weight: bold;
        }

        /* ===== 分享區 ===== */
        .share-section {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
        }

        .share-section.show {
            display: block;
        }

        .share-section .share-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .share-section .share-row input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-light);
            font-size: 0.85rem;
            outline: none;
            min-width: 100px;
        }

        .share-section .share-row input:focus {
            border-color: var(--cyan);
        }

        .share-section .share-row button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--cyan);
            color: #0b0f19;
            white-space: nowrap;
        }

        .share-section .share-row button:hover {
            background: var(--cyan-hover);
        }

            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-light);
            text-decoration: none;

        }

        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);

        .other-tools {

            }

        const secondsEl = document.getElementById('seconds');
        const shareSection = document.getElementById('shareSection');
        const shareLink = document.getElementById('shareLink');

        let countdownInterval = null;
        let targetTime = null;
        let eventNameValue = '';

        // =============================================================
        // 語言切換主邏輯
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            // 更新 Document SEO
            document.documentElement.lang = t.langAttr;
            document.getElementById('seoTitle').innerText = t.pageTitle;
            document.getElementById('seoDesc').setAttribute('content', t.pageDesc);

            // 更新 Switcher 樣式
            document.querySelectorAll('.lang-switch a').forEach(a => a.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-lang-${l}`);
            if (activeBtn) activeBtn.classList.add('active');

            // UI 文字切換
            toolTitle.innerHTML = t.title;
            toolSub.innerText = t.sub;
            badge1.innerText = t.badge1;
            badge2.innerText = t.badge2;
            badge3.innerText = t.badge3;
            badge4.innerText = t.badge4;
            storyLabel.innerText = t.storyLabel;
            otherToolsLabel.innerText = t.otherTools;
            labelEvent.innerText = t.labelEvent;
            eventName.placeholder = t.eventPlaceholder;
            labelDate.innerText = t.labelDate;
            presetLabel.innerText = t.presetLabel;
            
            preset7.innerText = t.preset7;
            preset14.innerText = t.preset14;
            preset30.innerText = t.preset30;
            preset90.innerText = t.preset90;
            preset365.innerText = t.preset365;

            startText.innerText = t.start.replace('▶️ ', '');
            resetText.innerText = t.reset.replace('↩️ ', '');
            labelDays.innerText = t.labelDays;
            labelHours.innerText = t.labelHours;
            labelMinutes.innerText = t.labelMinutes;
            labelSeconds.innerText = t.labelSeconds;
            copyLinkBtn.innerText = t.copy;

            document.getElementById('footHome').innerText = t.home;
            document.getElementById('footAbout').innerText = t.about;
            document.getElementById('footPrivacy').innerText = t.privacy;

            // 調整內部超連結語系參數
            document.querySelectorAll('.story-suggest .items a, .other-tools a').forEach(a => {
                try {
                    const url = new URL(a.href, window.location.origin);
                    url.searchParams.set('lang', l);
                    a.href = url.pathname + url.search;
                } catch (e) {}
            });

            updateStatus();
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            const urlLang = params.get('lang');
            if (['en', 'tw', 'hk'].includes(urlLang)) return urlLang;
            
            const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('tw') || userLang.includes('hant')) return 'tw';
            return 'hk';
        }

        // =============================================================
        // 日期計算與預設快捷
        // =============================================================
        function setDefaultDate(daysToAdd = 30) {
            const now = new Date();
            const target = new Date(now.getTime() + daysToAdd * 24 * 60 * 60 * 1000);
            const year = target.getFullYear();
            const month = String(target.getMonth() + 1).padStart(2, '0');
            const day = String(target.getDate()).padStart(2, '0');
            const hours = String(target.getHours()).padStart(2, '0');
            const minutes = String(target.getMinutes()).padStart(2, '0');
            targetDate.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const days = parseInt(this.dataset.days);
                setDefaultDate(days);

                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                if (countdownInterval || targetTime) {
                    startCountdown();
                }
            });
        });

        // =============================================================
        // 倒數核心邏輯 (修復 Timer 誤動作及 DOM Bug)
        // =============================================================
        function startCountdown() {
            const t = texts[lang];
            const dateVal = targetDate.value;
            eventNameValue = eventName.value.trim() || t.noEvent;

            if (!dateVal) {
                alert(t.invalidDate);
                return;
            }

            targetTime = new Date(dateVal).getTime();

            if (isNaN(targetTime)) {
                alert(t.invalidDate);
                return;
            }

            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            updateDisplay();
            countdownInterval = setInterval(updateDisplay, 250);

            // 更新分享連結 URL
            shareSection.classList.add('show');
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            url.searchParams.set('event', eventNameValue);
            url.searchParams.set('date', dateVal);
            shareLink.value = url.toString();

            updateStatus();
        }

        function updateDisplay() {
            const now = Date.now();
            const diff = targetTime - now;

            if (diff <= 0) {
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                
                [daysEl, hoursEl, minutesEl, secondsEl].forEach(el => el.classList.add('ended'));
                
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                updateStatus();
                return;
            }

            [daysEl, hoursEl, minutesEl, secondsEl].forEach(el => el.classList.remove('ended'));

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');

            updateStatus();
        }

        function updateStatus() {
            const t = texts[lang];
            const name = escapeHtml(eventNameValue || t.noEvent);

            if (!targetTime) {
                statusText.innerHTML = t.statusWaiting;
                return;
            }

            if (targetTime - Date.now() <= 0) {
                statusText.innerHTML = t.statusEnded.replace('{event}', name);
            } else {
                statusText.innerHTML = t.statusCounting.replace('{event}', name);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // =============================================================
        // 重設邏輯
        // =============================================================
        function resetCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            targetTime = null;
            daysEl.textContent = '00';
            hoursEl.textContent = '00';
            minutesEl.textContent = '00';
            secondsEl.textContent = '00';
            [daysEl, hoursEl, minutesEl, secondsEl].forEach(el => el.classList.remove('ended'));
            
            shareSection.classList.remove('show');
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            
            statusText.innerHTML = texts[lang].statusWaiting;
        }

        // =============================================================
        // 複製連結
        // =============================================================
        function copyLink() {
            const t = texts[lang];
            const text = shareLink.value;
            if (!text) return;

            const updateBtnText = () => {
                const original = copyLinkBtn.innerText;
                copyLinkBtn.innerText = t.copied;
                setTimeout(() => { copyLinkBtn.innerText = original; }, 2000);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(updateBtnText).catch(() => {
                    shareLink.select();
                    document.execCommand('copy');
                    updateBtnText();
                });
            } else {
                shareLink.select();
                document.execCommand('copy');
                updateBtnText();
            }
        }

        // =============================================================
        // 事件監聽與初始化
        // =============================================================
        startBtn.addEventListener('click', startCountdown);
        resetBtn.addEventListener('click', resetCountdown);
        copyLinkBtn.addEventListener('click', copyLink);

        eventName.addEventListener('keydown', (e) => { if (e.key === 'Enter') startCountdown(); });
        targetDate.addEventListener('keydown', (e) => { if (e.key === 'Enter') startCountdown(); });

        // 初始化
        const currentLang = detectLanguage();
        switchLang(currentLang);
        setDefaultDate(30);

        // 解析 URL 參數自動執行倒數
        const params = new URLSearchParams(window.location.search);
        if (params.get('date')) {
            const dateParam = params.get('date');
            const eventParam = params.get('event');
            
            if (eventParam) {
                eventName.value = decodeURIComponent(eventParam);
            }
            targetDate.value = dateParam;
            startCountdown();
        }
    </script>
</body>
</html>

            --card: #151d30;
            --text: #94a3b8;
            --text-light: #cbd5e1;
            --cyan: #22d3ee;
            --cyan-hover: #67e8f9;
            --border: #24324f;
            --red: #ef4444;
            --yellow: #fbbf24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover { text-decoration: underline; }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .settings {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 0 0 16px;
            justify-content: center;
        }
        .settings .field {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings .field label {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .settings .field select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-light);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }
        .settings .field select:focus { border-color: var(--cyan); }
        .settings .field select option { background: var(--card); }

        .best-record {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 16px;
            padding: 8px 14px;
            background: rgba(34, 211, 238, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(34, 211, 238, 0.08);
        }
        .best-record .highlight {
            color: var(--cyan);
            font-weight: bold;
        }

        .test-area {
            background: var(--bg);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            border: 2px dashed var(--border);
            transition: all 0.3s;
            user-select: none;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .test-area.active {
            border-color: var(--cyan);
            border-style: solid;
            background: rgba(34, 211, 238, 0.03);
            cursor: pointer;
        }
        .test-area.waiting {
            border-color: var(--border);
            border-style: dashed;
            cursor: default;
        }
        .timer-display {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 0.9rem;
            color: var(--text-light);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: none;
        }
        .timer-display.show { display: block; }
        .timer-display .time-remaining {
            color: var(--yellow);
            font-weight: bold;
            font-family: monospace;
            font-size: 1.1rem;
        }
        .timer-display .time-remaining.warning {
            color: var(--red);
            animation: pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .click-count {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            line-height: 1.1;
        }
        .status-text {
            font-size: 1rem;
            color: var(--text);
            margin-top: 12px;
        }
        .status-text .highlight { color: var(--cyan); font-weight: bold; }
        .click-hint {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 10px;
        }

        .result-display { display: none; }
        .result-display.show { display: block; }
        .result-display .final-score {
            font-size: 3.2rem;
            font-weight: bold;
            color: #fff;
            line-height: 1.1;
        }
        .result-display .final-cps {
            font-size: 1.15rem;
            color: var(--cyan);
            margin-top: 6px;
        }
        .result-display .rank {
            font-size: 1.4rem;
            margin-top: 12px;
            padding: 6px 22px;
            border-radius: 20px;
            display: inline-block;
        }
        .result-display .rank.S { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.2); }
        .result-display .rank.A { background: rgba(251, 191, 36, 0.15); color: var(--yellow); border: 1px solid rgba(251, 191, 36, 0.25); }
        .result-display .rank.B { background: rgba(34, 211, 238, 0.15); color: var(--cyan); border: 1px solid rgba(34, 211, 238, 0.25); }
        .result-display .rank.C { background: rgba(148, 163, 184, 0.15); color: var(--text); border: 1px solid rgba(148, 163, 184, 0.2); }
        .result-display .rank.D { background: rgba(100, 116, 139, 0.12); color: #64748b; border: 1px solid rgba(100, 116, 139, 0.2); }
        .result-display .rank-desc {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .new-record {
            margin-top: 10px;
            font-size: 0.95rem;
            color: var(--yellow);
            font-weight: bold;
            display: none;
        }
        .new-record.show { display: block; }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--cyan-hover);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);

        .story-suggest .items {

            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-light);

        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover { color: #888; }

        @media (max-width: 600px) {
            .container { padding: 18px; }
            .test-area { min-height: 180px; padding: 24px 16px; }
            .click-count { font-size: 3rem; }
            .result-display .final-score { font-size: 2.4rem; }
            .settings { flex-direction: column; align-items: center; }
            .btn { flex: none; width: 100%; }
            .timer-display { top: 8px; right: 10px; font-size: 0.8rem; }
        }
    </style>
</head>

                ]
            }
        };

        let lang = 'hk';
        let isRunning = false;
        let isFinished = false;
        let clickCount = 0;
        let timer = null;
        let testDuration = 10;

        const STORAGE_KEY = 'abrg_click_best';

        function getBest() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : { clicks: 0, cps: 0 };
            } catch (e) {
                return { clicks: 0, cps: 0 };
            }
        }

        function saveBest(clicks, cps) {
            const best = getBest();
            let isNew = false;
            if (clicks > best.clicks) {
                best.clicks = clicks;
                isNew = true;
            }
            if (cps > best.cps) {
                best.cps = cps;
                isNew = true;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(best));
            return isNew;
        }

        function updateBestDisplay() {
            const best = getBest();
            document.getElementById('bestClicks').textContent = best.clicks > 0 ? best.clicks : '—';
            document.getElementById('bestCps').textContent = best.cps > 0 ? best.cps.toFixed(1) : '—';
        }

        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('labelDuration').innerText = t.labelDuration;
            document.getElementById('labelButton').innerText = t.labelButton;
            document.getElementById('bestLabel').innerText = t.bestLabel;
            document.getElementById('statusText').innerHTML = t.statusIdle;
            document.getElementById('clickHint').innerText = t.clickHint;
            document.getElementById('startBtn').innerHTML = t.start;
            document.getElementById('resetBtn').innerHTML = t.reset;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('newRecord').innerText = t.newRecord;

            const timeSelect = document.getElementById('timeSelect');
            timeSelect.querySelectorAll('option').forEach(opt => {
                opt.textContent = opt.value + (l === 'en' ? ' sec' : ' 秒');
            });

            const buttonSelect = document.getElementById('buttonSelect');
            buttonSelect.options[0].textContent = t.optLeft;
            buttonSelect.options[1].textContent = t.optRight;
            buttonSelect.options[2].textContent = t.optAny;
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage || '';
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
            return 'hk';
        }

        switchLang(detectLanguage());
        updateBestDisplay();

        const testArea = document.getElementById('testArea');
        const clickDisplay = document.getElementById('clickDisplay');
        const finalScore = document.getElementById('finalScore');
        const finalCps = document.getElementById('finalCps');
        const rankDisplay = document.getElementById('rankDisplay');
        const rankDescription = document.getElementById('rankDescription');
        const idleState = document.getElementById('idleState');
        const resultState = document.getElementById('resultState');
        const timerDisplay = document.getElementById('timerDisplay');
        const timeRemaining = document.getElementById('timeRemaining');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timeSelect = document.getElementById('timeSelect');
        const buttonSelect = document.getElementById('buttonSelect');
        const newRecordEl = document.getElementById('newRecord');

        function getRank(cps) {
            const ranks = texts[lang].ranks;
            for (const r of ranks) {
                if (cps >= r.min) return r;
            }
            return ranks[ranks.length - 1];
        }

        function showIdle() {
            idleState.style.display = 'block';
            resultState.classList.remove('show');
            timerDisplay.classList.remove('show');
            testArea.className = 'test-area waiting';
            clickDisplay.textContent = '0';
            newRecordEl.classList.remove('show');
        }

        function showResult() {
            idleState.style.display = 'none';
            resultState.classList.add('show');
            timerDisplay.classList.remove('show');
            testArea.className = 'test-area waiting';
        }

        function showActive() {
            idleState.style.display = 'block';
            resultState.classList.remove('show');
            timerDisplay.classList.add('show');
            testArea.className = 'test-area active';
            newRecordEl.classList.remove('show');
        }

        function updateTimer(seconds) {
            const remaining = Math.max(0, Math.ceil(seconds));
            timeRemaining.textContent = remaining;
            timeRemaining.className = 'time-remaining' + (remaining <= 3 ? ' warning' : '');
        }

        function startTest() {
            if (isRunning) return;

            clickCount = 0;
            testDuration = parseInt(timeSelect.value);
            isRunning = true;
            isFinished = false;

            showActive();
            updateTimer(testDuration);
            clickDisplay.textContent = '0';
            startBtn.disabled = true;
            timeSelect.disabled = true;
            buttonSelect.disabled = true;

            let elapsed = 0;
            const interval = 50;

            timer = setInterval(() => {
                elapsed += interval;
                const remaining = Math.max(0, testDuration - elapsed / 1000);
                updateTimer(remaining);
                clickDisplay.textContent = clickCount;

                if (elapsed >= testDuration * 1000) {
                    clearInterval(timer);
                    isRunning = false;
                    isFinished = true;

                    const cps = clickCount / testDuration;
                    const rank = getRank(cps);

                    finalScore.textContent = clickCount;
                    finalCps.textContent = cps.toFixed(1);
                    rankDisplay.textContent = rank.rank;
                    rankDisplay.className = 'rank ' + rank.color;
                    rankDescription.textContent = rank.desc;

                    const isNew = saveBest(clickCount, cps);
                    updateBestDisplay();
                    if (isNew) {
                        newRecordEl.classList.add('show');
                    }

                    showResult();
                    startBtn.disabled = false;
                    timeSelect.disabled = false;
                    buttonSelect.disabled = false;
                }
            }, interval);
        }

        function resetTest() {
            clearInterval(timer);
            isRunning = false;
            isFinished = false;
            clickCount = 0;
            showIdle();
            updateTimer(parseInt(timeSelect.value) || 10);
            startBtn.disabled = false;
            timeSelect.disabled = false;
            buttonSelect.disabled = false;
        }

        function handleClick(e) {
            if (!isRunning || isFinished) return;

            const mode = buttonSelect.value;
            // e.button 說明: 0 = 左鍵, 2 = 右鍵
            if (mode === 'left' && e.button !== 0) return;
            if (mode === 'right' && e.button !== 2) return;

            clickCount++;
            clickDisplay.textContent = clickCount;
        }

        testArea.addEventListener('mousedown', handleClick);
        // 阻止測試區域跳出右鍵菜單
        testArea.addEventListener('contextmenu', e => e.preventDefault());

        startBtn.addEventListener('click', startTest);
        resetBtn.addEventListener('click', resetTest);

        showIdle();
        updateTimer(10);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>免費 URL 編解碼器 — 網址編碼／解碼工具｜Free URL Encoder/Decoder｜ABRG 免費工具</title>
    <meta name="description" content="免費線上 URL 編解碼器，將文字編碼成 URL-safe 格式，或將編碼還原。Free online URL encoder/decoder, 100% client-side, privacy safe." />
    <link rel="canonical" href="https://www.behavior-report.com/tools/url-encoder.html" />
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --cyan: #22d3ee;
            --green: #10b981;
            --red: #ef4444;
            --border: #24324f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .direction-toggle {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid rgba(148, 163, 184, 0.06);
        }
        .dir-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .dir-btn:hover {
            color: #cbd5e1;
        }
        .dir-btn.active {
            background: var(--cyan);
            color: #0b0f19;
        }

        .mode-toggle {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid rgba(148, 163, 184, 0.06);
        }
        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .mode-btn:hover {
            color: #cbd5e1;
        }
        .mode-btn.active {
            background: var(--cyan);
            color: #0b0f19;
        }

        .editor-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .editor-area textarea {
            width: 100%;
            height: 180px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: var(--bg);
            color: #e2e8f0;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.2s;
        }
        .editor-area textarea:focus {
            outline: none;
            border-color: var(--cyan);
        }
        .editor-area textarea::placeholder {
            color: #475569;
        }

        .result-area {
            margin-top: 12px;
        }
        .result-area .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .result-box {
            background: var(--bg);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid rgba(148, 163, 184, 0.06);
            min-height: 60px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            color: #e2e8f0;
            max-height: 200px;
            overflow-y: auto;
        }
        .result-box .empty {
            color: #475569;
        }
        .result-box .error-text {
            color: var(--red);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-cyan {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-cyan:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
        }
        .btn-outline:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--green);
            color: var(--green);
        }
        .btn-success:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.04);
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 10px;
        }
        .info-bar .count {
            color: var(--cyan);
        }

        .other-tools {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .other-tools a {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #fca5a5;
            text-decoration: none;
            transition: all 0.2s;
        }
        .other-tools a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        .story-suggest {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .story-suggest .items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .story-suggest .items a {
            background: rgba(36, 50, 79, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.2s;
        }
        .story-suggest .items a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #555;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
            .toolbar .btn {
                font-size: 0.8rem;
                padding: 8px 14px;
            }
            .editor-area textarea {
                height: 120px;
            }
            .mode-toggle {
                flex-wrap: wrap;
            }
            .mode-btn {
                flex: 1 1 45%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <a onclick="switchLang('hk')">🇭🇰 港版</a> |
            <a onclick="switchLang('tw')">🇹🇼 台版</a> |
            <a onclick="switchLang('en')">🇬🇧 English</a>
        </div>

        <h1 class="tool-title" id="toolTitle">🔗 URL 編解碼器</h1>
        <p class="tool-sub" id="toolSub">將文字編碼成 URL-safe 格式，或將編碼還原</p>
        <div class="badge-row">
            <span class="badge" id="badge1">🔒 私隱安全</span>
            <span class="badge" id="badge2">⚡ 即時轉換</span>
            <span class="badge" id="badge3">🆓 完全免費</span>
        </div>

        <div class="direction-toggle">
            <button class="dir-btn active" data-dir="encode" id="dirEncode">🔼 編碼</button>
            <button class="dir-btn" data-dir="decode" id="dirDecode">🔽 解碼</button>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="standard" id="modeStandard">標準 encodeURI</button>
            <button class="mode-btn" data-mode="component" id="modeComponent">Component encodeURIComponent</button>
        </div>

        <div class="editor-area">
            <textarea id="inputText" placeholder="輸入要編碼或解碼嘅文字..."></textarea>

            <div class="toolbar">
                <button class="btn btn-cyan" id="convertBtn">🔄 轉換</button>
                <button class="btn btn-outline" id="swapBtn">⇄ 交換</button>
                <button class="btn btn-danger" id="clearBtn">🗑️ 清空</button>
                <button class="btn btn-success" id="copyBtn">📋 複製</button>
            </div>
        </div>

        <div class="result-area">
            <div class="label" id="resultLabel">📄 結果</div>
            <div class="result-box" id="resultBox"><span class="empty">等待輸入...</span></div>
            <div class="info-bar">
                <span id="charInfo">字元數：<span class="count" id="charCount">0</span></span>
                <span id="statusText">就緒</span>
            </div>
        </div>

        <div class="story-suggest">
            <div class="label" id="storyLabel">📖 你可能會中意嘅連載或測驗</div>
            <div class="items">
                <a href="../story_01.html">《你睡著以後》</a>
                <a href="../story_02.html">《貓狗人格》</a>
                <a href="../quiz-01.html">隱私天平</a>
                <a href="../index.html">🏠 返回主頁</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="../index.html">主頁</a> |
        <a href="../about.html">關於我</a> |
        <a href="../privacy.html">隱私權政策</a>
    </footer>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🔗 URL 編解碼器',
                sub: '將文字編碼成 URL-safe 格式，或將編碼還原',
                placeholder: '輸入要編碼或解碼嘅文字...',
                resultLabel: '📄 結果',
                charInfo: '字元數：',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時轉換',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                dirEncode: '🔼 編碼',
                dirDecode: '🔽 解碼',
                modeStandard: '標準 encodeURI',
                modeComponent: 'Component encodeURIComponent',
                convert: '🔄 轉換',
                swap: '⇄ 交換',
                clear: '🗑️ 清空',
                copy: '📋 複製',
                waiting: '等待輸入...',
                statusReady: '就緒',
                success: '成功',
                error: '轉換失敗',
                invalid: '無效輸入',
                copied: '✅ 已複製！'
            },
            tw: {
                title: '🔗 URL 編解碼器',
                sub: '將文字編碼成 URL-safe 格式，或將編碼還原',
                placeholder: '輸入要編碼或解碼的文字...',
                resultLabel: '📄 結果',
                charInfo: '字元數：',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時轉換',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                dirEncode: '🔼 編碼',
                dirDecode: '🔽 解碼',
                modeStandard: '標準 encodeURI',
                modeComponent: 'Component encodeURIComponent',
                convert: '🔄 轉換',
                swap: '⇄ 交換',
                clear: '🗑️ 清空',
                copy: '📋 複製',
                waiting: '等待輸入...',
                statusReady: '就緒',
                success: '成功',
                error: '轉換失敗',
                invalid: '無效輸入',
                copied: '✅ 已複製！'
            },
            en: {
                title: '🔗 URL Encoder/Decoder',
                sub: 'Encode text to URL-safe format, or decode it back',
                placeholder: 'Enter text to encode or decode...',
                resultLabel: '📄 Result',
                charInfo: 'Characters：',
                badge1: '🔒 Privacy Safe',
                badge2: '⚡ Instant Convert',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                dirEncode: '🔼 Encode',
                dirDecode: '🔽 Decode',
                modeStandard: 'Standard encodeURI',
                modeComponent: 'Component encodeURIComponent',
                convert: '🔄 Convert',
                swap: '⇄ Swap',
                clear: '🗑️ Clear',
                copy: '📋 Copy',
                waiting: 'Waiting for input...',
                statusReady: 'Ready',
                success: 'Success',
                error: 'Convert failed',
                invalid: 'Invalid input',
                copied: '✅ Copied!'
            }
        };

        let lang = 'hk';

        // =============================================================
        // DOM refs
        // =============================================================
        const inputText = document.getElementById('inputText');
        const resultBox = document.getElementById('resultBox');
        const charCount = document.getElementById('charCount');
        const statusText = document.getElementById('statusText');

        const convertBtn = document.getElementById('convertBtn');
        const swapBtn = document.getElementById('swapBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');

        const dirBtns = document.querySelectorAll('.dir-btn');
        const modeBtns = document.querySelectorAll('.mode-btn');

        let currentDir = 'encode';
        let currentMode = 'standard';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('inputText').placeholder = t.placeholder;
            document.getElementById('resultLabel').innerText = t.resultLabel;
            document.getElementById('charInfo').innerHTML = t.charInfo + '<span class="count" id="charCount">0</span>';
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('dirEncode').innerText = t.dirEncode;
            document.getElementById('dirDecode').innerText = t.dirDecode;
            document.getElementById('modeStandard').innerText = t.modeStandard;
            document.getElementById('modeComponent').innerText = t.modeComponent;
            document.getElementById('convertBtn').innerHTML = t.convert;
            document.getElementById('swapBtn').innerHTML = t.swap;
            document.getElementById('clearBtn').innerHTML = t.clear;
            document.getElementById('copyBtn').innerHTML = t.copy;

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });

            // Update char count element reference
            const newCharCount = document.getElementById('charCount');
            if (newCharCount) {
                // Re-bind charCount
                const oldCharCount = charCount;
                // We'll use the new one
            }
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 功能
        // =============================================================
        function getTexts() {
            return texts[lang];
        }

        dirBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                dirBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentDir = this.dataset.dir;
                updatePlaceholder();
                convert();
            });
        });

        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                updatePlaceholder();
                convert();
            });
        });

        function updatePlaceholder() {
            const t = getTexts();
            const dir = currentDir === 'encode' ? '編碼' : '解碼';
            const mode = currentMode === 'standard' ? '標準' : 'Component';
            inputText.placeholder = lang === 'en' ?
                (currentDir === 'encode' ? 'Enter text to encode...' : 'Enter text to decode...') :
                `輸入要${dir}嘅文字（${mode}模式）...`;
        }

        function convert() {
            const text = inputText.value;
            const t = getTexts();
            const charCountEl = document.getElementById('charCount');
            charCountEl.textContent = text.length;

            if (!text) {
                resultBox.innerHTML = `<span class="empty">${t.waiting}</span>`;
                statusText.textContent = t.statusReady;
                statusText.style.color = '';
                return;
            }

            try {
                let result = '';
                let method = '';

                if (currentDir === 'encode') {
                    if (currentMode === 'standard') {
                        result = encodeURI(text);
                        method = 'encodeURI';
                    } else {
                        result = encodeURIComponent(text);
                        method = 'encodeURIComponent';
                    }
                } else {
                    if (currentMode === 'standard') {
                        result = decodeURI(text);
                        method = 'decodeURI';
                    } else {
                        result = decodeURIComponent(text);
                        method = 'decodeURIComponent';
                    }
                }

                resultBox.textContent = result;
                statusText.textContent = `✅ ${t.success} (${method})`;
                statusText.style.color = 'var(--green)';

            } catch (e) {
                resultBox.innerHTML = `<span class="error-text">❌ ${t.error}：${e.message}</span>`;
                statusText.textContent = `❌ ${t.invalid}`;
                statusText.style.color = 'var(--red)';
            }
        }

        convertBtn.addEventListener('click', convert);

        inputText.addEventListener('input', function() {
            const charCountEl = document.getElementById('charCount');
            charCountEl.textContent = this.value.length;
            convert();
        });

        swapBtn.addEventListener('click', function() {
            const result = resultBox.textContent;
            const t = getTexts();
            if (result && !result.includes(t.waiting) && !result.includes(t.invalid) && !result.includes('❌')) {
                inputText.value = result;
                dirBtns.forEach(b => b.classList.remove('active'));
                const newDir = currentDir === 'encode' ? 'decode' : 'encode';
                document.querySelector(`.dir-btn[data-dir="${newDir}"]`).classList.add('active');
                currentDir = newDir;
                updatePlaceholder();
                convert();
            } else {
                dirBtns.forEach(b => b.classList.remove('active'));
                const newDir = currentDir === 'encode' ? 'decode' : 'encode';
                document.querySelector(`.dir-btn[data-dir="${newDir}"]`).classList.add('active');
                currentDir = newDir;
                updatePlaceholder();
                convert();
            }
        });

        clearBtn.addEventListener('click', function() {
            inputText.value = '';
            const t = getTexts();
            resultBox.innerHTML = `<span class="empty">${t.waiting}</span>`;
            const charCountEl = document.getElementById('charCount');
            charCountEl.textContent = '0';
            statusText.textContent = t.statusReady;
            statusText.style.color = '';
        });

        copyBtn.addEventListener('click', function() {
            const text = resultBox.textContent;
            const t = getTexts();
            if (!text || text.includes(t.waiting) || text.includes(t.invalid) || text.includes('❌')) return;

            navigator.clipboard.writeText(text).then(() => {
                const original = copyBtn.textContent;
                copyBtn.textContent = t.copied;
                setTimeout(() => { copyBtn.textContent = original; }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const original = copyBtn.textContent;
                copyBtn.textContent = t.copied;
                setTimeout(() => { copyBtn.textContent = original; }, 2000);
            });
        });

        // =============================================================
        // 初始化
        // =============================================================
        updatePlaceholder();
        inputText.value = '你好世界 Hello World! 123 @#$%';
        convert();
    </script>
</body>
</html>

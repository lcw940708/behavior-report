<body>

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '🖼️ JPG 轉 PNG 免費工具',
                sub: '純前端處理 · 圖片唔會離開你嘅瀏覽器 · 零上傳',
                upload: '拖曳圖片到這裡，或點擊揀選檔案',
                hint: '支援 PNG、JPG、WebP',
                original: '📂 原圖',
                converted: '✅ 轉換後 (PNG)',
                download: '⬇️ 下載 PNG',
                reset: '🔄 重新揀選',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時轉換',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                otherTools: '🔧 其他工具：'
            },
            tw: {
                title: '🖼️ JPG 轉 PNG 免費工具',
                sub: '純前端處理 · 圖片不會離開你的瀏覽器 · 零上傳',
                upload: '拖曳圖片到這裡，或點擊選擇檔案',
                hint: '支援 PNG、JPG、WebP',
                original: '📂 原圖',
                converted: '✅ 轉換後 (PNG)',
                download: '⬇️ 下載 PNG',
                reset: '🔄 重新選擇',
                badge1: '🔒 私隱安全',
                badge2: '⚡ 即時轉換',
                badge3: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                otherTools: '🔧 其他工具：'
            },
            en: {
                title: '🖼️ JPG to PNG Free Converter',
                sub: '100% Client-side · Your images never leave your browser · Zero upload',
                upload: 'Drag & drop your image here, or click to select',
                hint: 'Supports PNG, JPG, WebP',
                original: '📂 Original',
                converted: '✅ Converted (PNG)',
                download: '⬇️ Download PNG',
                reset: '🔄 Reset',
                badge1: '🔒 Privacy Safe',
                badge2: '⚡ Instant Convert',
                badge3: '🆓 Free',
                storyLabel: '📖 You might also like',
                otherTools: '🔧 Other Tools:'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];
            document.getElementById('toolTitle').innerText = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('originalLabel').innerText = t.original;
            document.getElementById('convertedLabel').innerText = t.converted;
            document.getElementById('downloadBtn').innerHTML = t.download;
            document.getElementById('resetBtn').innerHTML = t.reset;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('otherToolsLabel').innerText = t.otherTools;

            document.querySelectorAll('.story-suggest .items a, .other-tools .tool-link').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const originalPreview = document.getElementById('originalPreview');
        const convertedPreview = document.getElementById('convertedPreview');
        const originalSize = document.getElementById('originalSize');
        const convertedSize = document.getElementById('convertedSize');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        let currentFile = null;
        let currentImageData = null;

        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                const msg = lang === 'en' ? 'Please upload an image file' : '請上傳圖片檔案';
                alert(msg);
                return;
            }
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataURL = e.target.result;
                originalPreview.src = dataURL;
                originalSize.innerText = formatSize(file.size);
                controls.classList.add('show');
                convertImage(file);
            };
            reader.readAsDataURL(file);
        }

        function convertImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const pngDataURL = canvas.toDataURL('image/png');
                    convertedPreview.src = pngDataURL;
                    const base64 = pngDataURL.split(',')[1];
                    const sizeInBytes = Math.round((base64.length * 3) / 4);
                    convertedSize.innerText = formatSize(sizeInBytes);
                    currentImageData = {
                        originalDataURL: originalPreview.src,
                        originalSize: file.size,
                        convertedDataURL: pngDataURL,
                        convertedSize: sizeInBytes
                    };
                    downloadBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        downloadBtn.addEventListener('click', () => {
            if (!currentImageData) return;
            const link = document.createElement('a');
            const baseName = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'converted';
            link.download = baseName + '.png';
            link.href = currentImageData.convertedDataURL;
            link.click();
        });

        resetBtn.addEventListener('click', () => {
            currentFile = null;
            currentImageData = null;
            controls.classList.remove('show');
            originalPreview.src = '';
            convertedPreview.src = '';
            originalSize.innerText = '';
            convertedSize.innerText = '';
            fileInput.value = '';
            downloadBtn.disabled = true;
        });
    </script>

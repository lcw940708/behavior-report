    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --text: #94a3b8;
            --cyan: #22d3ee;
            --red: #ef4444;
            --yellow: #fbbf24;
            --border: #24324f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }
        .lang-switch {
            text-align: center;
            margin-bottom: 20px;
        }
        .lang-switch a {
            color: var(--cyan);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .lang-switch a:hover {
            text-decoration: underline;
        }

        .tool-title {
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
        .tool-sub {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin: 10px 0 25px;
        }
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .badge {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--cyan);
        }

        .upload-area {
            border: 2px dashed rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.02);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .upload-area:hover {
            border-color: var(--cyan);
            background: rgba(34, 211, 238, 0.04);
        }
        .upload-area.dragover {
            border-color: var(--cyan);
            background: rgba(34, 211, 238, 0.08);
        }
        .upload-area .icon {
            font-size: 2.5rem;
            display: block;

        }
        .upload-area p {

            color: #cbd5e1;
        }
        .upload-area .hint {
            font-size: 0.8rem;

            margin-top: 4px;
        }
        #fileInput {
            display: none;
        }

        .drag-hint {
            display: none;
            text-align: center;
            padding: 12px;
            margin-top: 16px;
            background: rgba(34, 211, 238, 0.04);
            border: 1px dashed rgba(34, 211, 238, 0.15);
            border-radius: 8px;
            color: var(--cyan);
            font-size: 0.85rem;
        }
        .drag-hint.show {
            display: block;
        }
        .drag-hint .icon {
            font-size: 1.2rem;
            vertical-align: middle;
        }

        .page-list {
            margin-top: 20px;
            display: none;
        }
        .page-list.show {
            display: block;
        }

        .page-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            margin: 4px 0;
            gap: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(148, 163, 184, 0.06);

            cursor: grab;

        .page-item:hover {

            border-color: rgba(148, 163, 184, 0.12);
        }
        .page-item.sortable-ghost {

        }
        .page-item.sortable-chosen {
            background: rgba(34, 211, 238, 0.08);
            border-color: var(--cyan);
        }
        .page-item .drag-handle {
            color: #475569;
            font-size: 1.1rem;
            cursor: grab;
            flex-shrink: 0;
            user-select: none;
        }
        .page-item .drag-handle:hover {

        .page-item .page-order {

        }
        .page-item .remove-page {

            color: #64748b;
            cursor: pointer;
            font-size: 0.9rem;

            flex-shrink: 0;
        }
        .page-item .remove-page:hover {
            color: var(--red);
            background: rgba(239, 68, 68, 0.05);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }
        .btn-primary {
            background: var(--cyan);
            color: #0b0f19;
        }
        .btn-primary:hover {
            background: #67e8f9;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-preview {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--yellow);
        }
        .btn-preview:hover {
            background: rgba(251, 191, 36, 0.25);
            transform: translateY(-1px);
        }

        .loading {
            color: var(--cyan);
            text-align: center;
            padding: 20px;
            display: none;
            font-size: 1rem;
        }
        .loading.show {
            display: block;
        }
        .loading .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {

            }

        .error {
            color: #ef4444;

            background: rgba(239, 68, 68, 0.08);

            display: inline-flex;
            align-items: center;

        }
        .btn-download:hover {

            transform: translateY(-1px);
        }

        .info-bar {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 10px;
            text-align: center;
            padding: 8px;

        .other-tools {

        .story-suggest {

            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }
        .story-suggest .label {

        .story-suggest .items {

        .story-suggest .items a {

            text-decoration: none;

        .story-suggest .items a:hover {

        }

        footer {

        @media (max-width: 480px) {
            .container {

            }
            .page-item .page-label {

</head>
<body>
    <div class="container">

    <script>
        // =============================================================
        // 語言文字
        // =============================================================
        const texts = {
            hk: {
                title: '📄 PDF 頁面合併工具',
                sub: '上傳多個 PDF · 拖曳排序 · 合併成一個文件',
                badge1: '🔒 私隱安全',
                badge2: '🖱️ 拖曳排序',
                badge3: '👁️ 預覽結果',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會中意嘅連載或測驗',
                upload: '拖曳 PDF 檔案到這裡，或點擊揀選',
                hint: '支援多個 PDF，每個檔案會自動拆成逐頁顯示',
                dragHint: '拉動 ⋮ 圖示上／下調整頁面順序 · 點擊 ✕ 刪除唔要嘅頁面',
                totalPrefix: '共 ',
                totalSuffix: ' 頁',
                preview: '👁️ 預覽合併結果',
                merge: '📥 下載合併 PDF',
                clear: '🗑️ 清空全部',
                loading: '正在處理中，請稍候...',
                error: '處理失敗，請再試一次',
                result: '合併完成！',
                download: '⬇️ 下載合併後 PDF',
                fileSize: '檔案大小：',
                bytes: 'bytes',
                atLeast: '請至少上傳 2 頁進行合併',
                atLeastPreview: '請至少上傳 2 頁進行預覽',
                mergeFailed: '合併失敗，請再試一次',
                previewFailed: '預覽失敗，請再試一次'
            },
            tw: {
                title: '📄 PDF 頁面合併工具',
                sub: '上傳多個 PDF · 拖曳排序 · 合併成一個文件',
                badge1: '🔒 私隱安全',
                badge2: '🖱️ 拖曳排序',
                badge3: '👁️ 預覽結果',
                badge4: '🆓 完全免費',
                storyLabel: '📖 你可能會喜歡的連載或測驗',
                upload: '拖曳 PDF 檔案到這裡，或點擊選擇',
                hint: '支援多個 PDF，每個檔案會自動拆成逐頁顯示',
                dragHint: '拉動 ⋮ 圖示上／下調整頁面順序 · 點擊 ✕ 刪除不要的頁面',
                totalPrefix: '共 ',
                totalSuffix: ' 頁',
                preview: '👁️ 預覽合併結果',
                merge: '📥 下載合併 PDF',
                clear: '🗑️ 清空全部',
                loading: '正在處理中，請稍候...',
                error: '處理失敗，請再試一次',
                result: '合併完成！',
                download: '⬇️ 下載合併後 PDF',
                fileSize: '檔案大小：',
                bytes: 'bytes',
                atLeast: '請至少上傳 2 頁進行合併',
                atLeastPreview: '請至少上傳 2 頁進行預覽',
                mergeFailed: '合併失敗，請再試一次',
                previewFailed: '預覽失敗，請再試一次'
            },
            en: {
                title: '📄 PDF Page Merger',
                sub: 'Upload multiple PDFs · Drag & drop to sort · Merge into one file',
                badge1: '🔒 Privacy Safe',
                badge2: '🖱️ Drag & Drop',
                badge3: '👁️ Preview Result',
                badge4: '🆓 Free',
                storyLabel: '📖 You might also like',
                upload: 'Drag & drop your PDFs here, or click to select',
                hint: 'Supports multiple PDFs, each file will be split into individual pages',
                dragHint: 'Drag ⋮ up/down to reorder pages · Click ✕ to remove unwanted pages',
                totalPrefix: 'Total ',
                totalSuffix: ' pages',
                preview: '👁️ Preview Merged PDF',
                merge: '📥 Download Merged PDF',
                clear: '🗑️ Clear All',
                loading: 'Processing, please wait...',
                error: 'Failed, please try again',
                result: 'Merge complete!',
                download: '⬇️ Download Merged PDF',
                fileSize: 'File size：',
                bytes: 'bytes',
                atLeast: 'Please upload at least 2 pages to merge',
                atLeastPreview: 'Please upload at least 2 pages to preview',
                mergeFailed: 'Merge failed, please try again',
                previewFailed: 'Preview failed, please try again'
            }
        };

        let lang = 'hk';

        // =============================================================
        // 語言切換
        // =============================================================
        function switchLang(l) {
            lang = l;
            const t = texts[l];

            document.getElementById('toolTitle').innerHTML = t.title;
            document.getElementById('toolSub').innerText = t.sub;
            document.getElementById('badge1').innerText = t.badge1;
            document.getElementById('badge2').innerText = t.badge2;
            document.getElementById('badge3').innerText = t.badge3;
            document.getElementById('badge4').innerText = t.badge4;
            document.getElementById('storyLabel').innerText = t.storyLabel;
            document.getElementById('uploadText').innerText = t.upload;
            document.getElementById('uploadHint').innerText = t.hint;
            document.getElementById('dragHintText').innerHTML = t.dragHint;
            document.getElementById('totalPrefix').innerText = t.totalPrefix;
            document.getElementById('totalSuffix').innerText = t.totalSuffix;
            document.getElementById('previewText').innerText = t.preview.replace('👁️ ', '');
            document.getElementById('previewBtn').innerHTML = '👁️ ' + t.preview.replace('👁️ ', '');
            document.getElementById('mergeText').innerText = t.merge.replace('📥 ', '');
            document.getElementById('mergeBtn').innerHTML = '📥 ' + t.merge.replace('📥 ', '');
            document.getElementById('clearText').innerText = t.clear.replace('🗑️ ', '');
            document.getElementById('clearBtn').innerHTML = '🗑️ ' + t.clear.replace('🗑️ ', '');
            document.getElementById('loadingText').innerText = t.loading;
            document.getElementById('errorText').innerText = t.error;
            document.getElementById('resultMessage').innerText = t.result;
            document.getElementById('downloadText').innerText = t.download.replace('⬇️ ', '');
            document.getElementById('downloadBtn').innerHTML = '⬇️ ' + t.download.replace('⬇️ ', '');

            document.querySelectorAll('.story-suggest .items a').forEach(a => {
                try {
                    const url = new URL(a.href);
                    url.searchParams.set('lang', l);
                    a.href = url.toString();
                } catch (e) {}
            });
        }

        // =============================================================
        // 偵測語言（URL 參數優先）
        // =============================================================
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('lang') === 'en') return 'en';
            if (params.get('lang') === 'tw') return 'tw';
            if (params.get('lang') === 'hk') return 'hk';
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('en')) return 'en';
            if (userLang.includes('zh')) {
                if (userLang.includes('TW') || userLang.includes('tw')) return 'tw';
                return 'hk';
            }
            return 'hk';
        }

        const detectedLang = detectLanguage();
        switchLang(detectedLang);

        // =============================================================
        // 工具核心
        // =============================================================
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('dropArea');
        const pageList = document.getElementById('pageList');
        const pageItems = document.getElementById('pageItems');
        const previewBtn = document.getElementById('previewBtn');
        const mergeBtn = document.getElementById('mergeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultBox = document.getElementById('resultBox');
        const resultSize = document.getElementById('resultSize');
        const downloadBtn = document.getElementById('downloadBtn');
        const pageCount = document.getElementById('pageCount');
        const dragHint = document.getElementById('dragHint');

        let allPages = [];
        let mergedPdfData = null;
        let sortableInstance = null;

        function renderPageList() {
            const t = texts[lang];
            if (allPages.length === 0) {
                pageList.classList.remove('show');
                dragHint.classList.remove('show');
                return;
            }
            pageList.classList.add('show');
            dragHint.classList.add('show');

            if (sortableInstance) {
                sortableInstance.destroy();
                sortableInstance = null;
            }

            pageCount.innerText = allPages.length;

            let html = '';
            allPages.forEach((page, index) => {
                html += `
                    <div class="page-item" data-index="${index}">
                        <span class="drag-handle">⋮</span>
                        <span class="page-order">${index + 1}</span>
                        <span class="page-label">${page.fileName} · ${t.page} ${page.pageIndex + 1}</span>
                        <button class="remove-page" data-index="${index}">✕</button>
                    </div>
                `;
            });
            pageItems.innerHTML = html;

            document.querySelectorAll('.remove-page').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    allPages.splice(idx, 1);
                    renderPageList();
                    resetResult();
                });
            });

            const container = pageItems;
            sortableInstance = new Sortable(container, {
                animation: 150,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                onEnd: function() {
                    const items = container.querySelectorAll('.page-item');
                    const newPages = [];
                    items.forEach(el => {
                        const idx = parseInt(el.dataset.index);
                        if (allPages[idx]) {
                            newPages.push(allPages[idx]);
                        }
                    });
                    allPages = newPages;
                    renderPageList();
                    resetResult();
                }
            });
        }

        function resetResult() {
            resultBox.classList.remove('show');
            mergedPdfData = null;
        }

        function formatSize(bytes) {
            const t = texts[lang];
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        async function handleFiles(newFiles) {
            const pdfFiles = Array.from(newFiles).filter(f =>
                f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')
            );
            if (pdfFiles.length === 0) {
                alert('請上傳 PDF 檔案');
                return;
            }

            for (const file of pdfFiles) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                    const pageCount = pdf.getPageCount();

                    for (let i = 0; i < pageCount; i++) {
                        allPages.push({
                            fileName: file.name,
                            fileSize: file.size,
                            arrayBuffer: arrayBuffer,
                            pageIndex: i
                        });
                    }
                } catch (e) {
                    console.error('讀取 PDF 失敗:', file.name, e);
                    alert(`無法讀取 ${file.name}，可能係損壞嘅 PDF 檔案。`);
                }
            }

            renderPageList();
            resetResult();
        }

        dropArea.addEventListener('click', () => fileInput.click());
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
                fileInput.value = '';
            }
        });

        clearBtn.addEventListener('click', () => {
            allPages = [];
            if (sortableInstance) {
                sortableInstance.destroy();
                sortableInstance = null;
            }
            renderPageList();
            resetResult();
        });

        async function performMerge(shouldDownload = true) {
            const t = texts[lang];
            if (allPages.length < 2) {
                alert(t.atLeast);
                return null;
            }

            try {
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();

                for (const item of allPages) {
                    const pdf = await PDFDocument.load(item.arrayBuffer);
                    const [copiedPage] = await mergedPdf.copyPages(pdf, [item.pageIndex]);
                    mergedPdf.addPage(copiedPage);
                }

                const mergedBytes = await mergedPdf.save();

                if (shouldDownload) {
                    mergedPdfData = mergedBytes;
                    const sizeInMB = (mergedBytes.length / (1024 * 1024)).toFixed(2);
                    resultSize.innerText =
                        `${t.fileSize}${sizeInMB} MB（${mergedBytes.length.toLocaleString()} ${t.bytes}）· ${allPages.length} ${t.totalSuffix.trim()}`;
                    resultBox.classList.add('show');
                }

                return mergedBytes;

            } catch (err) {
                throw new Error(err.message || t.mergeFailed);
            }
        }

        previewBtn.addEventListener('click', async () => {
            const t = texts[lang];
            if (allPages.length < 2) {
                alert(t.atLeastPreview);
                return;
            }

            previewBtn.disabled = true;
            loading.classList.add('show');
            error.classList.remove('show');

            try {
                const mergedBytes = await performMerge(false);
                const blob = new Blob([mergedBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            } catch (err) {
                error.innerText = '❌ ' + (err.message || t.previewFailed);
                error.classList.add('show');
            }

            loading.classList.remove('show');
            previewBtn.disabled = false;
        });

        mergeBtn.addEventListener('click', async () => {
            const t = texts[lang];
            if (allPages.length < 2) {
                alert(t.atLeast);
                return;
            }

            mergeBtn.disabled = true;
            loading.classList.add('show');
            error.classList.remove('show');
            resultBox.classList.remove('show');

            try {
                await performMerge(true);
            } catch (err) {
                error.innerText = '❌ ' + (err.message || t.mergeFailed);
                error.classList.add('show');
            }

            loading.classList.remove('show');
            mergeBtn.disabled = false;
        });

        downloadBtn.addEventListener('click', () => {
            if (!mergedPdfData) return;
            const blob = new Blob([mergedPdfData], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'merged.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        renderPageList();
    </script>
</body>
</html>

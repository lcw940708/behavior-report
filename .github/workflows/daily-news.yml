name: Daily News Automation

on:
  schedule:
    # 每日香港時間朝早 8 點（UTC 0 點）自動執行，你可以自行修改時間
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援手動喺 GitHub 網頁按掣執行

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        run: |
          python update_news.py 
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git add news.html sitemap.xml articles/
          git diff --staged --quiet || git commit -m "Auto-update news and sitemap [skip ci]"
          git push

name: Daily News Auto Update

on:
  schedule:

    - cron: '0 */4 * * *'
  # 支援在 GitHub 網頁版手動按鈕觸發
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 檢查並拉取專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser trafilatura googlenewsdecoder beautifulsoup4
    - name: 執行新聞自動更新腳本
      env:
        # 將金鑰安全地帶入環境變數
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: python update_news.py

    - name: 自動提交並 Push 更新後的 HTML
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add news.html articles/
        git commit -m "Auto update news: $(date +'%Y-%m-%d %H:%M')" || exit 0
        git push


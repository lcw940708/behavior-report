name: Run News Aggregator

on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 個鐘自動跑一次
  workflow_dispatch:      # 允許你隨時手動按鈕觸發

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # 必須授權寫入權限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser trafilatura beautifulsoup4 googlenewsdecoder

      - name: Run update script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python update_news.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add news.html sitemap.xml articles/
          git diff --staged --quiet || git commit -m "Auto-update news and sitemap [skip ci]"
          git push

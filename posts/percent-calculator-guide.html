    const urlParams = new URLSearchParams(window.location.search);
    let lang = urlParams.get('lang') || 'hk';

    function updateLinkLang(linkId, baseUrl, l) {
        const el = document.getElementById(linkId);
        if (el) {
            el.href = `${baseUrl}?lang=${l}`;
        }
    }

    function renderArticle(l) {
        const data = articleData[l] || articleData.hk;
        document.getElementById('backLink').textContent = data.back;
        document.getElementById('artTitle').textContent = data.title;
        document.getElementById('artDate').textContent = data.date;
        document.getElementById('artTag').textContent = data.tag;
        document.getElementById('artContent').innerHTML = data.htmlContent;
        document.getElementById('ctaTitle').textContent = data.ctaTitle;
        document.getElementById('ctaDesc').textContent = data.ctaDesc;
        document.getElementById('ctaBtn').textContent = data.ctaBtn;

        // 動態帶入語言參數至頁面關鍵連結
        updateLinkLang('backLink', '../blog.html', l);
        updateLinkLang('brandLink', '../index.html', l);
        updateLinkLang('ctaBtn', '../tools/percent-calculator.html', l);
        updateLinkLang('footHome', '../index.html', l);
        updateLinkLang('footBlog', '../blog.html', l);
        updateLinkLang('footAbout', '../about.html', l);
        updateLinkLang('footPrivacy', '../privacy.html', l);

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === l) btn.classList.add('active');
        });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const selectedLang = this.dataset.lang;
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', selectedLang);
            window.history.pushState({}, '', newUrl);
            renderArticle(selectedLang);
        });
    });

    renderArticle(lang);
});
</script>

</body>
</html>

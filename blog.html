    const urlParams = new URLSearchParams(window.location.search);
    let currentLang = urlParams.get('lang') || 'hk';

    function createFeedSection(cat, isEn) {
        const feed = document.createElement('div');
        feed.className = 'article-feed';

        cat.articles.forEach(article => {
            const node = document.createElement('div');
            node.className = 'article-node';

            const itemTitle = isEn ? article.title.en : article.title.zh;
            const itemSummary = isEn ? article.summary.en : article.summary.zh;

            node.innerHTML = `
                <a href="${article.url}?lang=${currentLang}" class="article-node-link" title="${itemTitle}">${itemTitle}</a>
                <p class="article-node-summary">${itemSummary}</p>
            `;
            feed.appendChild(node);
        });

        return feed;
    }

    function renderPage(langKey) {
        currentLang = langKey;
        const isEn = (langKey === 'en');
        const langData = isEn ? i18n.en : i18n.zh;

        document.getElementById('backLink').textContent = langData.back;
        document.getElementById('pageTitle').textContent = langData.title;
        document.getElementById('pageDesc').textContent = langData.desc;
        document.getElementById('footHome').textContent = langData.footHome;
        document.getElementById('footAbout').textContent = langData.footAbout;
        document.getElementById('footContact').textContent = langData.footContact;
        document.getElementById('footPrivacy').textContent = langData.footPrivacy;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === langKey) {
                btn.classList.add('active');
            }
        });

        const bentoContainer = document.getElementById('bento-container');
        bentoContainer.innerHTML = '';

        articleCards.forEach((cardData, idx) => {
            const card = document.createElement('div');
            card.className = `bento-card ${cardData.span}`;

            if (cardData.type === 'single') {
                const header = document.createElement('div');
                header.className = 'bento-header';
                const catTitle = isEn ? cardData.categoryName.en : cardData.categoryName.zh;
                header.innerHTML = `
                    <h3 class="bento-title">${catTitle}</h3>
                    <span class="badge-count">${cardData.articles.length} P</span>
                `;
                card.appendChild(header);
                card.appendChild(createFeedSection(cardData, isEn));
            } else if (cardData.type === 'merged') {
                cardData.subCategories.forEach((subCat, index) => {
                    if (index > 0) {
                        const divider = document.createElement('div');
                        divider.className = 'merged-divider';
                        card.appendChild(divider);
                    }

                    const header = document.createElement('div');
                    header.className = 'bento-header';
                    const catTitle = isEn ? subCat.categoryName.en : subCat.categoryName.zh;
                    header.innerHTML = `
                        <h3 class="bento-title">${catTitle}</h3>
                        <span class="badge-count">${subCat.articles.length} P</span>
                    `;
                    card.appendChild(header);
                    card.appendChild(createFeedSection(subCat, isEn));
                });
            }

            bentoContainer.appendChild(card);
        });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const selectedLang = this.dataset.lang;
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', selectedLang);
            window.history.pushState({}, '', newUrl);
            renderPage(selectedLang);
        });
    });

    renderPage(currentLang);
});

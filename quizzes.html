    <style>
        :root { 
            --bg-color: #0b0f19; 
            --text-color: #94a3b8; 
            --accent-cyan: #22d3ee; 
            --accent-red: #ef4444; 
            --border-color: rgba(148, 163, 184, 0.15);
        }
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { max-width: 1080px; width: 100%; }
        
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .header-nav a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: bold;
        }

        .page-title {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 10px;
        }
        .page-desc {
            color: var(--text-color);
            margin-bottom: 30px;
        }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .card { 
            background: rgba(36, 50, 79, 0.3); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 20px; 
            transition: all 0.25s ease; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover { 
            border-color: var(--accent-cyan); 
            background: rgba(34, 211, 238, 0.05); 
            transform: translateY(-2px);
        }
        .card .card-title { color: #ffffff; font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .card .card-title .icon { margin-right: 8px; }
        .card .card-desc { font-size: 0.9rem; color: var(--text-color); margin-bottom: 16px; line-height: 1.5; flex-grow: 1; }
        .card .card-link { color: var(--accent-cyan); text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .card .card-link:hover { text-decoration: underline; }

        .footer { 
            margin-top: 60px; 
            padding-top: 25px; 
            border-top: 1px solid rgba(148, 163, 184, 0.1); 
            text-align: center; 
            font-size: 0.85rem; 
            color: #555; 
        }
        .footer a { color: #666; text-decoration: none; margin: 0 10px; }
        .footer a:hover { color: #aaa; }
    </style>
</head>
